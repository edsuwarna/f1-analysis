  // ── Championship Standings ──
  async function loadChampionship() {
    currentView = 'standings';
    localStorage.setItem('f1-view', 'standings');
    const el = document.getElementById('content');
    el.innerHTML = '<div class="text-center py-20" style="color:var(--text-muted)">Loading championship standings...</div>';
    try {
      const data = await api('/analytics/championship?year=2026');
      const drivers = data.driver_standings;
      const constructors = data.constructor_standings;
      const races = data.races;

      if (!drivers || drivers.length === 0) {
        el.innerHTML = '<div class="text-center py-20" style="color:var(--text-muted)">No championship data available yet</div>';
        return;
      }

      let html = `
        <div class="mb-6">
          <h2 class="text-xl font-bold">🏆 2026 Championship Standings</h2>
          <p class="text-sm" style="color:var(--text-secondary)">${data.races_completed} races completed</p>
        </div>
      `;

      // Driver standings
      const maxPts = drivers[0]?.points || 1;
      html += `
        <div class="card p-5 mb-6">
          <div class="collapse-header flex items-center justify-between mb-2" onclick="toggleCollapse(this)">
            <h3 class="font-semibold text-sm">👨‍👩‍👧‍👦 Driver Standings
              <span class="text-xs font-normal ml-2" style="color:var(--text-muted)">${drivers.length} drivers · season points</span>
            </h3>
            <span class="collapse-icon">▼</span>
          </div>
          <div class="collapse-body closed">
            <div class="overflow-x-auto">
              <table>
                <thead>
                  <tr>
                    <th>Pos</th><th>Driver</th><th>Team</th>
                    <th class="text-right">Points</th><th>Progress</th>
                  </tr>
                </thead>
                <tbody>
      `;

      for (const d of drivers) {
        const pct = (d.points / maxPts * 100).toFixed(0);
        const teamC = d.team_colour ? teamColor(d.team_colour) : '#666';
        const medal = d.position === 1 ? '🥇' : d.position === 2 ? '🥈' : d.position === 3 ? '🥉' : d.position;
        html += `
          <tr>
            <td class="font-bold" style="color:${d.position <= 3 ? ['#ffd700','#c0c0c0','#cd7f32'][d.position-1] : 'var(--text-secondary)'}">${medal}</td>
            <td class="font-medium">${d.acronym}</td>
            <td>${teamBadge(d.team_name, d.team_colour)}</td>
            <td class="text-right font-mono font-bold">${d.points}</td>
            <td style="width:150px">
              <div style="background:var(--bg-primary);border-radius:4px;height:8px;overflow:hidden">
                <div style="width:${pct}%;height:100%;background:${teamC};border-radius:4px;transition:width 0.5s"></div>
              </div>
            </td>
          </tr>
        `;
      }
      html += `</tbody></table></div></div></div>`;

      // Constructor standings
      const maxCPts = constructors[0]?.points || 1;
      html += `
        <div class="card p-5 mb-6">
          <div class="collapse-header flex items-center justify-between mb-2" onclick="toggleCollapse(this)">
            <h3 class="font-semibold text-sm">🏭 Constructor Standings
              <span class="text-xs font-normal ml-2" style="color:var(--text-muted)">${constructors.length} teams · season points</span>
            </h3>
            <span class="collapse-icon">▼</span>
          </div>
          <div class="collapse-body closed">
            <div class="overflow-x-auto">
              <table>
                <thead>
                  <tr><th>Pos</th><th>Team</th><th class="text-right">Points</th><th>Progress</th></tr>
                </thead>
                <tbody>
      `;
      for (const c of constructors) {
        const pct = (c.points / maxCPts * 100).toFixed(0);
        html += `
          <tr>
            <td class="font-bold" style="color:${c.position <= 3 ? ['#ffd700','#c0c0c0','#cd7f32'][c.position-1] : 'var(--text-secondary)'}">${c.position}</td>
            <td>${teamBadge(c.team_name, '')}</td>
            <td class="text-right font-mono font-bold">${c.points}</td>
            <td style="width:150px">
              <div style="background:var(--bg-primary);border-radius:4px;height:8px;overflow:hidden">
                <div style="width:${pct}%;height:100%;background:#e10600;border-radius:4px;transition:width 0.5s"></div>
              </div>
            </td>
          </tr>
        `;
      }
      html += `</tbody></table></div></div></div>`;

      // Race results per round — collapsible cards, Race + Sprint separated
      html += `
        <div class="card p-5 mb-6">
          <h3 class="font-semibold text-sm mb-4">📋 Race Results</h3>
          <div class="space-y-3">
      `;
      for (const race of races) {
        // Separate Race and Sprint results (ALL drivers, sorted by position)
        const raceResults = race.results.filter(r => r.session_name === 'Race' || r.session_name === undefined).sort((a, b) => a.position - b.position);
        const sprintResults = race.results.filter(r => r.session_name === 'Sprint').sort((a, b) => a.position - b.position);
        const hasSprint = sprintResults.length > 0;
        const sprintKeys = sprintResults.reduce((acc, r) => { acc[r.driver_number] = r; return acc; }, {});
        const raceKeys = raceResults.reduce((acc, r) => { acc[r.driver_number] = r; return acc; }, {});
        html += `
          <div class="card" style="overflow:hidden">
            <div class="collapse-header flex items-center justify-between p-4" onclick="toggleCollapse(this)">
              <h4 class="text-sm font-semibold" style="color:var(--text-primary)">🏎️ ${race.race_name}${hasSprint ? ' <span style="color:var(--text-muted);font-weight:400;font-size:11px">· Sprint</span>' : ''}</h4>
              <span class="collapse-icon">▼</span>
            </div>
            <div class="collapse-body closed">
              <div style="padding:0 16px 16px">
        `;
        // Race results — ALL drivers in position order
        if (raceResults.length > 0) {
          html += `<div class="text-xs font-semibold mb-2" style="color:var(--text-muted)">🏁 Race</div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-1.5 mb-3">`;
          for (const r of raceResults) {
            const bg = r.team_colour ? teamColor(r.team_colour) : '#666';
            const pos = r.position;
            const pts = r.points;
            const medal = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : `P${pos}`;
            const ptsBadge = pts > 0 ? `<span class="font-bold" style="color:#fff;background:${bg};border-radius:4px;padding:0 5px;font-size:10px">${pts}</span>` : '';
            html += `<div class="flex items-center gap-1.5 text-xs" style="background:${bg}22;border:1px solid ${bg}44;border-radius:6px;padding:4px 8px">
              <span style="font-weight:700;font-size:11px">${medal}</span>
              <span style="font-weight:600">${r.acronym}</span>
              <span style="margin-left:auto">${ptsBadge}</span>
            </div>`;
          }
          html += `</div>`;
        }
        // Sprint results — ALL drivers in position order
        if (hasSprint && sprintResults.length > 0) {
          html += `<div class="text-xs font-semibold mb-2" style="color:var(--text-muted)">⚡ Sprint</div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-1.5">`;
          for (const r of sprintResults) {
            const bg = r.team_colour ? teamColor(r.team_colour) : '#666';
            const pts = r.points;
            const pos = r.position;
            const medal = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : `P${pos}`;
            const ptsBadge = pts > 0 ? `<span class="font-bold" style="color:#fff;background:${bg};border-radius:4px;padding:0 5px;font-size:10px">${pts}</span>` : '';
            html += `<div class="flex items-center gap-1.5 text-xs" style="background:${bg}22;border:1px solid ${bg}44;border-radius:6px;padding:4px 8px">
              <span style="font-weight:700;font-size:11px">${medal}</span>
              <span style="font-weight:600">${r.acronym}</span>
              <span style="margin-left:auto">${ptsBadge}</span>
            </div>`;
          }
          html += `</div>`;
        }
        html += `
              </div>
            </div>
          </div>
        `;
      }
      html += `</div></div>`;

      el.innerHTML = html;
    } catch(e) {
      el.innerHTML = `<div class="text-center py-20" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  // ── Init ──
  initTheme();
  const savedView = localStorage.getItem('f1-view');
  const savedState = localStorage.getItem('f1-state');
  if (savedView === 'standings') {
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    const nav = document.getElementById('nav-standings');
    if (nav) nav.classList.add('active');
    loadChampionship();
  } else if (savedView === 'sessions' && savedState) {
    try {
      const s = JSON.parse(savedState);
      if (s.meetingId && s.meetingName) {
        loadSessions(s.meetingId, s.meetingName);
      } else { loadRaces(); }
    } catch(e) { loadRaces(); }
  } else if (savedView === 'session' && savedState) {
    try {
      const s = JSON.parse(savedState);
      if (s.meetingId && s.sessionId && s.sessionName && s.sessionType) {
        loadSession(s.sessionId, s.meetingId, s.meetingName, s.sessionName, s.sessionType);
      } else { loadRaces(); }
    } catch(e) { loadRaces(); }
  } else {
    loadRaces();
  }
  </script>
