<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Analysis 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0f1115; color: #e1e1e6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .card { background: #1a1d24; border: 1px solid #2d3139; border-radius: 10px; }
  .f1-red { color: #e10600; }
  .bg-f1-red { background: #e10600; }
  .border-f1 { border-color: #2d3139; }
  .sector-badge { font-variant-numeric: tabular-nums; }
  .team-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .nav-link { color: #8b949e; cursor: pointer; padding: 8px 16px; border-radius: 6px; transition: all .15s; }
  .nav-link:hover { color: #fff; background: rgba(255,255,255,.05); }
  .nav-link.active { color: #fff; background: #e10600; }
  .loading { opacity: .5; pointer-events: none; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 12px; font-size: 11px; text-transform: uppercase; color: #8b949e; border-bottom: 1px solid #2d3139; }
  td { padding: 8px 12px; border-bottom: 1px solid #1f2329; font-size: 13px; }
  tr:hover td { background: rgba(255,255,255,.03); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-soft { background: #333; color: #e1e1e6; }
  .badge-medium { background: #555; color: #fff; }
  .badge-hard { background: #777; color: #fff; }
  .badge-inter { background: #2d7d46; color: #fff; }
  .badge-wet { background: #1a5c7a; color: #fff; }
</style>
</head>
<body>
  <div class="max-w-6xl mx-auto px-4 py-6">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold"><span class="f1-red">F1</span> Analysis <span class="text-sm text-gray-500">2026</span></h1>
        <p class="text-sm text-gray-400 mt-1">Telemetry, sector times &amp; race data</p>
      </div>
      <div class="flex gap-2">
        <button onclick="loadRaces()" class="nav-link active" id="nav-races">🏁 Races</button>
        <button onclick="showAbout()" class="nav-link" id="nav-about">ℹ️ About</button>
      </div>
    </div>

    <!-- Main Content -->
    <div id="content">
      <div class="text-center py-20 text-gray-500">Loading 2026 race data...</div>
    </div>
  </div>

  <script>
  // Default: relative path (local dev via FastAPI)
  // CF Pages: sed -i \"s|const API = ''|const API = 'https://f1-api.edsuwarna.id'|g\" frontend/index.html
  const API = '';
  let meetings = [];
  let currentView = 'races';

  // ── Navigation ──
  document.querySelectorAll('.nav-link').forEach(el => {
    el.addEventListener('click', function() {
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      this.classList.add('active');
    });
  });

  // ── API Helpers ──
  async function api(path) {
    const res = await fetch(`${API}/api${path}`);
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function compoundBadge(c) {
    if (!c) return '';
    const map = { 'SOFT': 'badge-soft', 'MEDIUM': 'badge-medium', 'HARD': 'badge-hard', 'INTERMEDIATE': 'badge-inter', 'WET': 'badge-wet' };
    return `<span class="badge ${map[c] || 'badge-soft'}">${c}</span>`;
  }

  function formatTime(s) {
    if (!s || s <= 0) return '—';
    if (s > 60) {
      const m = Math.floor(s / 60);
      const sec = (s % 60).toFixed(3);
      return `${m}:${sec.padStart(6, '0')}`;
    }
    return s.toFixed(3) + 's';
  }

  function teamColor(colour) {
    if (!colour) return '#666';
    return '#' + colour;
  }

  // ── Views ──
  async function loadRaces() {
    currentView = 'races';
    const el = document.getElementById('content');
    el.innerHTML = '<div class="text-center py-20 text-gray-500">Loading...</div>';
    try {
      meetings = await api('/meetings');
      renderRaceList();
    } catch(e) {
      el.innerHTML = `<div class="text-center py-20 text-red-400">Error: ${e.message}</div>`;
    }
  }

  function renderRaceList() {
    const el = document.getElementById('content');
    const completed = meetings.filter(m => m.name !== 'Pre-Season Testing');
    let html = `
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      ${completed.map(m => `
        <div class="card p-5 cursor-pointer hover:border-gray-500 transition" onclick="loadSessions(${m.id}, '${m.name}')">
          <div class="flex items-center gap-3 mb-3">
            <span class="text-2xl">🏎️</span>
            <div>
              <div class="font-semibold text-sm">${m.name}</div>
              <div class="text-xs text-gray-400">${m.location}, ${m.country_name}</div>
            </div>
          </div>
          <div class="flex justify-between text-xs text-gray-400">
            <span>🗓️ ${m.date_start ? m.date_start.slice(0,10) : 'TBD'}</span>
            <span>🏟️ ${m.circuit_name || '—'}</span>
          </div>
        </div>
      `).join('')}
      </div>
      <div class="mt-6 text-xs text-gray-500 text-center">${completed.length} race weekend(s)</div>
    `;
    el.innerHTML = html;
  }

  async function loadSessions(meetingId, meetingName) {
    const el = document.getElementById('content');
    el.innerHTML = '<div class="text-center py-20 text-gray-500">Loading sessions...</div>';
    try {
      const sessions = await api(`/meetings/${meetingId}/sessions`);
      let html = `
        <div class="mb-6">
          <button onclick="loadRaces()" class="text-sm text-gray-400 hover:text-white transition">&larr; Back to races</button>
          <h2 class="text-xl font-bold mt-2">${meetingName}</h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      `;
      for (const s of sessions) {
        const icon = s.session_type === 'Race' ? '🏁' : s.session_type === 'Qualifying' ? '⏱️' : '🔧';
        html += `
          <div class="card p-5 cursor-pointer hover:border-gray-500 transition" onclick="loadSession(${s.id}, ${meetingId}, '${meetingName}', '${s.session_name}')">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${icon}</span>
              <div>
                <div class="font-semibold text-sm">${s.session_name}</div>
                <div class="text-xs text-gray-400">${s.session_type}</div>
              </div>
            </div>
          </div>
        `;
      }
      html += `</div>`;
      el.innerHTML = html;
    } catch(e) {
      el.innerHTML = `<div class="text-center py-20 text-red-400">Error: ${e.message}</div>`;
    }
  }

  async function loadSession(sessionId, meetingId, meetingName, sessionName) {
    const el = document.getElementById('content');
    el.innerHTML = '<div class="text-center py-20 text-gray-500">Loading session data...</div>';

    try {
      const [sectors, drivers, stints, pits] = await Promise.all([
        api(`/sessions/${sessionId}/sectors`),
        api(`/sessions/${sessionId}/drivers`),
        api(`/sessions/${sessionId}/stints`),
        api(`/sessions/${sessionId}/pit-stops`),
      ]);

      // Build driver map
      const driverMap = {};
      drivers.forEach(d => { driverMap[d.driver_number] = d; });

      let html = `
        <div class="mb-6">
          <button onclick="loadSessions(${meetingId}, '${meetingName}')" class="text-sm text-gray-400 hover:text-white transition">&larr; Back</button>
          <h2 class="text-xl font-bold mt-2">${meetingName} — ${sessionName}</h2>
        </div>

        <!-- Sector Times -->
        <div class="card p-5 mb-6">
          <h3 class="font-semibold text-sm mb-4">🏆 Best Sector Times</h3>
          <div class="overflow-x-auto">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Driver</th>
                  <th>Team</th>
                  <th class="text-right">Sector 1</th>
                  <th class="text-right">Sector 2</th>
                  <th class="text-right">Sector 3</th>
                  <th class="text-right">Best Lap</th>
                  <th class="text-right">Laps</th>
                </tr>
              </thead>
              <tbody>
      `;
      if (sectors.length === 0) {
        html += `<tr><td colspan="8" class="text-center text-gray-500 py-8">No sector data available</td></tr>`;
      } else {
        sectors.forEach((d, i) => {
          const bestS1 = d.best_sector_1 === Math.min(...sectors.filter(x=>x.best_sector_1).map(x=>x.best_sector_1));
          const bestS2 = d.best_sector_2 === Math.min(...sectors.filter(x=>x.best_sector_2).map(x=>x.best_sector_2));
          const bestS3 = d.best_sector_3 === Math.min(...sectors.filter(x=>x.best_sector_3).map(x=>x.best_sector_3));
          html += `
            <tr>
              <td class="text-gray-400">${i + 1}</td>
              <td class="font-medium">${d.acronym || '—'}</td>
              <td><span class="team-dot" style="background:${teamColor(d.team_colour)}"></span>${d.team || '—'}</td>
              <td class="text-right font-mono ${bestS1 ? 'text-green-400 font-bold' : ''}">${formatTime(d.best_sector_1)}</td>
              <td class="text-right font-mono ${bestS2 ? 'text-green-400 font-bold' : ''}">${formatTime(d.best_sector_2)}</td>
              <td class="text-right font-mono ${bestS3 ? 'text-green-400 font-bold' : ''}">${formatTime(d.best_sector_3)}</td>
              <td class="text-right font-mono font-bold">${formatTime(d.best_lap)}</td>
              <td class="text-right text-gray-400">${d.total_laps}</td>
            </tr>
          `;
        });
      }
      html += `</tbody></table></div></div>`;

      // Stints (tyre strategy)
      if (stints.length > 0) {
        const stintByDriver = {};
        stints.forEach(s => {
          if (!stintByDriver[s.driver_number]) stintByDriver[s.driver_number] = [];
          stintByDriver[s.driver_number].push(s);
        });

        html += `
          <div class="card p-5 mb-6">
            <h3 class="font-semibold text-sm mb-4">🛞 Tyre Strategy</h3>
            <div class="overflow-x-auto">
              <table>
                <thead><tr><th>Driver</th><th>Team</th><th colspan="6">Stints</th></tr></thead>
                <tbody>
        `;
        const topDrivers = Object.entries(stintByDriver).slice(0, 10);
        for (const [dn, sts] of topDrivers) {
          const drv = driverMap[parseInt(dn)];
          const stintCells = sts.map(s =>
            `<span class="text-xs mr-1">${compoundBadge(s.compound)} <span class="text-gray-400">L${s.lap_start}-${s.lap_end}</span></span>`
          ).join('');
          html += `
            <tr>
              <td class="font-medium">${drv ? drv.name_acronym : dn}</td>
              <td><span class="team-dot" style="background:${teamColor(drv?.team_colour)}"></span>${drv?.team_name || '—'}</td>
              <td colspan="6">${stintCells}</td>
            </tr>
          `;
        }
        html += `</tbody></table></div></div>`;
      }

      // Compare button
      html += `
        <div class="card p-5">
          <h3 class="font-semibold text-sm mb-4">🤜🤛 Driver Comparison</h3>
          <div class="flex flex-wrap gap-3 items-center">
            <select id="comp-drv1" class="bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm">
              ${drivers.map(d => `<option value="${d.driver_number}">${d.full_name} (${d.name_acronym})</option>`).join('')}
            </select>
            <span class="text-gray-500">vs</span>
            <select id="comp-drv2" class="bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm">
              ${drivers.map(d => `<option value="${d.driver_number}">${d.full_name} (${d.name_acronym})</option>`).join('')}
            </select>
            <button onclick="compareDrivers(${sessionId})" class="bg-f1-red text-white px-4 py-2 rounded text-sm font-medium hover:opacity-90 transition">Compare</button>
          </div>
          <div id="comp-result" class="mt-4"></div>
        </div>
      `;

      el.innerHTML = html;
    } catch(e) {
      el.innerHTML = `<div class="text-center py-20 text-red-400">Error: ${e.message}</div>`;
    }
  }

  async function compareDrivers(sessionId) {
    const d1 = document.getElementById('comp-drv1').value;
    const d2 = document.getElementById('comp-drv2').value;
    const el = document.getElementById('comp-result');
    el.innerHTML = '<div class="text-center py-8 text-gray-500">Comparing...</div>';

    try {
      const data = await api(`/sessions/${sessionId}/compare/${d1}/${d2}`);
      const lapsA = data.driver_a;
      const lapsB = data.driver_b;
      const maxLaps = Math.max(lapsA.length, lapsB.length);

      let html = `
        <div class="overflow-x-auto mt-4">
          <table>
            <thead>
              <tr>
                <th>Lap</th>
                <th class="text-right">Driver A</th>
                <th class="text-right">Δ</th>
                <th class="text-right">Driver B</th>
                <th class="text-right">S1 A</th>
                <th class="text-right">S1 B</th>
                <th class="text-right">S2 A</th>
                <th class="text-right">S2 B</th>
                <th class="text-right">S3 A</th>
                <th class="text-right">S3 B</th>
              </tr>
            </thead>
            <tbody>
      `;

      for (let i = 0; i < maxLaps; i++) {
        const a = lapsA[i] || {};
        const b = lapsB[i] || {};
        const delta = a.lap_duration && b.lap_duration ? (a.lap_duration - b.lap_duration) : null;
        const color = delta ? (delta < 0 ? 'text-green-400' : 'text-red-400') : '';
        html += `
          <tr>
            <td class="text-gray-400">${i + 1}</td>
            <td class="text-right font-mono">${formatTime(a.lap_duration)}</td>
            <td class="text-right font-mono ${color} font-bold">${delta !== null ? (delta > 0 ? '+' : '') + delta.toFixed(3) : '—'}</td>
            <td class="text-right font-mono">${formatTime(b.lap_duration)}</td>
            <td class="text-right font-mono">${formatTime(a.sector_1)}</td>
            <td class="text-right font-mono">${formatTime(b.sector_1)}</td>
            <td class="text-right font-mono">${formatTime(a.sector_2)}</td>
            <td class="text-right font-mono">${formatTime(b.sector_2)}</td>
            <td class="text-right font-mono">${formatTime(a.sector_3)}</td>
            <td class="text-right font-mono">${formatTime(b.sector_3)}</td>
          </tr>
        `;
      }
      html += `</tbody></table></div>`;
      el.innerHTML = html;
    } catch(e) {
      el.innerHTML = `<div class="text-center py-8 text-red-400">Error: ${e.message}</div>`;
    }
  }

  function showAbout() {
    currentView = 'about';
    document.getElementById('content').innerHTML = `
      <div class="card p-8 max-w-2xl mx-auto text-center">
        <h2 class="text-xl font-bold mb-4">🏎️ F1 Analysis 2026</h2>
        <p class="text-gray-400 mb-6">Real-time Formula 1 telemetry, sector times, tyre strategy, and driver comparison platform.</p>
        <div class="text-left text-sm text-gray-400 space-y-2">
          <p><strong>Data Source:</strong> OpenF1 API + FastAPI Backend</p>
          <p><strong>Database:</strong> PostgreSQL 18</p>
          <p><strong>Status:</strong> ✅ Phase 1 Complete (Ingestion + API)</p>
          <p><strong>Season:</strong> 2026 (7 races ingested)</p>
        </div>
        <div class="mt-6 text-xs text-gray-500">
          F1 is a trademark of Formula One Licensing B.V. This is an unofficial project.
        </div>
      </div>
    `;
  }

  // ── Init ──
  loadRaces();
  </script>
</body>
</html>
