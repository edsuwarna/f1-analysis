  // ── Pit Strategy ──
  async function loadPitStrategy(sessionId) {
    const el = document.getElementById('pitstrategy-chart-area');
    el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">Loading pit strategy data...</div>';

    if (pitStrategyChartInstance) { pitStrategyChartInstance.destroy(); pitStrategyChartInstance = null; }

    try {
      const data = await api(`/analytics/sessions/${sessionId}/pit-strategy`);
      const drivers = data.drivers;

      if (!drivers || drivers.length === 0) {
        el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">No pit strategy data available</div>';
        return;
      }

      // Find fastest pit stop + slowest
      let fastestPit = 999, slowestPit = 0;
      let fastestD = '', slowestD = '', fastestL = 0, slowestL = 0;
      for (const d of drivers) {
        for (const p of d.pit_analysis) {
          if (p.pit_duration && p.pit_duration < fastestPit) {
            fastestPit = p.pit_duration;
            fastestD = d.acronym;
            fastestL = p.lap_number;
          }
          if (p.pit_duration && p.pit_duration > slowestPit && p.pit_duration < 200) {
            slowestPit = p.pit_duration;
            slowestD = d.acronym;
            slowestL = p.lap_number;
          }
        }
      }

      // Stats
      let html = `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-xs" style="color:var(--text-secondary)">
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${data.total_stops}</div>
            <div>Total Pit Stops</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${drivers.length}</div>
            <div>Drivers with Stops</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:#16a34a">${fastestPit.toFixed(1)}s</div>
            <div>Fastest Stop (${fastestD} L${fastestL})</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:#dc2626">${slowestPit.toFixed(1)}s</div>
            <div>Slowest Stop (${slowestD} L${slowestL})</div>
          </div>
        </div>
      `;

      // Pit stop timing chart
      html += `
        <div class="text-xs mb-3" style="color:var(--text-muted)">
          <strong>Pit Stop Duration Distribution</strong> — each dot = one stop. Green = fast (&lt;23s), Red = slow (&gt;30s).
        </div>
        <div class="relative" style="height:250px;margin-bottom:16px">
          <canvas id="pitstrategy-chart-canvas-${sessionId}"></canvas>
        </div>
      `;

      // Pit stops detail table
      html += `
        <div class="overflow-x-auto mb-4" style="max-height:500px;overflow-y:auto">
          <table>
            <thead>
              <tr>
                <th>Driver</th><th>Lap</th>
                <th class="text-right">Pit Time</th>
                <th class="text-right">In-Lap</th>
                <th class="text-right">Out-Lap</th>
                <th class="text-right">Avg Before</th>
                <th class="text-right">Avg After</th>
                <th class="text-right">Δ (After-Before)</th>
                <th class="text-right">Pit Loss</th>
              </tr>
            </thead>
            <tbody>
      `;

      // Sort drivers: those with best avg improvement first
      const allStops = [];
      for (const d of drivers) {
        for (const p of d.pit_analysis) {
          const delta = (p.avg_after && p.avg_before) ? (p.avg_after - p.avg_before) : null;
          allStops.push({ ...p, acronym: d.acronym, team_colour: d.team_colour, delta });
        }
      }
      allStops.sort((a, b) => (b.pit_duration || 99) - (a.pit_duration || 99));

      for (const stop of allStops) {
        const color = stop.team_colour ? teamColor(stop.team_colour) : '#666';
        const isFast = stop.pit_duration && stop.pit_duration < 23;
        const isSlow = stop.pit_duration && stop.pit_duration > 30;
        const delta = stop.delta;
        const deltaColor = delta !== null ? (delta < -0.5 ? '#16a34a' : delta > 0.5 ? '#dc2626' : 'var(--text-secondary)') : '';
        const deltaIcon = delta !== null ? (delta < -0.5 ? ' 🟢' : delta > 0.5 ? ' 🔴' : '') : '';
        html += `
          <tr>
            <td class="font-medium" style="color:${color}">${stop.acronym}</td>
            <td style="color:var(--text-secondary)">L${stop.lap_number}</td>
            <td class="text-right font-mono ${isFast ? 'font-bold' : ''}" style="${isFast ? 'color:#16a34a' : isSlow ? 'color:#dc2626' : ''}">${stop.pit_duration ? stop.pit_duration.toFixed(1) + 's' : '—'}</td>
            <td class="text-right font-mono" style="color:var(--text-secondary)">${stop.in_lap_time ? stop.in_lap_time.toFixed(3) + 's' : '—'}</td>
            <td class="text-right font-mono" style="color:var(--text-secondary)">${stop.out_lap_time ? stop.out_lap_time.toFixed(3) + 's' : '—'}</td>
            <td class="text-right font-mono" style="color:var(--text-secondary)">${stop.avg_before ? stop.avg_before.toFixed(3) + 's' : '—'}</td>
            <td class="text-right font-mono" style="color:var(--text-secondary)">${stop.avg_after ? stop.avg_after.toFixed(3) + 's' : '—'}</td>
            <td class="text-right font-mono" style="color:${deltaColor};font-weight:${delta !== null && Math.abs(delta) > 0.5 ? '700' : '400'}">${delta !== null ? (delta > 0 ? '+' : '') + delta.toFixed(3) + 's' + deltaIcon : '—'}</td>
            <td class="text-right font-mono" style="color:${stop.pit_duration && stop.pit_duration > 25 ? '#dc2626' : '#16a34a'}">${stop.pit_duration ? stop.pit_duration.toFixed(1) + 's' : '—'}</td>
          </tr>
        `;
      }
      html += `</tbody></table></div>`;

      el.innerHTML = html;

      // Render chart
      setTimeout(() => {
        const canvas = document.getElementById(`pitstrategy-chart-canvas-${sessionId}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const isLight = document.documentElement.classList.contains('light');
        const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
        const textColor = isLight ? '#64748b' : '#8b949e';

        // Group by lap number for bar chart
        const stopsByLap = {};
        for (const stop of allStops) {
          const ln = stop.lap_number;
          if (!stopsByLap[ln]) stopsByLap[ln] = [];
          stopsByLap[ln].push(stop);
        }

        const labels = Object.keys(stopsByLap).map(Number).sort((a, b) => a - b);
        const fastCounts = [];
        const midCounts = [];
        const slowCounts = [];

        for (const ln of labels) {
          const stops = stopsByLap[ln];
          fastCounts.push(stops.filter(s => s.pit_duration < 23).length);
          midCounts.push(stops.filter(s => s.pit_duration >= 23 && s.pit_duration <= 30).length);
          slowCounts.push(stops.filter(s => s.pit_duration > 30 && s.pit_duration < 200).length);
        }

        pitStrategyChartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: 'Fast (<23s)', data: fastCounts, backgroundColor: 'rgba(22,163,74,0.7)', borderColor: '#16a34a', borderWidth: 1, borderRadius: 2 },
              { label: 'Normal (23-30s)', data: midCounts, backgroundColor: 'rgba(245,158,11,0.7)', borderColor: '#f59e0b', borderWidth: 1, borderRadius: 2 },
              { label: 'Slow (>30s)', data: slowCounts, backgroundColor: 'rgba(220,38,38,0.7)', borderColor: '#dc2626', borderWidth: 1, borderRadius: 2 },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 300 },
            plugins: {
              legend: { position: 'top', labels: { color: textColor, font: { size: 9 }, boxWidth: 12, padding: 6 } },
              tooltip: {
                callbacks: {
                  title: (items) => `Lap ${items[0].label}`,
                  label: (ctx) => {
                    const val = ctx.parsed.y;
                    return `${ctx.dataset.label}: ${val} stop${val !== 1 ? 's' : ''}`;
                  },
                },
              },
            },
            scales: {
              x: { title: { display: true, text: 'Lap', color: textColor, font: { size: 11 } }, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 } } },
              y: { title: { display: true, text: 'Number of Stops', color: textColor, font: { size: 11 } }, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 }, stepSize: 1 }, beginAtZero: true },
            },
          },
        });
      }, 100);
    } catch(e) {
      el.innerHTML = `<div class="text-center py-8" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  // ── Overtake Analysis ──
  async function loadOvertakeAnalysis(sessionId) {
    const el = document.getElementById('overtake-chart-area');
    el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">Loading overtake data...</div>';

    if (overtakeChartInstance) { overtakeChartInstance.destroy(); overtakeChartInstance = null; }

    try {
      const data = await api(`/sessions/${sessionId}/positions`);
      const timeline = data.timeline;
      const maxLap = data.max_lap;

      if (!timeline || timeline.length === 0) {
        el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">No overtake data available</div>';
        return;
      }

      // Group by driver, track position changes
      const byDriver = {};
      const driverMeta = {};
      for (const entry of timeline) {
        const dn = entry.driver_number;
        if (!byDriver[dn]) {
          byDriver[dn] = [];
          driverMeta[dn] = { acronym: entry.acronym, team_colour: entry.team_colour };
        }
        byDriver[dn].push(entry);
      }

      // For each driver, compute net position change per lap
      const labels = Array.from({ length: maxLap }, (_, i) => i + 1);
      const driverChanges = {};
      const totalOvertakes = {};

      for (const [dn, entries] of Object.entries(byDriver)) {
        const sorted = entries.sort((a, b) => a.lap - b.lap);
        const changes = [];
        let prevPos = null;
        let totalGained = 0;
        let totalLost = 0;
        for (let lap = 1; lap <= maxLap; lap++) {
          const entry = sorted.find(e => e.lap === lap);
          if (entry && entry.position) {
            if (prevPos !== null && entry.position !== prevPos) {
              changes.push(prevPos - entry.position); // positive = gained positions
              if (entry.position < prevPos) totalGained += (prevPos - entry.position);
              else totalLost += (entry.position - prevPos);
            } else {
              changes.push(0);
            }
            prevPos = entry.position;
          } else {
            changes.push(null);
          }
        }
        driverChanges[dn] = changes;
        totalOvertakes[dn] = { gained: totalGained, lost: totalLost, net: totalGained - totalLost };
      }

      // Sort by net overtakes
      const sortedDrivers = Object.entries(totalOvertakes)
        .sort((a, b) => b[1].net - a[1].net);

      // Summary stats
      const totalGainedAll = Object.values(totalOvertakes).reduce((s, o) => s + o.gained, 0);
      const totalLostAll = Object.values(totalOvertakes).reduce((s, o) => s + o.lost, 0);
      const mostOvertakes = sortedDrivers[0];

      // Top overtakers table
      let html = `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-xs" style="color:var(--text-secondary)">
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${totalGainedAll}</div>
            <div>Total Positions Gained</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${totalLostAll}</div>
            <div>Total Positions Lost</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:#16a34a">+${mostOvertakes ? mostOvertakes[1].net : 0}</div>
            <div>Best Net (${mostOvertakes ? (driverMeta[mostOvertakes[0]]?.acronym || mostOvertakes[0]) : '—'})</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${Object.keys(byDriver).length}</div>
            <div>Drivers</div>
          </div>
        </div>
      `;

      // Chart: per-lap overtakes (bar chart: green=gained, red=lost)
      html += `
        <div class="text-xs mb-3" style="color:var(--text-muted)">
          <strong>Overtakes Per Lap</strong> — 🟢 Green bars = positions gained, 🔴 Red = positions lost. Hover for details.
        </div>
        <div class="relative" style="height:300px;margin-bottom:16px">
          <canvas id="overtake-chart-canvas-${sessionId}"></canvas>
        </div>
      `;

      // Top overtakers table
      html += `
        <div class="overflow-x-auto mb-4">
          <table>
            <thead>
              <tr><th>#</th><th>Driver</th><th class="text-right">Gained</th><th class="text-right">Lost</th><th class="text-right">Net</th></tr>
            </thead>
            <tbody>
      `;
      sortedDrivers.forEach(([dn, stats], i) => {
        const meta = driverMeta[dn] || {};
        const color = meta.team_colour ? teamColor(meta.team_colour) : '#666';
        const netClass = stats.net > 0 ? 'color:#16a34a;font-weight:700' : stats.net < 0 ? 'color:#dc2626' : '';
        html += `
          <tr>
            <td style="color:var(--text-secondary)">${i + 1}</td>
            <td class="font-medium" style="color:${color}">${meta.acronym || `#${dn}`}</td>
            <td class="text-right font-mono" style="color:#16a34a">+${stats.gained}</td>
            <td class="text-right font-mono" style="color:#dc2626">-${stats.lost}</td>
            <td class="text-right font-mono font-bold" style="${netClass}">${stats.net > 0 ? '+' : ''}${stats.net}</td>
          </tr>
        `;
      });
      html += `</tbody></table></div>`;

      el.innerHTML = html;

      // Render chart
      setTimeout(() => {
        const canvas = document.getElementById(`overtake-chart-canvas-${sessionId}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const isLight = document.documentElement.classList.contains('light');
        const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
        const textColor = isLight ? '#64748b' : '#8b949e';

        // Top 5 most active drivers for chart
        const chartDrivers = sortedDrivers.slice(0, 5);
        const datasets = [];

        chartDrivers.forEach(([dn], idx) => {
          const meta = driverMeta[dn] || {};
          const color = meta.team_colour ? teamColor(meta.team_colour) : ['#e10600','#16a34a','#3b82f6','#f59e0b','#8b5cf6'][idx];
          const changes = driverChanges[dn];
          const gainedData = changes.map(c => c !== null && c > 0 ? c : null);
          const lostData = changes.map(c => c !== null && c < 0 ? Math.abs(c) : null);

          // Gained (green segment)
          datasets.push({
            label: `${meta.acronym || dn} Gained`,
            data: gainedData,
            backgroundColor: 'rgba(22,163,74,0.6)',
            borderColor: '#16a34a',
            borderWidth: 1,
            borderRadius: 2,
            barPercentage: 0.6,
            order: 1,
          });
          // Lost (red segment, negative)
          datasets.push({
            label: `${meta.acronym || dn} Lost`,
            data: lostData,
            backgroundColor: 'rgba(220,38,38,0.6)',
            borderColor: '#dc2626',
            borderWidth: 1,
            borderRadius: 2,
            barPercentage: 0.6,
            order: 2,
          });
        });

        overtakeChartInstance = new Chart(ctx, {
          type: 'bar',
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 300 },
            interaction: { mode: 'item', intersect: true },
            plugins: {
              legend: {
                position: 'top',
                labels: { color: textColor, font: { size: 9 }, boxWidth: 12, padding: 6 },
              },
              tooltip: {
                callbacks: {
                  title: (items) => `Lap ${items[0].label}`,
                  label: (ctx) => {
                    const val = ctx.parsed.y;
                    if (val === null) return null;
                    const label = ctx.dataset.label.replace(' Gained',' 🟢').replace(' Lost',' 🔴');
                    return `${label}: ${val} position${val > 1 ? 's' : ''}`;
                  },
                },
              },
            },
            scales: {
              x: {
                title: { display: true, text: 'Lap', color: textColor, font: { size: 11 } },
                grid: { color: gridColor },
                ticks: { color: textColor, font: { size: 9 } },
              },
              y: {
                title: { display: true, text: 'Positions Changed', color: textColor, font: { size: 11 } },
                grid: { color: gridColor },
                ticks: { color: textColor, font: { size: 9 }, stepSize: 1 },
                beginAtZero: true,
              },
            },
          },
        });
      }, 100);
    } catch(e) {
      el.innerHTML = `<div class="text-center py-8" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  // ── Position History ──
  let posChartData = null; // { lapPositions, driverMap, allDrivers, maxLap, allLaps, timeline }

  async function loadPositionHistory(sessionId) {
    const el = document.getElementById('pos-chart-area');
    el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">Loading position data...</div>';

    if (posChartInstance) { posChartInstance.destroy(); posChartInstance = null; }

    try {
      const data = await api(`/sessions/${sessionId}/positions`);
      const timeline = data.timeline;
      const maxLap = data.max_lap;

      if (!timeline || timeline.length === 0) {
        el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">No position data available</div>';
        return;
      }

      // Group by lap + driver map
      const lapPositions = {};
      const driverMap = {};
      for (const entry of timeline) {
        if (!lapPositions[entry.lap]) lapPositions[entry.lap] = [];
        lapPositions[entry.lap].push(entry);
        driverMap[entry.driver_number] = {
          acronym: entry.acronym,
          full_name: entry.full_name,
          team_name: entry.team_name,
          team_colour: entry.team_colour,
        };
      }

      const allDrivers = Object.keys(driverMap).map(Number);
      const allLaps = Object.keys(lapPositions).map(Number).sort((a, b) => a - b);

      // Store data globally for chart re-render
      posChartData = { lapPositions, driverMap, allDrivers, maxLap, allLaps, timeline };

      // Driver picker + chart canvas rendered once
      let html = `
        <div class="flex flex-wrap gap-3 items-center mb-3">
          <button onclick="posSelectAll()" class="text-xs px-3 py-1.5 rounded" style="background:var(--badge-soft);color:var(--badge-soft-text);border:1px solid var(--border-color);cursor:pointer">✅ Select All</button>
          <button onclick="posDeselectAll()" class="text-xs px-3 py-1.5 rounded" style="background:var(--badge-soft);color:var(--badge-soft-text);border:1px solid var(--border-color);cursor:pointer">⬜ Clear</button>
          <span style="color:var(--text-secondary);font-size:11px">Show drivers:</span>
        </div>
        <div class="flex flex-wrap gap-2 mb-3" id="pos-drivers">
          ${allDrivers.sort((a, b) => {
            const aLast = lapPositions[allLaps[allLaps.length - 1]]?.find(e => e.driver_number === a);
            const bLast = lapPositions[allLaps[allLaps.length - 1]]?.find(e => e.driver_number === b);
            return (aLast?.position || 99) - (bLast?.position || 99);
          }).map(dn => {
            const info = driverMap[dn];
            const colour = info.team_colour ? teamColor(info.team_colour) : '#666';
            return `<label class="flex items-center gap-1.5 text-xs cursor-pointer" style="color:var(--text-primary)">
              <input type="checkbox" class="pos-cb" value="${dn}" data-acronym="${info.acronym}" checked>
              <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colour}"></span>
              ${info.acronym}
            </label>`;
          }).join('')}
        </div>
        <div class="text-xs mb-2" style="color:var(--text-muted);text-align:center">
          <strong>P1 on top</strong> — check/uncheck drivers to focus. Toggle checkboxes then click <strong>Plot Chart</strong>.
        </div>
        <div class="flex items-center gap-3 mb-3">
          <button onclick="renderPosChart()" class="bg-f1-red text-white px-4 py-2 rounded text-sm font-medium hover:opacity-90 transition">📈 Plot Chart</button>
          <span class="text-xs" style="color:var(--text-muted)">Click to update chart after toggling drivers</span>
        </div>
        <div class="relative" style="height:450px">
          <canvas id="pos-chart-canvas"></canvas>
        </div>
      `;

      el.innerHTML = html;

      // Initial render
      renderPosChart();
    } catch(e) {
      el.innerHTML = `<div class="text-center py-8" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  function renderPosChart() {
    if (!posChartData) return;
    if (posChartInstance) { posChartInstance.destroy(); posChartInstance = null; }

    const { lapPositions, driverMap, allDrivers, maxLap, allLaps, timeline } = posChartData;
    const labels = [];
    for (let i = 1; i <= maxLap; i++) labels.push(i);

    const DRIVER_COLORS = ['#e10600','#16a34a','#3b82f6','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316','#06b6d4','#84cc16','#dc2626','#6366f1','#d946ef','#22c55e','#eab308','#64748b','#0ea5e9','#a855f7','#10b981','#9ca3af'];

    // Read checked state directly from DOM
    const selected = [];
    document.querySelectorAll('.pos-cb:checked').forEach(cb => selected.push(parseInt(cb.value)));
    const showDrivers = selected.length > 0 ? allDrivers.filter(dn => selected.includes(dn)) : allDrivers;
    const sortedShown = [...showDrivers].sort((a, b) => {
      const aLast = lapPositions[allLaps[allLaps.length - 1]]?.find(e => e.driver_number === a);
      const bLast = lapPositions[allLaps[allLaps.length - 1]]?.find(e => e.driver_number === b);
      return (aLast?.position || 99) - (bLast?.position || 99);
    });

    let colorIdx = 0;
    const datasets = [];
    for (const dn of sortedShown) {
      const info = driverMap[dn];
      const color = info.team_colour ? `#${info.team_colour.replace('#', '')}` : DRIVER_COLORS[colorIdx % DRIVER_COLORS.length];
      colorIdx++;
      const data = [];
      for (let i = 1; i <= maxLap; i++) {
        const entry = lapPositions[i]?.find(e => e.driver_number === dn);
        data.push(entry?.position || null);
      }
      datasets.push({ label: info.acronym || `#${dn}`, data, borderColor: color, backgroundColor: color, borderWidth: 2, pointRadius: 1.5, pointHoverRadius: 5, tension: 0, spanGaps: true, fill: false, stepped: 'before' });
    }

    setTimeout(() => {
      const canvas = document.getElementById('pos-chart-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const isLight = document.documentElement.classList.contains('light');
      const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
      const textColor = isLight ? '#64748b' : '#8b949e';
      const maxPos = Math.max(...timeline.map(e => e.position));

      posChartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false, animation: { duration: 300 },
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'bottom', labels: { color: textColor, font: { size: 9 }, boxWidth: 12, padding: 6, usePointStyle: true, pointStyle: 'line' } },
            tooltip: { callbacks: { title: (items) => `Lap ${items[0].label}`, label: (ctx) => { const v = ctx.parsed.y; return v ? `${ctx.dataset.label}: P${v}${v === 1 ? ' 🏆' : ''}` : null; } } },
          },
          scales: {
            x: { title: { display: true, text: 'Lap', color: textColor, font: { size: 11 } }, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10 } }, min: 1 },
            y: { title: { display: true, text: 'Race Position', color: textColor, font: { size: 11 } }, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10 }, stepSize: 1, callback: (v) => `P${v}` }, min: 1, max: maxPos + 0.5, reverse: true },
          },
          elements: { line: { stepped: 'before' } },
        },
      });
    }, 50);
  }

  async function loadTrackMap(sessionId) {

      }

  function renderTrackMap() {
    if (!trackMapData) return;
    const el = document.getElementById('trackmap-area');
    const data = trackMapData;
    const maxLap = data.max_lap || 1;

    // Get positions for current lap
    let lapStr = String(currentTrackLap);
    let positions = [];
    if (data.lap_positions && data.lap_positions[lapStr]) {
      positions = data.lap_positions[lapStr];
    } else if (data.lap_positions) {
      // Try number key
      for (const [k, v] of Object.entries(data.lap_positions)) {
        if (parseInt(k) === currentTrackLap) {
          positions = v;
          break;
        }
      }
    }

    // Canvas dimensions
    const W = 600, H = 400;

    // Normalize circuit coordinates to fit canvas with padding
    const coords = data.circuit;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of coords) {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    }
    const rangeX = maxX - minX || 1;
    const rangeY = maxY - minY || 1;
    const pad = 40;
    const scaleX = (W - 2 * pad) / rangeX;
    const scaleY = (H - 2 * pad) / rangeY;
    const scale = Math.min(scaleX, scaleY);
    const cx = (W - rangeX * scale) / 2;
    const cy = (H - rangeY * scale) / 2;

    function normX(x) { return cx + (x - minX) * scale; }
    function normY(y) { return cy + (y - minY) * scale; }

    const isLight = document.documentElement.classList.contains('light');
    const bgColor = isLight ? '#f5f6f8' : '#0f1115';
    const trackColor = isLight ? '#d1d5db' : '#2d3139';
    const textColor = isLight ? '#1e293b' : '#e1e1e6';

    let html = `
      <div class="text-xs mb-2" style="color:var(--text-secondary);text-align:center">
        Lap <strong>${currentTrackLap}</strong> / ${maxLap}
      </div>
      <div style="text-align:center">
        <canvas id="trackmap-canvas" width="${W}" height="${H}" style="max-width:100%;height:auto;border-radius:8px;background:${bgColor}"></canvas>
      </div>
      <div class="flex items-center gap-3 mt-3 flex-wrap justify-center">
        <button onclick="trackMapPrevLap()" class="text-xs px-3 py-1.5 rounded" style="background:var(--badge-soft);color:var(--text-primary);border:1px solid var(--border-color);cursor:pointer">◀ Prev</button>
        <input type="range" id="trackmap-slider" min="1" max="${maxLap}" value="${currentTrackLap}" oninput="trackMapSeek(this.value)" style="flex:1;max-width:300px">
        <button onclick="trackMapNextLap()" class="text-xs px-3 py-1.5 rounded" style="background:var(--badge-soft);color:var(--text-primary);border:1px solid var(--border-color);cursor:pointer">Next ▶</button>
        <button onclick="trackMapPlay()" class="text-xs px-3 py-1.5 rounded" style="background:var(--badge-soft);color:var(--text-primary);border:1px solid var(--border-color);cursor:pointer" id="trackmap-playbtn">▶ Play</button>
      </div>
      <div class="flex flex-wrap gap-2 mt-2 justify-center" id="trackmap-legend"></div>
    `;

    el.innerHTML = html;

    // Restore play button state if interval is still running
    if (trackMapInterval) {
      const btn = document.getElementById('trackmap-playbtn');
      if (btn) btn.textContent = '⏸ Pause';
    }

    // Draw circuit + dots on canvas
    const canvas = document.getElementById('trackmap-canvas');
    const ctx = canvas.getContext('2d');

    // Circuit path
    ctx.beginPath();
    ctx.strokeStyle = trackColor;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    for (let i = 0; i < coords.length; i++) {
      const x = normX(coords[i].x);
      const y = normY(coords[i].y);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();

    // Draw driver dots
    if (positions.length > 0) {
      const numPositions = positions.length;
      const totalPoints = coords.length;

      positions.forEach((p, idx) => {
        // Map position to a point along the circuit
        // P1 is near the end (finish line area), others spread behind
        const posRatio = 1.0 - (p.position - 1) / Math.max(numPositions, 1);
        const ptIndex = Math.floor(posRatio * totalPoints * 0.8);
        const pt = coords[Math.min(ptIndex, totalPoints - 1)];
        const dotX = normX(pt.x);
        const dotY = normY(pt.y);
        const rawColor = p.team_colour || '#888';
        const color = rawColor.startsWith('#') ? rawColor : '#' + rawColor;

        // Draw dot
        ctx.beginPath();
        ctx.arc(dotX, dotY, 8, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = isLight ? '#fff' : '#000';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Label
        ctx.fillStyle = textColor;
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.acronym || `#${p.driver_number}`, dotX, dotY - 14);
      });
    }

    // Legend
    const legend = document.getElementById('trackmap-legend');
    if (legend) {
      legend.innerHTML = positions.map(p => {
        const rawColor = p.team_colour || '#888';
        const color = rawColor.startsWith('#') ? rawColor : '#' + rawColor;
        return `<span class="flex items-center gap-1 text-xs" style="color:${textColor}"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color}"></span> P${p.position} ${p.acronym}</span>`;
      }).join('');
    }
  }

  function trackMapSeek(lap) {
    currentTrackLap = parseInt(lap);
    renderTrackMap();
  }

  function trackMapPrevLap() {
    if (trackMapData && currentTrackLap > 1) {
      currentTrackLap--;
      document.getElementById('trackmap-slider').value = currentTrackLap;
      renderTrackMap();
    }
  }

  function trackMapNextLap() {
    if (trackMapData && currentTrackLap < trackMapData.max_lap) {
      currentTrackLap++;
      document.getElementById('trackmap-slider').value = currentTrackLap;
      renderTrackMap();
    }
  }
  // ── Track Map Play ──
  function trackMapPlay() {
    if (trackMapInterval) {
      clearInterval(trackMapInterval);
      trackMapInterval = null;
      document.getElementById('trackmap-playbtn').textContent = '▶ Play';
      return;
    }
    trackMapInterval = setInterval(() => {
      if (currentTrackLap >= trackMapData.max_lap) {
        currentTrackLap = 1;
      } else {
        currentTrackLap++;
      }
      document.getElementById('trackmap-slider').value = currentTrackLap;
      renderTrackMap();
    }, 400);
    document.getElementById('trackmap-playbtn').textContent = '⏸ Pause';
  }

        <div class="card p-5 mb-6">
          <div class="collapse-header flex items-center justify-between mb-4" onclick="toggleCollapse(this)">
            <h3 class="font-semibold text-sm">🤜🤛 Driver Head-to-Head
              <span class="text-xs font-normal ml-2" style="color:var(--text-muted)">Select two drivers to compare</span>
            </h3>
            <span class="collapse-icon">▼</span>
          </div>
          <div class="collapse-body closed">
            <div class="flex flex-wrap gap-3 items-center mb-4">
              <select id="h2h-drv1" class="text-xs">
                ${h2h.drivers.map(d => `<option value="${d.driver_number}">${d.acronym} (${d.team_name})</option>`).join('')}
              </select>
              <span style="color:var(--text-secondary)">vs</span>
              <select id="h2h-drv2" class="text-xs">
                ${h2h.drivers.map(d => `<option value="${d.driver_number}">${d.acronym} (${d.team_name})</option>`).join('')}
              </select>
              <button onclick="compareH2H()" class="bg-f1-red text-white px-3 py-1.5 rounded text-xs font-medium hover:opacity-90 transition">Compare</button>
            </div>
            <div id="h2h-result" class="text-xs" style="color:var(--text-muted)">Select two drivers and click Compare.</div>
          </div>
        </div>

        <!-- Pit Stop Championship -->
        <div class="card p-5 mb-6">
          <div class="collapse-header flex items-center justify-between mb-4" onclick="toggleCollapse(this)">
            <h3 class="font-semibold text-sm">⛽ Pit Stop Championship
              <span class="text-xs font-normal ml-2" style="color:var(--text-muted)">Team rankings by pit stop speed</span>
            </h3>
            <span class="collapse-icon">▼</span>
          </div>
          <div class="collapse-body closed">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-xs" style="color:var(--text-secondary)">
              <div class="text-center p-2" style="background:var(--bg-primary);border-radius:6px">
                <div class="font-bold" style="color:var(--text-primary)">${pitStop.total_teams}</div>
                <div>Teams</div>
              </div>
              <div class="text-center p-2" style="background:var(--bg-primary);border-radius:6px">
                <div class="font-bold" style="color:var(--text-primary)">${pitStop.total_stops}</div>
                <div>Total Pit Stops</div>
              </div>
              <div class="text-center p-2" style="background:var(--bg-primary);border-radius:6px">
                <div class="font-bold" style="color:#16a34a">${pitStop.overall_fastest_stop ? pitStop.overall_fastest_stop[0].toFixed(1) + 's' : '—'}</div>
                <div>Fastest Stop Overall</div>
                <div>${pitStop.overall_fastest_stop ? pitStop.overall_fastest_stop[2].acronym + ' L' + pitStop.overall_fastest_stop[2].lap_number : ''}</div>
              </div>
              <div class="text-center p-2" style="background:var(--bg-primary);border-radius:6px">
                <div class="font-bold" style="color:#f59e0b">${pitStop.teams[0] ? pitStop.teams[0].avg_pit_duration + 's' : '—'}</div>
                <div>Fastest Avg (${pitStop.teams[0] ? pitStop.teams[0].team_name : ''})</div>
              </div>
            </div>
            <div class="overflow-x-auto">
              <table>
                <thead>
                  <tr>
                    <th>#</th><th>Team</th>
                    <th class="text-right">Avg Stop</th>
                    <th class="text-right">Fastest</th>
                    <th class="text-right">Slowest</th>
                    <th class="text-right">Stops</th>
                    <th class="text-right">Drivers</th>
                    <th class="text-right">🎯 Consistency</th>
                  </tr>
                </thead>
                <tbody>
                  ${pitStop.teams.map((t, i) => {
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
                    return `
                    <tr>
                      <td class="font-bold" style="font-size:14px">${medal}</td>
                      <td class="font-medium">${t.team_name}</td>
                      <td class="text-right font-mono font-bold">${t.avg_pit_duration}s</td>
                      <td class="text-right font-mono" style="color:#16a34a">${t.fastest_stop}s</td>
                      <td class="text-right font-mono" style="color:#dc2626">${t.slowest_stop}s</td>
                      <td class="text-right" style="color:var(--text-secondary)">${t.total_stops}</td>
                      <td class="text-right" style="color:var(--text-secondary)">${t.drivers}</td>
                      <td class="text-right font-mono font-bold" style="color:${t.consistency > 88 ? '#16a34a' : t.consistency > 82 ? '#f59e0b' : '#dc2626'}">${t.consistency}%</td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Driver Form Tracker -->
        <div class="card p-5 mb-6">
          <div class="collapse-header flex items-center justify-between mb-4" onclick="toggleCollapse(this)">
            <h3 class="font-semibold text-sm">🔥 Driver Form Tracker
              <span class="text-xs font-normal ml-2" style="color:var(--text-muted)">Finishing position trend per round — P1 at top = hot streak</span>
            </h3>
            <span class="collapse-icon">▼</span>
          </div>
          <div class="collapse-body closed">
            <div class="flex flex-wrap gap-2 mb-3" id="form-drivers">
              ${driverForm.drivers.map((d, i) => `
                <label class="flex items-center gap-1.5 text-xs cursor-pointer" style="color:var(--text-primary)">
                  <input type="checkbox" class="form-cb" value="${d.driver_number}" data-acronym="${d.acronym}" data-avg="${d.avg_finish}" ${i < 5 ? 'checked' : ''}>
                  <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${d.team_colour || '#666'}"></span>
                  ${d.acronym} <span class="text-xs" style="color:var(--text-muted)">(${d.avg_finish})</span>
                </label>
              `).join('')}
            </div>
            <div class="flex gap-2 mb-3">
              <button onclick="plotDriverForm()" class="bg-f1-red text-white px-3 py-1.5 rounded text-xs font-medium hover:opacity-90 transition">📈 Plot Form</button>
              <button onclick="formSelectAll()" class="text-xs px-3 py-1.5 rounded" style="background:var(--badge-soft);color:var(--badge-soft-text);border:1px solid var(--border-color);cursor:pointer">✅ Select All</button>
              <button onclick="formDeselectAll()" class="text-xs px-3 py-1.5 rounded" style="background:var(--badge-soft);color:var(--badge-soft-text);border:1px solid var(--border-color);cursor:pointer">⬜ Clear</button>
            </div>
            <div class="relative" style="height:380px">
              <canvas id="form-chart"></canvas>
            </div>
            <div id="form-chart-status" class="text-xs mt-2" style="color:var(--text-muted);text-align:center">
              Select drivers and click Plot Form. <strong>Lower line = better position</strong> (P1 at top)
            </div>
          </div>
        </div>
      `;

      el.innerHTML = html;
      formData = driverForm;
    } catch(e) {
      el.innerHTML = '<div class="text-center py-20" style="color:#dc2626">Error: ' + e.message + '</div>';
    }
  }

  // ── Season Progression helpers ──
  let progData = null;

  function progSelectAll() {
    document.querySelectorAll('.prog-cb').forEach(cb => cb.checked = true);
  }
  function progDeselectAll() {
    document.querySelectorAll('.prog-cb').forEach(cb => cb.checked = false);
  }

  // ── Driver Form Tracker ──
  let formData = null;
  let formChartInstance = null;

  function formSelectAll() {
    document.querySelectorAll('.form-cb').forEach(cb => cb.checked = true);
  }
  function formDeselectAll() {
    document.querySelectorAll('.form-cb').forEach(cb => cb.checked = false);
  }

  async function plotDriverForm() {
    const el = document.getElementById('form-chart');
    if (!el) return;

    if (formChartInstance) { formChartInstance.destroy(); formChartInstance = null; }

    if (!formData) {
      formData = await api('/analytics/driver-form?year=2026');
    }

    // Get selected drivers
    const selected = [];
    document.querySelectorAll('.form-cb:checked').forEach(cb => {
      selected.push(parseInt(cb.value));
    });

    if (selected.length === 0) {
      document.getElementById('form-chart-status').textContent = '⚠️ Select at least one driver';
      return;
    }

    const rounds = formData.rounds;
    const labels = rounds.map(r => r.race_name.replace(/ Grand Prix$/, '').substring(0, 4));
    const driverMap = {};
    formData.drivers.forEach(d => { driverMap[d.driver_number] = d; });

    const datasets = [];
    const fallbackColors = ['#e10600','#1e63a8','#16a34a','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#dc2626','#84cc16','#14b8a6','#f97316','#6366f1','#d946ef','#0ea5e9','#22c55e','#eab308','#a855f7','#3b82f6','#ef4444','#10b981','#f59e0b','#6b7280'];

    selected.forEach((dn, idx) => {
      const info = driverMap[dn];
      const color = info && info.team_colour ? info.team_colour : fallbackColors[idx % fallbackColors.length];
      const data = rounds.map(r => {
        const result = info ? info.results.find(res => res.meeting_id === r.meeting_id && res.session_name === 'Race') : null;
        return result ? result.position : null;
      });
      datasets.push({
        label: info ? info.acronym : '#' + dn,
        data: data,
        borderColor: color,
        backgroundColor: color + '22',
        borderWidth: idx < 5 ? 3 : 1.5,
        pointRadius: 4,
        pointHoverRadius: 7,
        spanGaps: true,
        tension: 0.2,
        fill: false,
      });
    });

    const ctx = el.getContext('2d');
    const isLight = document.documentElement.classList.contains('light');
    const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
    const textColor = isLight ? '#64748b' : '#8b949e';

    formChartInstance = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 400 },
        interaction: { mode: 'nearest', intersect: false },
        plugins: {
          legend: { position: 'top', labels: { color: textColor, font: { size: 10 }, boxWidth: 12, padding: 8 } },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const pos = ctx.parsed.y;
                if (pos === null) return ctx.dataset.label + ': DNP';
                const posStr = pos === 1 ? 'P1 🏆' : 'P' + pos;
                return ctx.dataset.label + ': ' + posStr;
              }
            }
          }
        },
        scales: {
          x: { title: { display: true, text: 'Round', color: textColor, font: { size: 10 } },
            grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 } } },
          y: {
            title: { display: true, text: 'Finishing Position', color: textColor, font: { size: 10 } },
            grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 } },
            reverse: true,
            min: 1,
            max: 22,
          }
        }
      }
    });
    document.getElementById('form-chart-status').textContent = 'Showing form for ' + selected.length + ' drivers';
  }

  async function plotSeasonProgression() {
    const el = document.getElementById('season-prog-chart');
    if (!el) return;

    if (seasonChartInstance) { seasonChartInstance.destroy(); seasonChartInstance = null; }

    if (!progData) {
      progData = await api('/analytics/season-progression?year=2026');
    }

    // Get selected drivers
    const selected = [];
    document.querySelectorAll('.prog-cb:checked').forEach(cb => {
      selected.push(parseInt(cb.value));
    });

    if (selected.length === 0) {
      document.getElementById('prog-chart-status').textContent = '⚠️ Select at least one driver';
      return;
    }

    const rounds = progData.rounds;
    const labels = rounds.map(r => 'R' + r.round);
    const driverMap = {};
    progData.drivers.forEach(d => { driverMap[d.driver_number] = d; });

    const datasets = [];
    const colors = ['#e10600','#1e63a8','#16a34a','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#dc2626','#84cc16','#14b8a6','#f97316','#6366f1','#d946ef','#0ea5e9','#22c55e','#eab308','#a855f7','#3b82f6','#ef4444','#10b981','#f59e0b','#6b7280'];

    selected.forEach((dn, idx) => {
      const info = driverMap[dn];
      const color = info && info.team_colour ? info.team_colour : colors[idx % colors.length];
      const data = rounds.map(r => {
        const d = r.standings.find(s => s.driver_number === dn);
        return d ? d.cumulative_points : null;
      });
      datasets.push({
        label: info ? info.acronym : '#' + dn,
        data: data,
        borderColor: color,
        backgroundColor: color + '22',
        borderWidth: idx < 5 ? 3 : 1.5,
        pointRadius: 4,
        pointHoverRadius: 7,
        spanGaps: true,
        tension: 0.2,
        fill: idx < 3,
      });
    });

    const ctx = el.getContext('2d');
    const isLight = document.documentElement.classList.contains('light');
    const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
    const textColor = isLight ? '#64748b' : '#8b949e';

    seasonChartInstance = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 400 },
        interaction: { mode: 'nearest', intersect: false },
        plugins: {
          legend: { position: 'top', labels: { color: textColor, font: { size: 10 }, boxWidth: 12, padding: 8 } },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const d = ctx.parsed.y;
                if (d === null) return ctx.dataset.label + ': DNP';
                return ctx.dataset.label + ': ' + d + ' pts';
              }
            }
          }
        },
        scales: {
          x: { title: { display: true, text: 'Round', color: textColor, font: { size: 10 } },
            grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 } } },
          y: { title: { display: true, text: 'Cumulative Points', color: textColor, font: { size: 10 } },
            grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 } }, beginAtZero: true }
        }
      }
    });
    document.getElementById('prog-chart-status').textContent = 'Showing ' + selected.length + ' drivers';
  }

  // ── Head-to-Head comparison ──
  let h2hData = null;

  async function compareH2H() {
    const d1 = parseInt(document.getElementById('h2h-drv1').value);
    const d2 = parseInt(document.getElementById('h2h-drv2').value);
    if (d1 === d2) { return; }

    if (!h2hData) {
      h2hData = await api('/analytics/head-to-head?year=2026');
    }

    const driverMap = {};
    h2hData.drivers.forEach(d => { driverMap[d.driver_number] = d; });

    const drv1 = driverMap[d1];
    const drv2 = driverMap[d2];

    if (!drv1 || !drv2) {
      document.getElementById('h2h-result').innerHTML = '<div style="color:var(--text-muted)">Driver data not found</div>';
      return;
    }

    // Get head-to-head stats
    const qualWins1 = drv1.qual_wins[d2] || 0;
    const qualWins2 = drv2.qual_wins[d1] || 0;
    const qualTotal = drv1.qual_totals[d2] || (qualWins1 + qualWins2) || 0;
    const raceWins1 = drv1.race_wins[d2] || 0;
    const raceWins2 = drv2.race_wins[d1] || 0;
    const raceTotal = drv1.race_totals[d2] || (raceWins1 + raceWins2) || 0;

    const c1 = drv1.team_colour || '#666';
    const c2 = drv2.team_colour || '#666';

    document.getElementById('h2h-result').innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Qualifying -->
        <div class="card p-4" style="background:var(--bg-primary)">
          <h4 class="text-xs font-semibold mb-3" style="color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">⏱️ Qualifying</h4>
          <div class="flex items-center justify-between mb-3">
            <div class="text-center flex-1">
              <div class="font-bold text-lg" style="color:${c1}">${drv1.acronym}</div>
              <div class="text-3xl font-bold mt-1" style="color:${c1}">${qualWins1}</div>
              <div class="text-xs" style="color:var(--text-muted)">wins</div>
            </div>
            <div class="text-center" style="color:var(--text-muted);font-size:11px">
              <div>of</div>
              <div class="text-xl font-bold mt-1" style="color:var(--text-primary)">${qualTotal}</div>
              <div>rounds</div>
            </div>
            <div class="text-center flex-1">
              <div class="font-bold text-lg" style="color:${c2}">${drv2.acronym}</div>
              <div class="text-3xl font-bold mt-1" style="color:${c2}">${qualWins2}</div>
              <div class="text-xs" style="color:var(--text-muted)">wins</div>
            </div>
          </div>
          <div class="w-full" style="background:var(--bg-card);border-radius:4px;height:8px;overflow:hidden">
            <div style="width:${qualTotal > 0 ? (qualWins1/qualTotal*100).toFixed(0) : 50}%;height:100%;background:${c1};border-radius:4px;float:left;transition:width 0.5s"></div>
            <div style="width:${qualTotal > 0 ? (qualWins2/qualTotal*100).toFixed(0) : 50}%;height:100%;background:${c2};border-radius:4px;float:right;transition:width 0.5s"></div>
          </div>
          <div class="flex justify-between text-xs mt-1" style="color:var(--text-muted)">
            <span>${qualTotal > 0 ? (qualWins1/qualTotal*100).toFixed(0) : 50}%</span>
            <span>${qualTotal > 0 ? (qualWins2/qualTotal*100).toFixed(0) : 50}%</span>
          </div>
        </div>
        <!-- Race -->
        <div class="card p-4" style="background:var(--bg-primary)">
          <h4 class="text-xs font-semibold mb-3" style="color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">🏁 Race</h4>
          <div class="flex items-center justify-between mb-3">
            <div class="text-center flex-1">
              <div class="font-bold text-lg" style="color:${c1}">${drv1.acronym}</div>
              <div class="text-3xl font-bold mt-1" style="color:${c1}">${raceWins1}</div>
              <div class="text-xs" style="color:var(--text-muted)">wins</div>
            </div>
            <div class="text-center" style="color:var(--text-muted);font-size:11px">
              <div>of</div>
              <div class="text-xl font-bold mt-1" style="color:var(--text-primary)">${raceTotal}</div>
              <div>rounds</div>
            </div>
            <div class="text-center flex-1">
              <div class="font-bold text-lg" style="color:${c2}">${drv2.acronym}</div>
              <div class="text-3xl font-bold mt-1" style="color:${c2}">${raceWins2}</div>
              <div class="text-xs" style="color:var(--text-muted)">wins</div>
            </div>
          </div>
          <div class="w-full" style="background:var(--bg-card);border-radius:4px;height:8px;overflow:hidden">
            <div style="width:${raceTotal > 0 ? (raceWins1/raceTotal*100).toFixed(0) : 50}%;height:100%;background:${c1};border-radius:4px;float:left;transition:width 0.5s"></div>
            <div style="width:${raceTotal > 0 ? (raceWins2/raceTotal*100).toFixed(0) : 50}%;height:100%;background:${c2};border-radius:4px;float:right;transition:width 0.5s"></div>
          </div>
          <div class="flex justify-between text-xs mt-1" style="color:var(--text-muted)">
            <span>${raceTotal > 0 ? (raceWins1/raceTotal*100).toFixed(0) : 50}%</span>
            <span>${raceTotal > 0 ? (raceWins2/raceTotal*100).toFixed(0) : 50}%</span>
          </div>
        </div>
      </div>
    `;
  }

  // ── Init ──
  initTheme();
  // Use sessionStorage: stays on same page on refresh,
  // resets to home when opening a new tab.
  const savedView = sessionStorage.getItem('f1-view');
  const savedState = sessionStorage.getItem('f1-state');
  if (savedView === 'about') {
    showAbout();
  } else if (savedView === 'guide') {
    showGuide();
  } else if (savedView === 'standings') {
    loadChampionship();
  } else if (savedView === 'season') {
    loadSeasonAnalysis();
  } else if (savedView === 'teammate') {
    loadTeamMateBattle();
  } else if (savedView === 'teams') {
    loadTeams();
  } else if (savedView === 'session' && savedState) {
    try {
      const s = JSON.parse(savedState);
      if (s.meetingId && s.sessionId && s.sessionName && s.sessionType) {
        loadSession(s.sessionId, s.meetingId, s.meetingName, s.sessionName, s.sessionType);
      } else { loadRaces(); }
    } catch(e) { loadRaces(); }
  } else if (savedView === 'sessions' && savedState) {
    try {
      const s = JSON.parse(savedState);
      if (s.meetingId && s.meetingName) {
        loadSessions(s.meetingId, s.meetingName);
      } else { loadRaces(); }
    } catch(e) { loadRaces(); }
  } else {
    loadRaces();
  }
  </script>

  <!-- Floating Table of Contents -->
  <button class="toc-btn" id="toc-btn" onclick="toggleToc()" title="Jump to section">📋</button>
  <div class="toc-overlay" id="toc-overlay" onclick="toggleToc()">
    <div class="toc-panel" onclick="event.stopPropagation()">
      <h4>📋 Jump to Section</h4>
      <div id="toc-list"></div>
    </div>
  </div>
</body>
</html>
