<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Analysis 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.tailwindcss.com">
  {
    darkMode: 'class'
  }
</script>
<style>
  :root {
    --bg-primary: #0f1115;
    --bg-card: #1a1d24;
    --border-color: #2d3139;
    --text-primary: #e1e1e6;
    --text-secondary: #8b949e;
    --text-muted: #6b7280;
    --table-border: #1f2329;
    --hover-bg: rgba(255,255,255,.03);
    --hover-card-border: #6b7280;
    --input-bg: #1a1d24;
    --badge-soft: #333;
    --badge-soft-text: #e1e1e6;
  }
  .light {
    --bg-primary: #f5f6f8;
    --bg-card: #ffffff;
    --border-color: #e2e8f0;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --table-border: #e2e8f0;
    --hover-bg: rgba(0,0,0,.02);
    --hover-card-border: #94a3b8;
    --input-bg: #ffffff;
    --badge-soft: #e2e8f0;
    --badge-soft-text: #475569;
  }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transition: background .2s, color .2s;
  }
  .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; transition: background .2s, border-color .2s; }
  .f1-red { color: #e10600; }
  .bg-f1-red { background: #e10600; }
  .sector-badge { font-variant-numeric: tabular-nums; }
  .team-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .team-badge { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; line-height: 1.4; }
  .team-logo { display: inline-block; height: 20px; width: auto; vertical-align: middle; object-fit: contain; }
  .nav-link { color: var(--text-secondary); cursor: pointer; padding: 8px 16px; border-radius: 6px; transition: all .15s; }
  .nav-link:hover { color: var(--text-primary); background: var(--hover-bg); }
  .nav-link.active { color: #fff; background: #e10600; }
  .light .nav-link.active { color: #fff; }
  .loading { opacity: .5; pointer-events: none; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 12px; font-size: 11px; text-transform: uppercase; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--table-border); font-size: 13px; transition: background .15s; }
  tr:hover td { background: var(--hover-bg); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-soft { background: var(--badge-soft); color: var(--badge-soft-text); }
  .badge-medium { background: #d97706; color: #fff; }
  .light .badge-medium { background: #f59e0b; color: #fff; }
  .badge-hard { background: #6b7280; color: #fff; }
  .badge-inter { background: #2d7d46; color: #fff; }
  .badge-wet { background: #1a5c7a; color: #fff; }
  select, input {
    background: var(--input-bg);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    transition: background .2s, border-color .2s;
  }
  .theme-btn {
    background: none;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    color: var(--text-primary);
    transition: all .2s;
  }
  .theme-btn:hover {
    background: var(--hover-bg);
    border-color: var(--hover-card-border);
  }
  .light .text-gray-400 { color: var(--text-secondary) !important; }
  .light .text-gray-500 { color: var(--text-muted) !important; }
  .light .text-gray-700 { color: var(--text-primary) !important; }
  .light .text-green-400 { color: #16a34a !important; }
  .light .text-red-400 { color: #dc2626 !important; }

  /* ── Sector Colors ── */
  .sector-s1 { color: #ec4899; }  /* Pink */
  .sector-s2 { color: #00b4d8; }  /* Ocean Blue */
  .sector-s3 { color: #f59e0b; }  /* Amber/Gold */

  /* ── Collapse Sections ── */
  .collapse-header { cursor: pointer; user-select: none; }
  .collapse-header:hover { opacity: .8; }
  .collapse-icon { transition: transform .2s; font-size: 12px; color: var(--text-muted); display: inline-block; }
  .collapse-icon.open { transform: rotate(180deg); }
  .collapse-body { overflow: hidden; }
  .collapse-body.closed { display: none; }

  /* ── Tyre Timeline ── */
  .tyme-row {
    display: flex;
    align-items: center;
    margin-bottom: 3px;
    height: 26px;
  }
  .tyme-row:hover .tyme-bar-seg {
    opacity: .85;
    filter: brightness(1.15);
  }
  .tyme-label {
    width: 44px;
    font-size: 10px;
    font-weight: 700;
    text-align: right;
    padding-right: 8px;
    flex-shrink: 0;
    letter-spacing: .5px;
  }
  .tyme-track {
    flex: 1;
    position: relative;
    height: 22px;
    background: var(--bg-primary);
    border-radius: 4px;
    overflow: hidden;
  }
  .tyme-bar-seg {
    position: absolute;
    height: 100%;
    border-radius: 3px;
    min-width: 3px;
    display: flex;
    align-items: center;
    padding: 0 3px;
    font-size: 8px;
    font-weight: 700;
    color: rgba(255,255,255,.9);
    letter-spacing: .3px;
    transition: opacity .15s, filter .15s;
    cursor: pointer;
  }
  .tyme-soft { background: #e10600; }
  .tyme-medium { background: #d97706; }
  .tyme-hard { background: #6b7280; }
  .tyme-inter { background: #2d7d46; }
  .tyme-wet { background: #1a5c7a; }
  .tyme-scale {
    display: flex;
    margin-left: 52px;
    height: 16px;
    position: relative;
  }
  .tyme-tick {
    position: absolute;
    font-size: 9px;
    color: var(--text-muted);
    transform: translateX(-50%);
  }
  .tyme-legend {
    display: flex;
    gap: 12px;
    margin: 8px 0 4px 52px;
    font-size: 10px;
    color: var(--text-secondary);
    flex-wrap: wrap;
  }
  .tyme-legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tyme-legend-dot {
    width: 10px; height: 10px; border-radius: 2px; display: inline-block;
  }
  .tyme-tooltip {
    position: fixed;
    background: #1e293b;
    color: #fff;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
    display: none;
  }
  .light .tyme-tooltip { background: #334155; }
</style>
</head>
<body>
  <div class="max-w-6xl mx-auto px-4 py-6">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold"><span class="f1-red">F1</span> Analysis <span class="text-sm" style="color:var(--text-muted)">2026</span></h1>
        <p class="text-sm mt-1" style="color:var(--text-secondary)">Telemetry, sector times &amp; race data</p>
      </div>
      <div class="flex gap-2 items-center">
        <button onclick="loadRaces()" class="nav-link active" id="nav-races">🏁 Races</button>
        <button onclick="showAbout()" class="nav-link" id="nav-about">ℹ️ About</button>
        <button onclick="toggleTheme()" class="theme-btn" id="theme-btn" title="Toggle theme">🌙</button>
      </div>
    </div>

    <!-- Main Content -->
    <div id="content">
      <div class="text-center py-20" style="color:var(--text-muted)">Loading 2026 race data...</div>
    </div>
  </div>

  <div class="tyme-tooltip" id="tyme-tooltip"></div>

  <script>
  // API URL — relative path (local dev via FastAPI)
  const API = '';
  let meetings = [];
  let currentView = 'races';

  // ── Theme Toggle ──
  function toggleTheme() {
    const html = document.documentElement;
    const isLight = html.classList.toggle('light');
    localStorage.setItem('f1-theme', isLight ? 'light' : 'dark');
    document.getElementById('theme-btn').textContent = isLight ? '☀️' : '🌙';
  }

  function initTheme() {
    const saved = localStorage.getItem('f1-theme');
    if (saved === 'light') {
      document.documentElement.classList.add('light');
      document.getElementById('theme-btn').textContent = '☀️';
    }
  }

  // ── Navigation ──
  document.querySelectorAll('.nav-link').forEach(el => {
    el.addEventListener('click', function() {
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      this.classList.add('active');
    });
  });

  // ── API Helpers ──
  async function api(path) {
    const res = await fetch(`${API}/api${path}`);
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function compoundBadge(c) {
    if (!c) return '';
    const map = { 'SOFT': 'badge-soft', 'MEDIUM': 'badge-medium', 'HARD': 'badge-hard', 'INTERMEDIATE': 'badge-inter', 'WET': 'badge-wet' };
    return `<span class="badge ${map[c] || 'badge-soft'}">${c}</span>`;
  }

  function formatTime(s) {
    if (!s || s <= 0) return '—';
    if (s > 60) {
      const m = Math.floor(s / 60);
      const sec = (s % 60).toFixed(3);
      return `${m}:${sec.padStart(6, '0')}`;
    }
    return s.toFixed(3) + 's';
  }

  function teamColor(colour) {
    if (!colour) return '#666';
    return '#' + colour;
  }

  // ── Team Logo & Badge ──
  const TEAM_LOGO_MAP = {
    'Alpine': 'alpine.svg',
    'Aston Martin': 'aston-martin.svg',
    'Audi': 'audi.svg',
    'Cadillac': 'cadillac.svg',
    'Ferrari': 'ferrari.svg',
    'Haas F1 Team': 'haas.svg',
    'McLaren': 'mclaren.svg',
    'Mercedes': 'mercedes.svg',
    'Racing Bulls': 'racing-bulls.svg',
    'Red Bull Racing': 'red-bull-racing.svg',
    'Williams': 'williams.svg',
  };

  function teamBadge(teamName, colour) {
    const c = teamColor(colour);
    if (teamName && TEAM_LOGO_MAP[teamName]) {
      return `<img class="team-logo" src="logos/${TEAM_LOGO_MAP[teamName]}" alt="${teamName}" title="${teamName}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block'" onload="this.style.display='inline-block';this.nextElementSibling.style.display='none'"><span class="team-badge" style="background:${c};color:#fff;border:1px solid rgba(255,255,255,0.1);display:none">${teamName.replace(/ F1 Team$/, '').replace(/ Team$/, '').substring(0, 12)}</span>`;
    }
    const acronym = (teamName || '').replace(/ F1 Team$/, '').replace(/ Team$/, '').substring(0, 12);
    return `<span class="team-badge" style="background:${c};color:#fff;border:1px solid rgba(255,255,255,0.1)">${acronym}</span>`;
  }

  // ── Tyre Strategy Timeline ──
  function renderTyreTimeline(stints, driverMap) {
    if (!stints || stints.length === 0) return '';

    const byDriver = {};
    let maxLap = 0;
    stints.forEach(s => {
      if (!byDriver[s.driver_number]) byDriver[s.driver_number] = [];
      byDriver[s.driver_number].push(s);
      if (s.lap_end > maxLap) maxLap = s.lap_end;
    });

    // Sort drivers by first stint lap_start
    const sorted = Object.entries(byDriver).sort((a, b) =>
      Math.min(...a[1].map(x => x.lap_start)) - Math.min(...b[1].map(x => x.lap_start))
    );

    let html = `<div class="overflow-x-auto pb-2">`;
    html += `<div style="min-width:500px">`;

    // Legend
    html += `<div class="tyme-legend">
      <span class="tyme-legend-item"><span class="tyme-legend-dot tyme-soft"></span>SOFT</span>
      <span class="tyme-legend-item"><span class="tyme-legend-dot tyme-medium"></span>MEDIUM</span>
      <span class="tyme-legend-item"><span class="tyme-legend-dot tyme-hard"></span>HARD</span>
      <span class="tyme-legend-item"><span class="tyme-legend-dot tyme-inter"></span>INTERMEDIATE</span>
      <span class="tyme-legend-item"><span class="tyme-legend-dot tyme-wet"></span>WET</span>
      <span style="color:var(--text-muted);margin-left:8px">${maxLap} laps · ${stints.length} stints</span>
    </div>`;

    // Lap scale header
    const tickStep = maxLap > 60 ? 10 : maxLap > 30 ? 5 : 2;
    html += `<div class="tyme-scale">`;
    for (let i = 1; i <= maxLap; i += tickStep) {
      html += `<div class="tyme-tick" style="left:${((i-1)/(maxLap-1))*100}%">${i}</div>`;
    }
    html += `</div>`;

    // Driver rows
    for (const [dn, sts] of sorted) {
      const drv = driverMap[parseInt(dn)];
      const label = drv ? drv.name_acronym : dn;
      const colour = drv ? teamColor(drv.team_colour) : '#666';

      html += `<div class="tyme-row">
        <div class="tyme-label" style="color:${colour}">${label}</div>
        <div class="tyme-track">`;

      for (const s of sts) {
        const pctStart = ((s.lap_start - 1) / Math.max(maxLap - 1, 1)) * 100;
        const pctWidth = Math.max(((s.lap_end - s.lap_start + 1) / Math.max(maxLap - 1, 1)) * 100, 1.5);
        const comp = (s.compound || 'SOFT').toLowerCase();
        const cls = comp === 'soft' ? 'tyme-soft' : comp === 'medium' ? 'tyme-medium' : comp === 'hard' ? 'tyme-hard' : comp === 'intermediate' ? 'tyme-inter' : 'tyme-wet';
        const showLabel = pctWidth > 7;
        const ageOpt = s.tyre_age_at_start > 0 ? ` (used ${s.tyre_age_at_start} laps)` : ' (fresh)';

        html += `<div class="tyme-bar-seg ${cls}"
          style="left:${pctStart}%;width:${pctWidth}%"
          onmouseenter="showTymeTip(event,'${s.compound || '?'} · L${s.lap_start}-${s.lap_end}${ageOpt}')"
          onmouseleave="hideTymeTip()">`;
        if (showLabel) html += s.compound;
        html += `</div>`;
      }

      html += `</div></div>`;
    }

    html += `</div></div>`;
    return html;
  }

  let tymeTipEl = null;
  function showTymeTip(e, text) {
    if (!tymeTipEl) tymeTipEl = document.getElementById('tyme-tooltip');
    tymeTipEl.textContent = text;
    tymeTipEl.style.display = 'block';
    tymeTipEl.style.left = (e.clientX + 12) + 'px';
    tymeTipEl.style.top = (e.clientY - 30) + 'px';
  }
  function hideTymeTip() {
    if (tymeTipEl) tymeTipEl.style.display = 'none';
  }

  // ── Weather Chart Helper ──
  let weatherChartInstances = {};
  function initWeatherChart(sessionId, weather) {
    setTimeout(() => {
      const canvas = document.getElementById(`weather-chart-${sessionId}`);
      if (!canvas) return;

      // Destroy previous chart for this session
      if (weatherChartInstances[sessionId]) {
        weatherChartInstances[sessionId].destroy();
      }

      // Sample weather data
      const sampleStep = Math.max(1, Math.floor(weather.length / 40));
      const labels = [];
      const airSeries = [];
      const trackSeries = [];
      for (let i = 0; i < weather.length; i += sampleStep) {
        const w = weather[i];
        labels.push(Math.floor(i * 70 / weather.length) + 1);
        airSeries.push(w.air_temp);
        trackSeries.push(w.track_temp);
      }

      const ctx = canvas.getContext('2d');
      const isLight = document.documentElement.classList.contains('light');
      const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
      const textColor = isLight ? '#64748b' : '#8b949e';
      weatherChartInstances[sessionId] = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'Air Temp °C', data: airSeries,
              borderColor: '#f59e0b', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: false },
            { label: 'Track Temp °C', data: trackSeries,
              borderColor: '#dc2626', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: false },
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          animation: { duration: 400 },
          plugins: {
            legend: { position: 'top', labels: { color: textColor, font: { size: 10 } } }
          },
          scales: {
            x: { title: { display: true, text: 'Approx. Lap', color: textColor, font: { size: 10 } },
              grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 } } },
            y: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 } } }
          }
        }
      });
    }, 100);
  }

  // ── Views ──
  async function loadRaces() {
    currentView = 'races';
    const el = document.getElementById('content');
    el.innerHTML = '<div class="text-center py-20" style="color:var(--text-muted)">Loading...</div>';
    try {
      meetings = await api('/meetings');
      renderRaceList();
    } catch(e) {
      el.innerHTML = `<div class="text-center py-20" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  function renderRaceList() {
    const el = document.getElementById('content');
    const completed = meetings.filter(m => m.name !== 'Pre-Season Testing');
    let html = `
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      ${completed.map(m => `
        <div class="card p-5 cursor-pointer hover:border-gray-500 transition" onclick="loadSessions(${m.id}, '${m.name.replace(/'/g, "\\'")}')">
          <div class="flex items-center gap-3 mb-3">
            <span class="text-2xl">🏎️</span>
            <div>
              <div class="font-semibold text-sm">${m.name}</div>
              <div class="text-xs" style="color:var(--text-secondary)">${m.location}, ${m.country_name}</div>
            </div>
          </div>
          <div class="flex justify-between text-xs" style="color:var(--text-secondary)">
            <span>🗓️ ${m.date_start ? m.date_start.slice(0,10) : 'TBD'}</span>
            <span>🏟️ ${m.circuit_name || '—'}</span>
          </div>
        </div>
      `).join('')}
      </div>
      <div class="mt-6 text-xs text-center" style="color:var(--text-muted)">${completed.length} race weekend(s)</div>
    `;
    el.innerHTML = html;
  }

  async function loadSessions(meetingId, meetingName) {
    const el = document.getElementById('content');
    el.innerHTML = '<div class="text-center py-20" style="color:var(--text-muted)">Loading sessions...</div>';
    try {
      const sessions = await api(`/meetings/${meetingId}/sessions`);
      let html = `
        <div class="mb-6">
          <button onclick="loadRaces()" class="text-sm nav-link" style="display:inline">&larr; Back to races</button>
          <h2 class="text-xl font-bold mt-2">${meetingName}</h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      `;
      for (const s of sessions) {
        const icon = s.session_type === 'Race' ? '🏁' : s.session_type === 'Qualifying' ? '⏱️' : '🔧';
        html += `
          <div class="card p-5 cursor-pointer hover:border-gray-500 transition" onclick="loadSession(${s.id}, ${meetingId}, '${meetingName.replace(/'/g, "\\'")}', '${s.session_name.replace(/'/g, "\\'")}')">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${icon}</span>
              <div>
                <div class="font-semibold text-sm">${s.session_name}</div>
                <div class="text-xs" style="color:var(--text-secondary)">${s.session_type}</div>
              </div>
            </div>
          </div>
        `;
      }
      html += `</div>`;
      el.innerHTML = html;
    } catch(e) {
      el.innerHTML = `<div class="text-center py-20" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  async function loadSession(sessionId, meetingId, meetingName, sessionName) {
    const el = document.getElementById('content');
    el.innerHTML = '<div class="text-center py-20" style="color:var(--text-muted)">Loading session data...</div>';

    try {
      const [sectors, drivers, stints, pits, weather] = await Promise.all([
        api(`/sessions/${sessionId}/sectors`),
        api(`/sessions/${sessionId}/drivers`),
        api(`/sessions/${sessionId}/stints`),
        api(`/sessions/${sessionId}/pit-stops`),
        api(`/sessions/${sessionId}/weather`),
      ]);

      // Build driver map
      const driverMap = {};
      drivers.forEach(d => { driverMap[d.driver_number] = d; });

      let html = `
        <div class="mb-6">
          <button onclick="loadSessions(${meetingId}, '${meetingName.replace(/'/g, "\\'")}')" class="text-sm nav-link" style="display:inline">&larr; Back</button>
          <h2 class="text-xl font-bold mt-2">${meetingName} — ${sessionName}</h2>
        </div>

        <!-- Sector Times -->
        <div class="card p-5 mb-6">
          <div class="collapse-header flex items-center justify-between mb-4" onclick="toggleCollapse(this)">
            <h3 class="font-semibold text-sm">🏆 Best Sector Times
              <span class="text-xs font-normal ml-2" style="color:var(--text-muted)">
                🟣 Tercepat · 🟢 Top 3 · 🟡 Di luar Top 3
              </span>
            </h3>
            <span class="collapse-icon">▼</span>
          </div>
          <div class="collapse-body closed">
          <div class="overflow-x-auto">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Driver</th>
                  <th>Team</th>
                  <th class="text-right"><span class="sector-s1">Sector 1</span></th>
                  <th class="text-right"><span class="sector-s2">Sector 2</span></th>
                  <th class="text-right"><span class="sector-s3">Sector 3</span></th>
                  <th class="text-right">Best Lap</th>
                  <th class="text-right">Laps</th>
                </tr>
              </thead>
              <tbody>
      `;
      if (sectors.length === 0) {

      } else {

          const bestS1 = d.best_sector_1 === Math.min(...sectors.filter(x=>x.best_sector_1).map(x=>x.best_sector_1));
          const topS1 = [...sectors].filter(x => x.best_sector_1).sort((a,b) => a.best_sector_1 - b.best_sector_1).slice(0,3);
          const bestS2 = d.best_sector_2 === Math.min(...sectors.filter(x=>x.best_sector_2).map(x=>x.best_sector_2));
          const topS2 = [...sectors].filter(x => x.best_sector_2).sort((a,b) => a.best_sector_2 - b.best_sector_2).slice(0,3);
          const bestS3 = d.best_sector_3 === Math.min(...sectors.filter(x=>x.best_sector_3).map(x=>x.best_sector_3));
          const topS3 = [...sectors].filter(x => x.best_sector_3).sort((a,b) => a.best_sector_3 - b.best_sector_3).slice(0,3);

          const s2Color = bestS2 ? '#a855f7' : topS2.includes(d) && d.best_sector_2 ? '#16a34a' : d.best_sector_2 ? '#eab308' : '';
          const s3Color = bestS3 ? '#a855f7' : topS3.includes(d) && d.best_sector_3 ? '#16a34a' : d.best_sector_3 ? '#eab308' : '';
          const s1Bold = bestS1 || (topS1.includes(d) && d.best_sector_1) ? 'font-weight:700' : '';
          const s2Bold = bestS2 || (topS2.includes(d) && d.best_sector_2) ? 'font-weight:700' : '';
          const s3Bold = bestS3 || (topS3.includes(d) && d.best_sector_3) ? 'font-weight:700' : '';
          const bestLapS1 = d.best_sector_1 === Math.min(...sectors.filter(x=>x.best_sector_1).map(x=>x.best_sector_1));

              <td class="text-right font-mono ${bestS3 ? 'font-bold' : ''}" style="${s3Color ? 'color:' + s3Color : ''}${s3Bold ? ';' + s3Bold : ''}">${formatTime(d.best_sector_3)}</td>

      html += `</tbody></table></div></div></div>`;

      // ── Position History (Race only) ──
      html += `
      <div class="card p-5 mb-6">

      if (stints.length > 0) {

      // ── Pit Stop Analysis ──
      if (pits.length > 0) {

        // Group stops by driver + find fastest
        const allStops = [...pits].sort((a, b) => (a.pit_duration || 999) - (b.pit_duration || 999));
        const fastest = allStops[0];
        const slowest = allStops[allStops.length - 1];

        html += `
          <div class="card p-5 mb-6">

                <div>#${slowest.driver_number} L${slowest.lap_number}</div>

            <!-- Pit Window Timeline -->
            <div class="overflow-x-auto mb-3">
              <div style="min-width:450px">
                <div class="flex text-xs mb-1" style="color:var(--text-muted)">
                  <div style="width:44px"></div>
                  <div class="flex-1 flex">`;

        // Lap markers
        const pitMaxLap = Math.max(...pits.map(p => p.lap_number));
        const pitStep = pitMaxLap > 60 ? 10 : 5;
        for (let i = 1; i <= pitMaxLap; i += pitStep) {
          html += `<span style="width:${(pitStep/pitMaxLap)*100}%;text-align:center">L${i}</span>`;
        }
        html += `</div></div>`;

        // Driver rows sorted by first pit lap
        const sortedPits = Object.entries(byDriver).sort((a, b) =>

        for (const [dn, stops] of sortedPits) {
          const drv = driverMap[parseInt(dn)];
          const label = drv ? drv.name_acronym : dn;
          const colour = drv ? teamColor(drv.team_colour) : '#666';
          html += `<div class="flex items-center" style="height:20px;margin-bottom:2px">
            <div style="width:44px;font-size:10px;font-weight:700;text-align:right;padding-right:6px;color:${colour};flex-shrink:0">${label}</div>
            <div class="flex-1 relative" style="height:16px;background:var(--bg-primary);border-radius:3px">`;
          for (const s of stops) {
            const pct = ((s.lap_number - 1) / Math.max(pitMaxLap - 1, 1)) * 100;
            const duration = s.pit_duration || 25;
            const isFast = duration <= 22;
            html += `<div style="position:absolute;left:${pct}%;top:1px;width:12px;height:12px;border-radius:50%;background:${isFast ? '#16a34a' : '#e10600'};cursor:pointer;border:1px solid var(--bg-primary)"
              onmouseenter="showTymeTip(event,'#${dn} L${s.lap_number} · ${duration.toFixed(1)}s${isFast ? ' ⚡' : ''}')" onmouseleave="hideTymeTip()"></div>`;
          }
          html += `</div></div>`;
        }
        html += `</div></div>`;

        // Pit stops table
        html += `
            <div class="overflow-x-auto">
              <table>
                <thead><tr><th>Driver</th><th>Team</th><th class="text-right">Stops</th><th class="text-right">Avg Stop</th><th class="text-right">Fastest</th><th class="text-right">Laps</th></tr></thead>
                <tbody>
        `;
        const sortedByStops = Object.entries(byDriver).sort((a, b) => b[1].length - a[1].length);
        for (const [dn, stops] of sortedByStops) {
          const drv = driverMap[parseInt(dn)];
          const avgStop = stops.reduce((s, p) => s + (p.pit_duration || 0), 0) / stops.length;
          const fastestStop = Math.min(...stops.map(p => p.pit_duration || 999));
          const laps = stops.map(p => p.lap_number).sort((a,b) => a-b).join(', ');
          html += `
            <tr>
              <td class="font-medium">${drv ? drv.name_acronym : dn}</td>
              <td>${teamBadge(drv?.team_name, drv?.team_colour)}</td>
              <td class="text-right">${stops.length}</td>
              <td class="text-right font-mono">${avgStop.toFixed(1)}s</td>
              <td class="text-right font-mono" style="color:#16a34a">${fastestStop.toFixed(1)}s</td>
              <td class="text-right" style="color:var(--text-secondary);font-size:11px">${laps}</td>
            </tr>
          `;

        html += `</tbody></table></div></div></div>`;
      }

      // ── Weather Timeline ──
      if (weather.length > 0) {
        const airTemps = weather.filter(w => w.air_temp != null).map(w => w.air_temp);
        const trackTemps = weather.filter(w => w.track_temp != null).map(w => w.track_temp);
        const avgAir = (airTemps.reduce((s, t) => s + t, 0) / airTemps.length).toFixed(1);
        const avgTrack = (trackTemps.reduce((s, t) => s + t, 0) / trackTemps.length).toFixed(1);

        // Sample weather at regular intervals for chart (max ~50 points)
        const sampleStep = Math.max(1, Math.floor(weather.length / 40));
        const weatherLabels = [];
        const airSeries = [];
        const trackSeries = [];
        for (let i = 0; i < weather.length; i += sampleStep) {
          const w = weather[i];
          const lap = Math.floor(i * 70 / weather.length) + 1; // approximate lap number
          weatherLabels.push(lap);
          airSeries.push(w.air_temp);
          trackSeries.push(w.track_temp);
        }

        html += `
          <div class="card p-5 mb-6">
            <div class="collapse-header flex items-center justify-between mb-4" onclick="toggleCollapse(this)">
              <h3 class="font-semibold text-sm">🌤️ Weather Impact</h3>
              <span class="collapse-icon">▼</span>
            </div>
            <div class="collapse-body closed">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-xs" style="color:var(--text-secondary)">
              <div class="text-center p-2" style="background:var(--bg-primary);border-radius:6px">
                <div class="font-bold" style="color:var(--text-primary)">${Math.min(...airTemps).toFixed(1)}° - ${Math.max(...airTemps).toFixed(1)}°</div>
                <div>🌡️ Air Temp</div>
              </div>
              <div class="text-center p-2" style="background:var(--bg-primary);border-radius:6px">
                <div class="font-bold" style="color:var(--text-primary)">${Math.min(...trackTemps).toFixed(1)}° - ${Math.max(...trackTemps).toFixed(1)}°</div>
                <div>🛞 Track Temp</div>
              </div>
              <div class="text-center p-2" style="background:var(--bg-primary);border-radius:6px">
                <div class="font-bold" style="color:var(--text-primary)">${avgAir}° / ${avgTrack}°</div>
                <div>Average Air/Track</div>
              </div>
              <div class="text-center p-2" style="background:var(--bg-primary);border-radius:6px">
                <div class="font-bold" style="color:var(--text-primary)">${weather[0].humidity || '?'}%</div>
                <div>💧 Humidity</div>
              </div>
            </div>

            <div class="relative" style="height:200px">
              <canvas id="weather-chart-${sessionId}"></canvas>
            </div>
          </div></div>
        `;

        // Init weather chart after DOM render
        initWeatherChart(sessionId, weather);
      }

      // Compare button
      html += `
        <div class="card p-5">
          <div class="collapse-header flex items-center justify-between mb-4" onclick="toggleCollapse(this)">
            <h3 class="font-semibold text-sm">🤜🤛 Driver Comparison</h3>
            <span class="collapse-icon">▼</span>
          </div>
          <div class="collapse-body closed">
          <div class="flex flex-wrap gap-3 items-center">
            <select id="comp-drv1">
              ${drivers.map(d => `<option value="${d.driver_number}"${d.driver_number === 3 ? ' selected' : ''}>${d.full_name} (${d.name_acronym})</option>`).join('')}
            </select>
            <span style="color:var(--text-secondary)">vs</span>
            <select id="comp-drv2">
              ${drivers.map(d => `<option value="${d.driver_number}"${d.driver_number === 44 ? ' selected' : ''}>${d.full_name} (${d.name_acronym})</option>`).join('')}
            </select>
            <button onclick="compareDrivers(${sessionId})" class="bg-f1-red text-white px-4 py-2 rounded text-sm font-medium hover:opacity-90 transition">Compare</button>
          </div>
          <div id="comp-result" class="mt-4"></div>
        </div></div>

      <!-- Gap Timeline -->
      <div class="card p-5 mt-6">
        <div class="collapse-header flex items-center justify-between mb-4" onclick="toggleCollapse(this)">
          <h3 class="font-semibold text-sm">📊 Gap Timeline</h3>
          <span class="collapse-icon">▼</span>
        </div>
        <div class="collapse-body closed">
          <div class="flex flex-wrap gap-3 items-center mb-3">
            <button onclick="gapSelectAll(${sessionId})" class="text-xs px-3 py-1.5 rounded" style="background:var(--badge-soft);color:var(--badge-soft-text);border:1px solid var(--border-color);cursor:pointer">✅ Select All</button>
            <button onclick="gapDeselectAll()" class="text-xs px-3 py-1.5 rounded" style="background:var(--badge-soft);color:var(--badge-soft-text);border:1px solid var(--border-color);cursor:pointer">⬜ Clear</button>
            <span style="color:var(--text-secondary);font-size:11px">Pick drivers to show:</span>
          </div>
          <div class="flex flex-wrap gap-2 mb-3" id="gap-drivers">
            ${drivers.map(d => `
              <label class="flex items-center gap-1.5 text-xs cursor-pointer" style="color:var(--text-primary)">
                <input type="checkbox" class="gap-cb" value="${d.driver_number}" data-acronym="${d.name_acronym}" checked>
                <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${teamColor(d.team_colour)}"></span>
                ${d.name_acronym}
              </label>
            `).join('')}
          </div>
          <div class="flex items-center gap-3 mb-3">
            <select id="gap-ref" class="text-xs">
              <option value="">🚩 Leader (auto)</option>
              ${drivers.map(d => `<option value="${d.driver_number}">📌 ${d.name_acronym} (${d.full_name})</option>`).join('')}
            </select>
            <button onclick="loadGaps(${sessionId})" class="bg-f1-red text-white px-4 py-2 rounded text-sm font-medium hover:opacity-90 transition">📈 Plot Gaps</button>
          </div>
          <div class="text-xs mb-3" style="color:var(--text-muted)">Cumulative gap to leader per lap — garis di 0 = leader. Pilih driver buat dibandingin.</div>
          <div id="gap-chart-area"></div>
        </div>
      </div>

      <!-- Tyre Degradation -->
      <div class="card p-5 mt-6">
        <div class="collapse-header flex items-center justify-between mb-4" onclick="toggleCollapse(this)">
          <h3 class="font-semibold text-sm">🛞 Tyre Degradation</h3>
          <span class="collapse-icon">▼</span>
        </div>
        <div class="collapse-body closed">
          <div class="flex flex-wrap gap-3 items-center mb-3">
            <select id="deg-drv1">
              ${drivers.map(d => `<option value="${d.driver_number}"${d.driver_number === 3 ? ' selected' : ''}>${d.full_name} (${d.name_acronym})</option>`).join('')}
            </select>
            <span style="color:var(--text-secondary)">vs</span>
            <select id="deg-drv2">
              ${drivers.map(d => `<option value="${d.driver_number}"${d.driver_number === 44 ? ' selected' : ''}>${d.full_name} (${d.name_acronym})</option>`).join('')}
            </select>
            <button onclick="loadDegradation(${sessionId})" class="bg-f1-red text-white px-4 py-2 rounded text-sm font-medium hover:opacity-90 transition">Plot</button>
          </div>
          <div class="text-xs mb-3" style="color:var(--text-muted)">Lap time vs tyre age — garis solid = Driver 1, garis putus = Driver 2</div>
          <div id="deg-chart-area"></div>

      el.innerHTML = html;
    } catch(e) {
      el.innerHTML = `<div class="text-center py-20" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  let degChartInstance = null;
  let gapChartInstance = null;
  let posChartInstance = null;

  // ── Tyre Degradation ──
  async function loadDegradation(sessionId) {
    const d1el = document.getElementById('deg-drv1');
    const d2el = document.getElementById('deg-drv2');
    const d1 = d1el.value;
    const d2 = d2el.value;
    if (d1 === d2) { return; }
    const d1name = d1el.options[d1el.selectedIndex].text.match(/\((\w+)\)/)?.[1] || d1;
    const d2name = d2el.options[d2el.selectedIndex].text.match(/\((\w+)\)/)?.[1] || d2;
    const el = document.getElementById('deg-chart-area');
    el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">Loading degradation data...</div>';

    if (degChartInstance) { degChartInstance.destroy(); degChartInstance = null; }

    try {
      const [laps1, laps2] = await Promise.all([
        api(`/sessions/${sessionId}/laps?driver=${d1}`),
        api(`/sessions/${sessionId}/laps?driver=${d2}`),
      ]);

      const filterValid = laps => laps.filter(l => l.lap_duration && l.lap_duration > 10 && l.lap_duration < 600 && l.tyre_age != null && l.compound);
      const f1 = filterValid(laps1);
      const f2 = filterValid(laps2);

      if (f1.length === 0 && f2.length === 0) {
        el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">No tyre degradation data available</div>';
        return;
      }

      const compoundColors = {
        'SOFT': '#e10600', 'MEDIUM': '#d97706', 'HARD': '#6b7280',
        'INTERMEDIATE': '#2d7d46', 'WET': '#1a5c7a'
      };
      const compoundLabels = { 'SOFT': 'Soft', 'MEDIUM': 'Medium', 'HARD': 'Hard', 'INTERMEDIATE': 'Intermediate', 'WET': 'Wet' };

      const datasets = [];
      // Driver 1
      for (const compound of [...new Set(f1.map(l => l.compound))]) {
        const pts = f1.filter(l => l.compound === compound);
        datasets.push({
          label: `${d1name} ${compoundLabels[compound] || compound}`,
          data: pts.map(l => ({ x: l.tyre_age, y: l.lap_duration })),
          borderColor: compoundColors[compound] || '#666',
          backgroundColor: compoundColors[compound] || '#666',
          borderWidth: 2,
          pointRadius: 3,
          tension: 0.3,
        });
      }
      // Driver 2
      for (const compound of [...new Set(f2.map(l => l.compound))]) {
        const pts = f2.filter(l => l.compound === compound);
        datasets.push({
          label: `${d2name} ${compoundLabels[compound] || compound}`,
          data: pts.map(l => ({ x: l.tyre_age, y: l.lap_duration })),
          borderColor: compoundColors[compound] || '#666',
          borderDash: [5, 5],
          borderWidth: 2,
          pointRadius: 3,
          pointStyle: 'rectRot',
          tension: 0.3,
        });
      }

      // Avg lap times
      const avg1 = (f1.reduce((s, l) => s + l.lap_duration, 0) / f1.length).toFixed(3);
      const avg2 = (f2.reduce((s, l) => s + l.lap_duration, 0) / f2.length).toFixed(3);

      el.innerHTML = `
        <div class="grid grid-cols-2 gap-3 mb-4 text-xs" style="color:var(--text-secondary)">
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:#e10600">${d1name}</div>
            <div>Avg: ${avg1}s · Laps: ${f1.length}</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:#16a34a">${d2name}</div>
            <div>Avg: ${avg2}s · Laps: ${f2.length}</div>
          </div>
        </div>
        <div class="relative" style="height:350px">
          <canvas id="deg-chart-canvas"></canvas>
        </div>
      `;

      setTimeout(() => {
        const canvas = document.getElementById('deg-chart-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const isLight = document.documentElement.classList.contains('light');

  // ── Gap Timeline ──
  function gapSelectAll(sessionId) {

  async function loadGaps(sessionId) {
    const el = document.getElementById('gap-chart-area');
    el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">Loading gap data...</div>';

    const refEl = document.getElementById('gap-ref');
    const refValue = refEl.value;
    const refParam = refValue ? `?reference=${refValue}` : '';

    if (gapChartInstance) { gapChartInstance.destroy(); gapChartInstance = null; }

    try {
      const data = await api(`/sessions/${sessionId}/gaps${refParam}`);
      const timeline = data.timeline;
      const leader = data.leader;
      const maxLap = data.max_lap || 0;

      if (!timeline || timeline.length === 0) {
        el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">No gap data available — try a Race session</div>';
        return;
      }

      // Which drivers are selected?
      const selected = [];
      document.querySelectorAll('.gap-cb:checked').forEach(cb => {
        selected.push(parseInt(cb.value));
      });

      // Get unique drivers in data
      const allDrivers = [...new Set(timeline.map(t => t.driver_number))];
      const showDrivers = selected.length > 0
        ? allDrivers.filter(dn => selected.includes(dn))
        : allDrivers;

      // Build per-driver series: { driver_number, acronym, color, team_name, laps: [{lap, gap}] }
      const seriesMap = {};
      for (const entry of timeline) {
        if (!showDrivers.includes(entry.driver_number)) continue;
        if (!seriesMap[entry.driver_number]) {
          seriesMap[entry.driver_number] = {
            acronym: entry.acronym,
            team_name: entry.team_name,
            team_colour: entry.team_colour,
            points: [],
          };
        }
        seriesMap[entry.driver_number].points.push({
          lap: entry.lap,
          gap: entry.gap_to_leader,
        });
      }

      // Colors for top 20 drivers
      const DRIVER_COLORS = [
        '#e10600', '#16a34a', '#3b82f6', '#f59e0b', '#8b5cf6',
        '#ec4899', '#14b8a6', '#f97316', '#06b6d4', '#84cc16',
        '#dc2626', '#6366f1', '#d946ef', '#22c55e', '#eab308',
        '#64748b', '#0ea5e9', '#a855f7', '#10b981', '#9ca3af',
      ];

      const labels = [];
      for (let i = 1; i <= maxLap; i++) labels.push(i);

      let colorIdx = 0;
      const datasets = [];
      const driverEntries = Object.entries(seriesMap).sort((a, b) => {
        // Sort by last gap (final position)
        const aLast = a[1].points[a[1].points.length - 1]?.gap || 0;
        const bLast = b[1].points[b[1].points.length - 1]?.gap || 0;
        return aLast - bLast;
      });

      for (const [dn, series] of driverEntries) {
        const color = series.team_colour
          ? `#${series.team_colour.replace('#', '')}`
          : DRIVER_COLORS[colorIdx % DRIVER_COLORS.length];
        colorIdx++;

        const data = [];
        const ptsByLap = {};
        for (const p of series.points) {
          ptsByLap[p.lap] = p.gap;
        }
        for (let i = 1; i <= maxLap; i++) {
          data.push(i in ptsByLap ? ptsByLap[i] : null);
        }

        datasets.push({
          label: series.acronym || `#${dn}`,
          data: data,
          borderColor: color,
          backgroundColor: color,
          borderWidth: 1.5,
          pointRadius: 0,
          pointHoverRadius: 4,
          tension: 0.1,
          spanGaps: false,
          fill: false,
        });
      }

      // Stats summary
      const finalGaps = driverEntries.map(([dn, s]) => {
        const lastPt = s.points[s.points.length - 1];
        return { dn, acronym: s.acronym, gap: lastPt?.gap || 0 };
      });
      const leaderAcronym = leader?.acronym || '—';
      const refLabel = refValue ? `(ref: #${refValue})` : '(auto leader)';

      el.innerHTML = `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-xs" style="color:var(--text-secondary)">
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">🏁 ${leaderAcronym}</div>
            <div>Race Leader ${refLabel}</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${maxLap}</div>
            <div>Total Laps</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${driverEntries.length}</div>
            <div>Drivers Shown</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${finalGaps.length > 1 ? (finalGaps[finalGaps.length-1].gap - finalGaps[1].gap).toFixed(1) + 's' : '—'}</div>
            <div>P1 → Last Gap</div>
          </div>
        </div>
        <div class="relative" style="height:350px">
          <canvas id="gap-chart-canvas"></canvas>
        </div>
        <div class="overflow-x-auto mt-4">
          <table>
            <thead>
              <tr><th>Pos</th><th>Driver</th><th>Team</th><th class="text-right">Final Gap</th><th class="text-right">Max Gap</th><th class="text-right">Avg Gap/Lap</th></tr>
            </thead>
            <tbody>
              ${driverEntries.map(([dn, s], i) => {
                const gaps = s.points.map(p => p.gap);
                const finalGap = gaps[gaps.length - 1] || 0;
                const maxGap = Math.max(...gaps);
                const avgGap = gaps.reduce((a, b) => a + b, 0) / gaps.length;
                const isLeader = finalGap === 0;
                return `
                  <tr>
                    <td style="color:var(--text-secondary)">${i + 1}</td>
                    <td class="font-medium">${s.acronym || `#${dn}`}</td>
                    <td>${s.team_name ? `<span class="team-badge" style="background:#${s.team_colour?.replace('#', '') || '666'};color:#fff">${s.team_name.replace(/ F1 Team$/, '').replace(/ Team$/, '').substring(0, 12)}</span>` : '—'}</td>
                    <td class="text-right font-mono ${isLeader ? 'font-bold' : ''}" style="${isLeader ? 'color:#16a34a' : ''}">${isLeader ? '0.000s (P1)' : '+' + finalGap.toFixed(3) + 's'}</td>
                    <td class="text-right font-mono" style="color:var(--text-secondary)">${maxGap > 0 ? '+' + maxGap.toFixed(1) + 's' : '—'}</td>
                    <td class="text-right font-mono" style="color:var(--text-secondary)">${avgGap > 0 ? '+' + avgGap.toFixed(2) + 's' : '0.00s'}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;

      // Render chart after DOM
      setTimeout(() => {
        const canvas = document.getElementById('gap-chart-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const isLight = document.documentElement.classList.contains('light');
        const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
        const textColor = isLight ? '#64748b' : '#8b949e';

        gapChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: datasets,
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 400 },
            interaction: {
              mode: 'index',
              intersect: false,
            },
            plugins: {
              legend: {
                position: 'top',
                labels: { color: textColor, font: { size: 10 }, boxWidth: 14, padding: 8 },
              },
              tooltip: {
                callbacks: {
                  title: (items) => `Lap ${items[0].label}`,
                  label: (ctx) => {
                    const val = ctx.parsed.y;
                    if (val === null) return null;
                    return `${ctx.dataset.label}: ${val > 0 ? '+' : ''}${val.toFixed(3)}s`;
                  },
                },
              },
            },
            scales: {
              x: {
                title: { display: true, text: 'Lap', color: textColor, font: { size: 11 } },
                grid: { color: gridColor },
                ticks: { color: textColor, font: { size: 10 } },
                min: 1,
              },
              y: {
                title: { display: true, text: 'Gap to Leader (s)', color: textColor, font: { size: 11 } },
                grid: { color: gridColor },
                ticks: { color: textColor, font: { size: 10 } },
                beginAtZero: true,
              },
            },
          },
        });
      }, 50);
    } catch(e) {
      el.innerHTML = `<div class="text-center py-8" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  // ── Position History ──
  async function loadPositionHistory(sessionId) {
    const el = document.getElementById('pos-chart-area');
    el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">Loading position data...</div>';

    if (posChartInstance) { posChartInstance.destroy(); posChartInstance = null; }

    try {
      const data = await api(`/sessions/${sessionId}/positions`);
      const timeline = data.timeline;
      const maxLap = data.max_lap;

      if (!timeline || timeline.length === 0) {
        el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">No position data available</div>';
        return;
      }

      // Group by lap
      const lapPositions = {};
      const driverMap = {};
      for (const entry of timeline) {
        if (!lapPositions[entry.lap]) lapPositions[entry.lap] = [];
        lapPositions[entry.lap].push(entry);
        driverMap[entry.driver_number] = {
          acronym: entry.acronym,
          full_name: entry.full_name,
          team_name: entry.team_name,
          team_colour: entry.team_colour,
        };
      }

      const allDrivers = Object.keys(driverMap).map(Number);
      const allLaps = Object.keys(lapPositions).map(Number).sort((a, b) => a - b);

      // Build per-driver position series
      const labels = [];
      for (let i = 1; i <= maxLap; i++) labels.push(i);

      // Driver colors
      const DRIVER_COLORS = [
        '#e10600', '#16a34a', '#3b82f6', '#f59e0b', '#8b5cf6',
        '#ec4899', '#14b8a6', '#f97316', '#06b6d4', '#84cc16',
        '#dc2626', '#6366f1', '#d946ef', '#22c55e', '#eab308',
        '#64748b', '#0ea5e9', '#a855f7', '#10b981', '#9ca3af',
      ];

      let colorIdx = 0;
      const datasets = [];
      const sortedDrivers = [...allDrivers].sort((a, b) => {
        // Sort by final position (lower is better)
        const aLast = lapPositions[allLaps[allLaps.length - 1]]?.find(e => e.driver_number === a);
        const bLast = lapPositions[allLaps[allLaps.length - 1]]?.find(e => e.driver_number === b);
        return (aLast?.position || 99) - (bLast?.position || 99);
      });

      for (const dn of sortedDrivers) {
        const info = driverMap[dn];
        const color = info.team_colour
          ? `#${info.team_colour.replace('#', '')}`
          : DRIVER_COLORS[colorIdx % DRIVER_COLORS.length];
        colorIdx++;

        const data = [];
        for (let i = 1; i <= maxLap; i++) {
          const entry = lapPositions[i]?.find(e => e.driver_number === dn);
          data.push(entry?.position || null);
        }

        datasets.push({
          label: info.acronym || `#${dn}`,
          data: data,
          borderColor: color,
          backgroundColor: color,
          borderWidth: 2,
          pointRadius: 1.5,
          pointHoverRadius: 5,
          tension: 0,
          spanGaps: true,
          fill: false,
          stepped: 'before',  // step-line: position only changes at lap boundaries
        });
      }

      // Summary stats: how many position changes, avg overtakes per lap
      const changes = {};
      for (const dn of allDrivers) {
        let prevPos = null;
        let chg = 0;
        for (let i = 1; i <= maxLap; i++) {
          const entry = lapPositions[i]?.find(e => e.driver_number === dn);
          if (entry && entry.position) {
            if (prevPos !== null && entry.position !== prevPos) chg++;
            prevPos = entry.position;
          }
        }
        changes[dn] = chg;
      }
      const totalChanges = Object.values(changes).reduce((s, c) => s + c, 0);

      // Count distinct positions
      const maxPos = Math.max(...timeline.map(e => e.position));
      const posRange = maxPos;

      el.innerHTML = `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-xs" style="color:var(--text-secondary)">
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${maxLap}</div>
            <div>Total Laps</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${allDrivers.length}</div>
            <div>Drivers</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${totalChanges}</div>
            <div>Position Changes</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">P1 - P${posRange}</div>
            <div>Position Range</div>
          </div>
        </div>
        <div class="text-xs mb-2" style="color:var(--text-muted);text-align:center">
          Chart shows each driver's position lap by lap. Hover to see details. 
          <strong>P1 on top</strong> — lines stepping right show position holds, 
          crossing lines show overtakes. Enable/disable drivers via legend.
        </div>
        <div class="relative" style="height:450px">
          <canvas id="pos-chart-canvas"></canvas>
        </div>
      `;

      // Render chart
      setTimeout(() => {
        const canvas = document.getElementById('pos-chart-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const isLight = document.documentElement.classList.contains('light');
        const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
        const textColor = isLight ? '#64748b' : '#8b949e';

        posChartInstance = new Chart(ctx, {
          type: 'line',
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 300 },
            interaction: {
              mode: 'index',
              intersect: false,
            },
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  color: textColor,
                  font: { size: 9 },
                  boxWidth: 12,
                  padding: 6,
                  usePointStyle: true,
                  pointStyle: 'line',
                },
              },
              tooltip: {
                callbacks: {
                  title: (items) => `Lap ${items[0].label}`,
                  label: (ctx) => {
                    const val = ctx.parsed.y;
                    if (val === null) return null;
                    return `${ctx.dataset.label}: P${val}${val === 1 ? ' 🏆' : ''}`;
                  },
                },
              },
            },
            scales: {
              x: {
                title: { display: true, text: 'Lap', color: textColor, font: { size: 11 } },
                grid: { color: gridColor },
                ticks: { color: textColor, font: { size: 10 } },
                min: 1,
              },
              y: {
                title: { display: true, text: 'Race Position', color: textColor, font: { size: 11 } },
                grid: { color: gridColor },
                ticks: {
                  color: textColor,
                  font: { size: 10 },
                  stepSize: 1,
                  callback: (v) => `P${v}`,
                },
                min: 1,
                max: posRange + 0.5,
                reverse: true,
              },
            },
            elements: {
              line: {
                stepped: 'before',
              },
            },
          },
        });
      }, 50);
    } catch(e) {
      el.innerHTML = `<div class="text-center py-8" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  async function compareDrivers(sessionId) {
    const d1el = document.getElementById('comp-drv1');
    const d2el = document.getElementById('comp-drv2');
    const d1 = d1el.value;
    const d2 = d2el.value;
    const d1name = d1el.options[d1el.selectedIndex].text.match(/\((\w+)\)/)?.[1] || d1;
    const d2name = d2el.options[d2el.selectedIndex].text.match(/\((\w+)\)/)?.[1] || d2;
    const el = document.getElementById('comp-result');
    el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">Loading comparison...</div>';

    // Destroy previous chart
    if (lapChartInstance) { lapChartInstance.destroy(); lapChartInstance = null; }

    try {
      const data = await api(`/sessions/${sessionId}/compare/${d1}/${d2}`);
      const lapsA = data.driver_a;
      const lapsB = data.driver_b;
      const maxLaps = Math.max(lapsA.length, lapsB.length);

      // Build lap arrays
      const labels = [];
      const timesA = [];
      const timesB = [];
      const gapCumulative = [];
      let cumGap = 0;
      for (let i = 0; i < maxLaps; i++) {
        const a = lapsA[i] || {};
        const b = lapsB[i] || {};
        labels.push(i + 1);
        timesA.push(a.lap_duration || null);
        timesB.push(b.lap_duration || null);
        const delta = a.lap_duration && b.lap_duration ? (a.lap_duration - b.lap_duration) : 0;
        cumGap += delta;
        gapCumulative.push(+(cumGap.toFixed(3)));
      }

      // Chart canvas + table
      let html = ``;

      // Chart container
      html += `<div class="relative" style="height:300px;margin-bottom:16px">
        <canvas id="lap-chart-canvas"></canvas>
      </div>`;

      // Stats summary
      // Legend
      html += `
        <div class="flex flex-wrap gap-x-4 gap-y-1 justify-center mb-4 text-xs" style="color:var(--text-secondary)">
          <span><strong style="color:#16a34a">🟢 Hijau</strong> = Pembalap ini lebih cepat di sektor itu</span>
          <span><strong style="color:#eab308">🟡 Kuning</strong> = Pembalap ini lebih lambat (↓ delta)</span>
          <span>Δ ${d1name} - ${d2name} 🟢 = ${d1name} · 🔴 = ${d2name}</span>
        </div>`;
      const avgA = timesA.filter(t => t).reduce((s, t) => s + t, 0) / timesA.filter(t => t).length || 0;
      const avgB = timesB.filter(t => t).reduce((s, t) => s + t, 0) / timesB.filter(t => t).length || 0;
      const bestA = Math.min(...timesA.filter(t => t));
      const bestB = Math.min(...timesB.filter(t => t));
      html += `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-xs" style="color:var(--text-secondary)">
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:${d1name ? '#e10600' : ''}">${d1name}</div>
            <div>Avg: ${avgA.toFixed(3)}s</div>
            <div>Best: ${bestA.toFixed(3)}s</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold">📊 Stats</div>
            <div>Δ avg: ${(avgA - avgB) > 0 ? '+' : ''}${(avgA - avgB).toFixed(3)}s</div>
            <div>Total gap: ${gapCumulative[gapCumulative.length-1] > 0 ? '+' : ''}${gapCumulative[gapCumulative.length-1].toFixed(1)}s</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:#16a34a">${d2name}</div>
            <div>Avg: ${avgB.toFixed(3)}s</div>
            <div>Best: ${bestB.toFixed(3)}s</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold">🏁 Laps</div>
            <div>${d1name}: ${lapsA.length}</div>
            <div>${d2name}: ${lapsB.length}</div>
          </div>
        </div>`;

      // Comparison table (existing)
      html += `
        <div class="overflow-x-auto">
          <table>
            <thead>
              <tr>
                <th>Lap</th>
                <th class="text-right">${d1name}</th>
                <th class="text-right">Δ</th>
                <th class="text-right">${d2name}</th>
                <th class="text-right"><span class='sector-s1'>S1</span> ${d1name}</th>
                <th class="text-right"><span class='sector-s1'>S1</span> ${d2name}</th>
                <th class="text-right"><span class='sector-s2'>S2</span> ${d1name}</th>
                <th class="text-right"><span class='sector-s2'>S2</span> ${d2name}</th>
                <th class="text-right"><span class='sector-s3'>S3</span> ${d1name}</th>
                <th class="text-right"><span class='sector-s3'>S3</span> ${d2name}</th>
              </tr>
            </thead>
            <tbody>
      `;

      for (let i = 0; i < maxLaps; i++) {
        const a = lapsA[i] || {};
        const b = lapsB[i] || {};
        const delta = a.lap_duration && b.lap_duration ? (a.lap_duration - b.lap_duration) : null;
        const color = delta ? (delta < 0 ? 'color:#16a34a' : 'color:#dc2626') : '';
        html += `
          <tr>
            <td style="color:var(--text-secondary)">${i + 1}</td>
            <td class="text-right font-mono">${formatTime(a.lap_duration)}</td>
            <td class="text-right font-mono font-bold" style="${color}">${delta !== null ? (delta > 0 ? '+' : '') + delta.toFixed(3) : '—'}</td>
            <td class="text-right font-mono">${formatTime(b.lap_duration)}</td>
            <td class="text-right font-mono" style="${a.sector_1 && b.sector_1 && a.sector_1 < b.sector_1 ? 'color:#16a34a;font-weight:700' : a.sector_1 && b.sector_1 ? 'color:#eab308' : ''}">${formatTime(a.sector_1)}</td>
            <td class="text-right font-mono" style="${a.sector_1 && b.sector_1 && a.sector_1 > b.sector_1 ? 'color:#16a34a;font-weight:700' : a.sector_1 && b.sector_1 ? 'color:#eab308' : ''}">${formatTime(b.sector_1)}</td>
            <td class="text-right font-mono" style="${a.sector_2 && b.sector_2 && a.sector_2 < b.sector_2 ? 'color:#16a34a;font-weight:700' : a.sector_2 && b.sector_2 ? 'color:#eab308' : ''}">${formatTime(a.sector_2)}</td>
            <td class="text-right font-mono" style="${a.sector_2 && b.sector_2 && a.sector_2 > b.sector_2 ? 'color:#16a34a;font-weight:700' : a.sector_2 && b.sector_2 ? 'color:#eab308' : ''}">${formatTime(b.sector_2)}</td>
            <td class="text-right font-mono" style="${a.sector_3 && b.sector_3 && a.sector_3 < b.sector_3 ? 'color:#16a34a;font-weight:700' : a.sector_3 && b.sector_3 ? 'color:#eab308' : ''}">${formatTime(a.sector_3)}</td>
            <td class="text-right font-mono" style="${a.sector_3 && b.sector_3 && a.sector_3 > b.sector_3 ? 'color:#16a34a;font-weight:700' : a.sector_3 && b.sector_3 ? 'color:#eab308' : ''}">${formatTime(b.sector_3)}</td>
          </tr>
        `;
      }
      html += `</tbody></table></div>`;
      el.innerHTML = html;

      // Initialize chart after DOM is ready
      setTimeout(() => {
        const canvas = document.getElementById('lap-chart-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const isLight = document.documentElement.classList.contains('light');
        const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
        const textColor = isLight ? '#64748b' : '#8b949e';

        lapChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              {
                label: d1name,
                data: timesA,
                borderColor: '#e10600',
                backgroundColor: 'rgba(225,6,0,0.1)',
                borderWidth: 2,
                pointRadius: 0,
                pointHoverRadius: 4,
                tension: 0.1,
                fill: true,
                spanGaps: false,
              },
              {
                label: d2name,
                data: timesB,
                borderColor: '#16a34a',
                backgroundColor: 'rgba(22,163,74,0.1)',
                borderWidth: 2,
                pointRadius: 0,
                pointHoverRadius: 4,
                tension: 0.1,
                fill: false,
                spanGaps: false,
              },
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 400 },
            interaction: {
              mode: 'index',
              intersect: false,
            },
            plugins: {
              legend: {
                position: 'top',
                labels: { color: textColor, font: { size: 11 } }
              },
              tooltip: {
                callbacks: {
                  label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(3)}s`
                }
              }
            },
            scales: {
              x: {
                title: { display: true, text: 'Lap', color: textColor, font: { size: 11 } },
                grid: { color: gridColor },
                ticks: { color: textColor, font: { size: 10 } }
              },
              y: {
                title: { display: true, text: 'Lap Time (s)', color: textColor, font: { size: 11 } },
                grid: { color: gridColor },
                ticks: { color: textColor, font: { size: 10 } },
                reverse: true,
              }
            }
          }
        });
      }, 50);
    } catch(e) {
      el.innerHTML = `<div class="text-center py-8" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  // ── Collapse Toggle ──
  function toggleCollapse(header) {
    const body = header.nextElementSibling;
    const icon = header.querySelector('.collapse-icon');
    if (body) body.classList.toggle('closed');
    if (icon) icon.classList.toggle('open');
  }

  function showAbout() {
    currentView = 'about';
    document.getElementById('content').innerHTML = `
      <div class="card p-8 max-w-2xl mx-auto text-center">
        <h2 class="text-xl font-bold mb-4">🏎️ F1 Analysis 2026</h2>
        <p style="color:var(--text-secondary)" class="mb-6">Formula 1 sector times, tyre strategy, and driver comparison platform.</p>
        <div class="text-left text-sm" style="color:var(--text-secondary)">
          <p><strong>Data Source:</strong> OpenF1 API + FastAPI Backend</p>
          <p><strong>Database:</strong> PostgreSQL 18</p>
          <p><strong>Season:</strong> 2026</p>
          <p><strong>Features:</strong> Sector times · Position History · Tyre strategy timeline · Pit stop analysis · Weather impact · Driver comparison · Gap Timeline · Tyre degradation</p>
          <p class="mt-4"><strong>GitHub:</strong> <a href="https://github.com/edsuwarna/f1-analysis" target="_blank" style="color:var(--text-primary);text-decoration:underline">github.com/edsuwarna/f1-analysis</a></p>
        </div>
        <div class="mt-6 text-xs" style="color:var(--text-muted)">
          F1 is a trademark of Formula One Licensing B.V. This is an unofficial project.
        </div>
      </div>
    `;
  }

  // ── Init ──
  initTheme();
  loadRaces();
  </script>
</body>
</html>
