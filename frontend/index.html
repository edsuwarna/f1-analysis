<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Analysis 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.tailwindcss.com">
  {
    darkMode: 'class'
  }
</script>
<style>
  :root {
    --bg-primary: #0f1115;
    --bg-card: #1a1d24;
    --border-color: #2d3139;
    --text-primary: #e1e1e6;
    --text-secondary: #8b949e;
    --text-muted: #6b7280;
    --table-border: #1f2329;
    --hover-bg: rgba(255,255,255,.03);
    --hover-card-border: #6b7280;
    --input-bg: #1a1d24;
    --badge-soft: #333;
    --badge-soft-text: #e1e1e6;
  }
  .light {
    --bg-primary: #f5f6f8;
    --bg-card: #ffffff;
    --border-color: #e2e8f0;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --table-border: #e2e8f0;
    --hover-bg: rgba(0,0,0,.02);
    --hover-card-border: #94a3b8;
    --input-bg: #ffffff;
    --badge-soft: #e2e8f0;
    --badge-soft-text: #475569;
  }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transition: background .2s, color .2s;
  }
  .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; transition: background .2s, border-color .2s; }
  .f1-red { color: #e10600; }
  .bg-f1-red { background: #e10600; }
  .sector-badge { font-variant-numeric: tabular-nums; }
  .team-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .team-badge { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; line-height: 1.4; }
  .team-logo { display: inline-block; height: 20px; width: auto; vertical-align: middle; object-fit: contain; }
  .nav-link { color: var(--text-secondary); cursor: pointer; padding: 8px 16px; border-radius: 6px; transition: all .15s; }
  .nav-link:hover { color: var(--text-primary); background: var(--hover-bg); }
  .nav-link.active { color: #fff; background: #e10600; }
  .light .nav-link.active { color: #fff; }
  .loading { opacity: .5; pointer-events: none; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 12px; font-size: 11px; text-transform: uppercase; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--table-border); font-size: 13px; transition: background .15s; }
  tr:hover td { background: var(--hover-bg); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-soft { background: var(--badge-soft); color: var(--badge-soft-text); }
  .badge-medium { background: #d97706; color: #fff; }
  .light .badge-medium { background: #f59e0b; color: #fff; }
  .badge-hard { background: #6b7280; color: #fff; }
  .badge-inter { background: #2d7d46; color: #fff; }
  .badge-wet { background: #1a5c7a; color: #fff; }
  select, input {
    background: var(--input-bg);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    transition: background .2s, border-color .2s;
  }
  .theme-btn {
    background: none;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    color: var(--text-primary);
    transition: all .2s;
  }
  .theme-btn:hover {
    background: var(--hover-bg);
    border-color: var(--hover-card-border);
  }
  .light .text-gray-400 { color: var(--text-secondary) !important; }
  .light .text-gray-500 { color: var(--text-muted) !important; }
  .light .text-gray-700 { color: var(--text-primary) !important; }
  .light .text-green-400 { color: #16a34a !important; }
  .light .text-red-400 { color: #dc2626 !important; }

  /* ── Sector Colors ── */
  .sector-s1 { color: #ec4899; }  /* Pink */
  .sector-s2 { color: #00b4d8; }  /* Ocean Blue */
  .sector-s3 { color: #f59e0b; }  /* Amber/Gold */

  /* ── Collapse Sections ── */
  .collapse-header { cursor: pointer; user-select: none; }
  .collapse-header:hover { opacity: .8; }
  .collapse-icon { transition: transform .2s; font-size: 12px; color: var(--text-muted); display: inline-block; }
  .collapse-icon.open { transform: rotate(180deg); }
  .collapse-body { overflow: hidden; }
  .collapse-body.closed { display: none; }

  /* ── Tyre Timeline ── */
  .tyme-row {
    display: flex;
    align-items: center;
    margin-bottom: 3px;
    height: 26px;
  }
  .tyme-row:hover .tyme-bar-seg {
    opacity: .85;
    filter: brightness(1.15);
  }
  .tyme-label {
    width: 44px;
    font-size: 10px;
    font-weight: 700;
    text-align: right;
    padding-right: 8px;
    flex-shrink: 0;
    letter-spacing: .5px;
  }
  .tyme-track {
    flex: 1;
    position: relative;
    height: 22px;
    background: var(--bg-primary);
    border-radius: 4px;
    overflow: hidden;
  }
  .tyme-bar-seg {
    position: absolute;
    height: 100%;
    border-radius: 3px;
    min-width: 3px;
    display: flex;
    align-items: center;
    padding: 0 3px;
    font-size: 8px;
    font-weight: 700;
    color: rgba(255,255,255,.9);
    letter-spacing: .3px;
    transition: opacity .15s, filter .15s;
    cursor: pointer;
  }
  .tyme-soft { background: #e10600; }
  .tyme-medium { background: #d97706; }
  .tyme-hard { background: #6b7280; }
  .tyme-inter { background: #2d7d46; }
  .tyme-wet { background: #1a5c7a; }
  .tyme-scale {
    display: flex;
    margin-left: 52px;
    height: 16px;
    position: relative;
  }
  .tyme-tick {
    position: absolute;
    font-size: 9px;
    color: var(--text-muted);
    transform: translateX(-50%);
  }
  .tyme-legend {
    display: flex;
    gap: 12px;
    margin: 8px 0 4px 52px;
    font-size: 10px;
    color: var(--text-secondary);
    flex-wrap: wrap;
  }
  .tyme-legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tyme-legend-dot {
    width: 10px; height: 10px; border-radius: 2px; display: inline-block;
  }
  .tyme-tooltip {
    position: fixed;
    background: #1e293b;
    color: #fff;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
    display: none;
  }
  .light .tyme-tooltip { background: #334155; }

  /* ── Mobile Responsive ── */
  @media (max-width: 640px) {
    .nav-link { padding: 5px 8px !important; font-size: 11px !important; }
    .card { padding: 12px !important; }
    table { font-size: 11px; }
    th, td { padding: 6px 6px !important; }
    .overflow-x-auto { -webkit-overflow-scrolling: touch; }
    h2 { font-size: 1.1rem !important; }
    h3 { font-size: 0.8rem !important; }
    .grid { gap: 0.5rem !important; }
    select, input, button { font-size: 12px !important; }
  }
</style>
</head>
<body>
  <div class="max-w-6xl mx-auto px-4 py-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-6 gap-3">
      <div>
        <h1 class="text-xl md:text-2xl font-bold"><span class="f1-red">F1</span> Analysis <span class="text-sm" style="color:var(--text-muted)">2026</span></h1>
        <p class="text-xs md:text-sm mt-1" style="color:var(--text-secondary)">Telemetry, sector times &amp; race data</p>
      </div>
      <div class="flex flex-wrap gap-1.5 items-center">
        <button onclick="loadRaces()" class="nav-link active" id="nav-races" style="padding:6px 10px;font-size:12px">🏁 Races</button>
        <button onclick="loadChampionship()" class="nav-link" id="nav-standings" style="padding:6px 10px;font-size:12px">🏆 Standings</button>
        <button onclick="showGuide()" class="nav-link" id="nav-guide" style="padding:6px 10px;font-size:12px">📖 Guide</button>
        <button onclick="showAbout()" class="nav-link" id="nav-about" style="padding:6px 10px;font-size:12px">ℹ️ About</button>
        <button onclick="toggleTheme()" class="theme-btn" id="theme-btn" title="Toggle theme" style="padding:4px 8px;font-size:14px">🌙</button>
      </div>
    </div>

    <!-- Main Content -->
    <div id="content">
      <div class="text-center py-20" style="color:var(--text-muted)">Loading 2026 race data...</div>
    </div>
  </div>

  <div class="tyme-tooltip" id="tyme-tooltip"></div>

  <script>
  // API URL — relative path (local dev via FastAPI)
  const API = '';
  let meetings = [];
  let currentView = 'races';

  // ── Theme Toggle ──
  function toggleTheme() {
    const html = document.documentElement;
    const isLight = html.classList.toggle('light');
    localStorage.setItem('f1-theme', isLight ? 'light' : 'dark');
    document.getElementById('theme-btn').textContent = isLight ? '☀️' : '🌙';
  }

  function initTheme() {
    const saved = localStorage.getItem('f1-theme');
    if (saved === 'light') {
      document.documentElement.classList.add('light');
      document.getElementById('theme-btn').textContent = '☀️';
    }
  }

  // ── Navigation ──
  document.querySelectorAll('.nav-link').forEach(el => {
    el.addEventListener('click', function() {
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      this.classList.add('active');
    });
  });

  // ── API Helpers ──
  async function api(path) {
    const res = await fetch(`${API}/api${path}`);
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function compoundBadge(c) {
    if (!c) return '';
    const map = { 'SOFT': 'badge-soft', 'MEDIUM': 'badge-medium', 'HARD': 'badge-hard', 'INTERMEDIATE': 'badge-inter', 'WET': 'badge-wet' };
    return `<span class="badge ${map[c] || 'badge-soft'}">${c}</span>`;
  }

  function formatTime(s) {
    if (!s || s <= 0) return '—';
    if (s > 60) {
      const m = Math.floor(s / 60);
      const sec = (s % 60).toFixed(3);
      return `${m}:${sec.padStart(6, '0')}`;
    }
    return s.toFixed(3) + 's';
  }

  function teamColor(colour) {
    if (!colour) return '#666';
    return '#' + colour;
  }

  // ── Team Logo & Badge ──
  const TEAM_LOGO_MAP = {
    'Alpine': 'alpine.svg',
    'Aston Martin': 'aston-martin.svg',
    'Audi': 'audi.svg',
    'Cadillac': 'cadillac.svg',
    'Ferrari': 'ferrari.svg',
    'Haas F1 Team': 'haas.svg',
    'McLaren': 'mclaren.svg',
    'Mercedes': 'mercedes.svg',
    'Racing Bulls': 'racing-bulls.svg',
    'Red Bull Racing': 'red-bull-racing.svg',
    'Williams': 'williams.svg',
  };

  function teamBadge(teamName, colour) {
    const c = teamColor(colour);
    if (teamName && TEAM_LOGO_MAP[teamName]) {
      return `<img class="team-logo" src="logos/${TEAM_LOGO_MAP[teamName]}" alt="${teamName}" title="${teamName}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block'" onload="this.style.display='inline-block';this.nextElementSibling.style.display='none'"><span class="team-badge" style="background:${c};color:#fff;border:1px solid rgba(255,255,255,0.1);display:none">${teamName.replace(/ F1 Team$/, '').replace(/ Team$/, '').substring(0, 12)}</span>`;
    }
    const acronym = (teamName || '').replace(/ F1 Team$/, '').replace(/ Team$/, '').substring(0, 12);
    return `<span class="team-badge" style="background:${c};color:#fff;border:1px solid rgba(255,255,255,0.1)">${acronym}</span>`;
  }

  // ── Tyre Strategy Timeline ──
  function renderTyreTimeline(stints, driverMap) {
    if (!stints || stints.length === 0) return '';

    const byDriver = {};
    let maxLap = 0;
    stints.forEach(s => {
      if (!byDriver[s.driver_number]) byDriver[s.driver_number] = [];
      byDriver[s.driver_number].push(s);
      if (s.lap_end > maxLap) maxLap = s.lap_end;
    });

    // Sort drivers by first stint lap_start
    const sorted = Object.entries(byDriver).sort((a, b) =>
      Math.min(...a[1].map(x => x.lap_start)) - Math.min(...b[1].map(x => x.lap_start))
    );

    let html = `<div class="overflow-x-auto pb-2">`;
    html += `<div style="min-width:500px">`;

    // Legend
    html += `<div class="tyme-legend">
      <span class="tyme-legend-item"><span class="tyme-legend-dot tyme-soft"></span>SOFT</span>
      <span class="tyme-legend-item"><span class="tyme-legend-dot tyme-medium"></span>MEDIUM</span>
      <span class="tyme-legend-item"><span class="tyme-legend-dot tyme-hard"></span>HARD</span>
      <span class="tyme-legend-item"><span class="tyme-legend-dot tyme-inter"></span>INTERMEDIATE</span>
      <span class="tyme-legend-item"><span class="tyme-legend-dot tyme-wet"></span>WET</span>
      <span style="color:var(--text-muted);margin-left:8px">${maxLap} laps · ${stints.length} stints</span>
    </div>`;

    // Lap scale header
    const tickStep = maxLap > 60 ? 10 : maxLap > 30 ? 5 : 2;
    html += `<div class="tyme-scale">`;
    for (let i = 1; i <= maxLap; i += tickStep) {
      html += `<div class="tyme-tick" style="left:${((i-1)/(maxLap-1))*100}%">${i}</div>`;
    }
    html += `</div>`;

    // Driver rows
    for (const [dn, sts] of sorted) {
      const drv = driverMap[parseInt(dn)];
      const label = drv ? drv.name_acronym : dn;
      const colour = drv ? teamColor(drv.team_colour) : '#666';

      html += `<div class="tyme-row">
        <div class="tyme-label" style="color:${colour}">${label}</div>
        <div class="tyme-track">`;

      for (const s of sts) {
        const pctStart = ((s.lap_start - 1) / Math.max(maxLap - 1, 1)) * 100;
        const pctWidth = Math.max(((s.lap_end - s.lap_start + 1) / Math.max(maxLap - 1, 1)) * 100, 1.5);
        const comp = (s.compound || 'SOFT').toLowerCase();
        const cls = comp === 'soft' ? 'tyme-soft' : comp === 'medium' ? 'tyme-medium' : comp === 'hard' ? 'tyme-hard' : comp === 'intermediate' ? 'tyme-inter' : 'tyme-wet';
        const showLabel = pctWidth > 7;
        const ageOpt = s.tyre_age_at_start > 0 ? ` (used ${s.tyre_age_at_start} laps)` : ' (fresh)';

        html += `<div class="tyme-bar-seg ${cls}"
          style="left:${pctStart}%;width:${pctWidth}%"
          onmouseenter="showTymeTip(event,'${s.compound || '?'} · L${s.lap_start}-${s.lap_end}${ageOpt}')"
          onmouseleave="hideTymeTip()">`;
        if (showLabel) html += s.compound;
        html += `</div>`;
      }

      html += `</div></div>`;
    }

    html += `</div></div>`;
    return html;
  }

  let tymeTipEl = null;
  function showTymeTip(e, text) {
    if (!tymeTipEl) tymeTipEl = document.getElementById('tyme-tooltip');
    tymeTipEl.textContent = text;
    tymeTipEl.style.display = 'block';
    tymeTipEl.style.left = (e.clientX + 12) + 'px';
    tymeTipEl.style.top = (e.clientY - 30) + 'px';
  }
  function hideTymeTip() {
    if (tymeTipEl) tymeTipEl.style.display = 'none';
  }

  // ── Weather Chart Helper ──
  let weatherChartInstances = {};
  function initWeatherChart(sessionId, weather) {
    setTimeout(() => {
      const canvas = document.getElementById(`weather-chart-${sessionId}`);
      if (!canvas) return;

      // Destroy previous chart for this session
      if (weatherChartInstances[sessionId]) {
        weatherChartInstances[sessionId].destroy();
      }

      // Sample weather data
      const sampleStep = Math.max(1, Math.floor(weather.length / 40));
      const labels = [];
      const airSeries = [];
      const trackSeries = [];
      for (let i = 0; i < weather.length; i += sampleStep) {
        const w = weather[i];
        labels.push(Math.floor(i * 70 / weather.length) + 1);
        airSeries.push(w.air_temp);
        trackSeries.push(w.track_temp);
      }

      const ctx = canvas.getContext('2d');
      const isLight = document.documentElement.classList.contains('light');
      const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
      const textColor = isLight ? '#64748b' : '#8b949e';
      weatherChartInstances[sessionId] = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'Air Temp °C', data: airSeries,
              borderColor: '#f59e0b', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: false },
            { label: 'Track Temp °C', data: trackSeries,
              borderColor: '#dc2626', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: false },
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          animation: { duration: 400 },
          plugins: {
            legend: { position: 'top', labels: { color: textColor, font: { size: 10 } } }
          },
          scales: {
            x: { title: { display: true, text: 'Approx. Lap', color: textColor, font: { size: 10 } },
              grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 } } },
            y: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 } } }
          }
        }
      });
    }, 100);
  }

  // ── Views ──
  function saveState(view, params) {
    localStorage.setItem('f1-view', view);
    if (params) localStorage.setItem('f1-state', JSON.stringify(params));
  }

  function clearState() {
    localStorage.removeItem('f1-view');
    localStorage.removeItem('f1-state');
  }

  async function loadRaces() {
    currentView = 'races';
    clearState();
    const el = document.getElementById('content');
    el.innerHTML = '<div class="text-center py-20" style="color:var(--text-muted)">Loading...</div>';
    try {
      meetings = await api('/meetings');
      renderRaceList();
    } catch(e) {
      el.innerHTML = `<div class="text-center py-20" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  function renderRaceList() {
    const el = document.getElementById('content');
    const completed = meetings.filter(m => m.name !== 'Pre-Season Testing');
    let html = `
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      ${completed.map(m => `
        <div class="card p-5 cursor-pointer hover:border-gray-500 transition" onclick="loadSessions(${m.id}, '${m.name.replace(/'/g, "\\'")}')">
          <div class="flex items-center gap-3 mb-3">
            <span class="text-2xl">🏎️</span>
            <div>
              <div class="font-semibold text-sm">${m.name}</div>
              <div class="text-xs" style="color:var(--text-secondary)">${m.location}, ${m.country_name}</div>
            </div>
          </div>
          <div class="flex justify-between text-xs" style="color:var(--text-secondary)">
            <span>🗓️ ${m.date_start ? m.date_start.slice(0,10) : 'TBD'}</span>
            <span>🏟️ ${m.circuit_name || '—'}</span>
          </div>
        </div>
      `).join('')}
      </div>
      <div class="mt-6 text-xs text-center" style="color:var(--text-muted)">${completed.length} race weekend(s)</div>
    `;
    el.innerHTML = html;
  }

  async function loadSessions(meetingId, meetingName) {
    saveState('sessions', { meetingId, meetingName });
    const el = document.getElementById('content');
    el.innerHTML = '<div class="text-center py-20" style="color:var(--text-muted)">Loading sessions...</div>';
    try {
      const sessions = await api(`/meetings/${meetingId}/sessions`);
      let html = `
        <div class="mb-6">
          <button onclick="loadRaces()" class="text-sm nav-link" style="display:inline">&larr; Back to races</button>
          <h2 class="text-xl font-bold mt-2">${meetingName}</h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      `;
      for (const s of sessions) {
        const icon = s.session_type === 'Race' ? '🏁' : s.session_type === 'Qualifying' ? '⏱️' : '🔧';
        html += `
          <div class="card p-5 cursor-pointer hover:border-gray-500 transition" onclick="loadSession(${s.id}, ${meetingId}, '${meetingName.replace(/'/g, "\\'")}', '${s.session_name.replace(/'/g, "\\'")}', '${s.session_type}')">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${icon}</span>
              <div>
                <div class="font-semibold text-sm">${s.session_name}</div>
                <div class="text-xs" style="color:var(--text-secondary)">${s.session_type}</div>
              </div>
            </div>
          </div>
        `;
      }
      html += `</div>`;
      el.innerHTML = html;
    } catch(e) {
      el.innerHTML = `<div class="text-center py-20" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  async function loadSession(sessionId, meetingId, meetingName, sessionName, sessionType) {
    saveState('session', { sessionId, meetingId, meetingName, sessionName, sessionType });
    const el = document.getElementById('content');
    el.innerHTML = '<div class="text-center py-20" style="color:var(--text-muted)">Loading session data...</div>';

    try {
      const [sectors, drivers, stints, pits, weather] = await Promise.all([
        api(`/sessions/${sessionId}/sectors`),
        api(`/sessions/${sessionId}/drivers`),
        api(`/sessions/${sessionId}/stints`),
        api(`/sessions/${sessionId}/pit-stops`),
        api(`/sessions/${sessionId}/weather`),
      ]);

      <!-- Overtake Analysis (Race/Sprint only) -->
      ${(sessionType === 'Race' || sessionName === 'Sprint' || sessionName === 'Race') ? `

              <div class="mt-2 text-xs">Shows overtakes gained/lost per lap by each driver. Positive = gained positions.</div>

      <!-- Tyre Degradation -->
      <div class="card p-5 mt-6">
        <div class="collapse-header flex items-center justify-between mb-4" onclick="toggleCollapse(this)">
          <h3 class="font-semibold text-sm">🛞 Tyre Degradation
            <span class="text-xs font-normal ml-2" style="color:var(--text-muted)">Lap time vs tyre age — compare two drivers</span>

          <span class="collapse-icon">▼</span>

        <div class="collapse-body closed">
          <div class="flex flex-wrap gap-3 items-center mb-3">
            <select id="deg-drv1">
              ${drivers.map(d => `<option value="${d.driver_number}"${d.driver_number === 1 ? ' selected' : ''}>${d.full_name} (${d.name_acronym})</option>`).join('')}
            </select>
            <span style="color:var(--text-secondary)">vs</span>
            <select id="deg-drv2">
              ${drivers.map(d => `<option value="${d.driver_number}"${d.driver_number === 16 ? ' selected' : ''}>${d.full_name} (${d.name_acronym})</option>`).join('')}
            </select>
            <button onclick="loadDegradation(${sessionId})" class="bg-f1-red text-white px-4 py-2 rounded text-sm font-medium hover:opacity-90 transition">Plot</button>
          </div>
          <div class="text-xs mb-3" style="color:var(--text-muted)">Lap time vs tyre age — solid line = Driver 1, dashed = Driver 2. Different colors show compounds.</div>

      el.innerHTML = html;
    } catch(e) {
      el.innerHTML = `<div class="text-center py-20" style="color:#dc2626">Error: ${e.message}</div>`;

  }

  let degChartInstance = null;
  let gapChartInstance = null;
  let posChartInstance = null;
  let qevoChartInstance = null;
  let lapdistChartInstance = null;
  let overtakeChartInstance = null;
  let pitStrategyChartInstance = null;

  // ── Tyre Degradation ──
  async function loadDegradation(sessionId) {
    const d1el = document.getElementById('deg-drv1');
    const d2el = document.getElementById('deg-drv2');
    const d1 = d1el.value;
    const d2 = d2el.value;
    if (d1 === d2) { return; }
    const d1name = d1el.options[d1el.selectedIndex].text.match(/\((\w+)\)/)?.[1] || d1;
    const d2name = d2el.options[d2el.selectedIndex].text.match(/\((\w+)\)/)?.[1] || d2;
    const el = document.getElementById('deg-chart-area');
    el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">Loading degradation data...</div>';

    if (degChartInstance) { degChartInstance.destroy(); degChartInstance = null; }

    try {
      const [laps1, laps2] = await Promise.all([
        api(`/sessions/${sessionId}/laps?driver=${d1}`),
        api(`/sessions/${sessionId}/laps?driver=${d2}`),
      ]);

      const filterValid = laps => laps.filter(l => l.lap_duration && l.lap_duration > 10 && l.lap_duration < 600 && l.tyre_age != null && l.compound);
      const f1 = filterValid(laps1);
      const f2 = filterValid(laps2);

      if (f1.length === 0 && f2.length === 0) {
        el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">No tyre degradation data available</div>';
        return;
      }

      const compoundLabels = { 'SOFT': 'Soft', 'MEDIUM': 'Medium', 'HARD': 'Hard', 'INTERMEDIATE': 'Intermediate', 'WET': 'Wet' };
      const lineDashMap = { 'SOFT': [], 'MEDIUM': [6, 4], 'HARD': [3, 6], 'INTERMEDIATE': [10, 4, 4, 4], 'WET': [4, 4, 8, 4] };

      // Driver 1 team color
      const d1color = f1.length > 0 && f1[0].team_colour ? `#${f1[0].team_colour.replace('#', '')}` : '#e10600';
      // Driver 2 team color
      const d2color = f2.length > 0 && f2[0].team_colour ? `#${f2[0].team_colour.replace('#', '')}` : '#16a34a';

      const datasets = [];

      // Adjust driver color: positive = darken, negative = lighten (mix with white for contrast)
      function driverColor(hex, adjust = 0) {
        const c = hex.replace('#', '');
        let r = parseInt(c.substring(0,2), 16);
        let g = parseInt(c.substring(2,4), 16);
        let b = parseInt(c.substring(4,6), 16);
        if (adjust < 0) {
          const pct = Math.min(1, -adjust);
          r = Math.round(r + (255 - r) * pct);
          g = Math.round(g + (255 - g) * pct);
          b = Math.round(b + (255 - b) * pct);
        } else {
          r = Math.round(r * (1 - Math.min(1, adjust)));
          g = Math.round(g * (1 - Math.min(1, adjust)));
          b = Math.round(b * (1 - Math.min(1, adjust)));
        }
        return `rgb(${r},${g},${b})`;
      }

      // Driver 1 — team color, bold circle points
      for (const compound of [...new Set(f1.map(l => l.compound))]) {
        const pts = f1.filter(l => l.compound === compound);
        datasets.push({
          label: `${d1name} ${compoundLabels[compound] || compound}`,
          data: pts.map(l => ({ x: l.tyre_age, y: l.lap_duration })),
          borderColor: d1color,
          backgroundColor: d1color,
          borderWidth: 2.5,
          borderDash: lineDashMap[compound] || [],
          pointRadius: 5,
          pointStyle: 'circle',
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          tension: 0.3,
        });
      }
      // Driver 2 — lightened team color (mix with white), diamond points
      const d2colorLight = driverColor(d2color, -0.35);
      for (const compound of [...new Set(f2.map(l => l.compound))]) {
        const pts = f2.filter(l => l.compound === compound);
        datasets.push({
          label: `${d2name} ${compoundLabels[compound] || compound}`,
          data: pts.map(l => ({ x: l.tyre_age, y: l.lap_duration })),
          borderColor: d2colorLight,
          backgroundColor: d2colorLight,
          borderWidth: 2,
          borderDash: lineDashMap[compound] || [],
          pointRadius: 6,
          pointStyle: 'triangle',
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          tension: 0.3,
        });
      }

      // Avg lap times
      const avg1 = (f1.reduce((s, l) => s + l.lap_duration, 0) / f1.length).toFixed(3);
      const avg2 = (f2.reduce((s, l) => s + l.lap_duration, 0) / f2.length).toFixed(3);
      // Get driver team colors
      const drv1Meta = f1.length > 0 ? (f1[0].team_colour ? `#${f1[0].team_colour.replace('#', '')}` : '#e10600') : '#e10600';
      const drv2Meta = f2.length > 0 ? (f2[0].team_colour ? `#${f2[0].team_colour.replace('#', '')}` : '#16a34a') : '#16a34a';

      el.innerHTML = `
        <div class="grid grid-cols-2 gap-3 mb-4 text-xs" style="color:var(--text-secondary)">
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:${drv1Meta}">${d1name}</div>
            <div>Avg: ${avg1}s · Laps: ${f1.length}</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:${drv2Meta}">${d2name}</div>
            <div>Avg: ${avg2}s · Laps: ${f2.length}</div>
          </div>
        </div>
        <div class="text-xs mb-2 flex flex-wrap gap-3 justify-center" style="color:var(--text-muted)">
          <span>● <strong style="color:${drv1Meta}">${d1name}</strong> (circle · full team color)</span>
          <span>▲ <strong style="color:${drv2Meta}">${d2name}</strong> (triangle · lightened 35%)</span>
          <span>— Solid = Soft · — — = Medium · · · = Hard</span>
        </div>
        <div class="relative" style="height:350px">
          <canvas id="deg-chart-canvas"></canvas>
        </div>
      `;

      setTimeout(() => {
        const canvas = document.getElementById('deg-chart-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const isLight = document.documentElement.classList.contains('light');
        const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
        const textColor = isLight ? '#64748b' : '#8b949e';

        degChartInstance = new Chart(ctx, {
          type: 'scatter',
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 400 },
            plugins: {
              legend: { position: 'top', labels: { color: textColor, font: { size: 10 } } },
              tooltip: {
                callbacks: {
                  label: (ctx) => {
                    const d = ctx.parsed;
                    return `${ctx.dataset.label}: L${ctx.rawDataIndex+1} · ${d.y.toFixed(3)}s (age: ${d.x})`;
                  }
                }
              }
            },
            scales: {
              x: {
                title: { display: true, text: 'Tyre Age (laps)', color: textColor, font: { size: 11 } },
                grid: { color: gridColor },
                ticks: { color: textColor, font: { size: 10 }, stepSize: 1 }
              },
              y: {
                title: { display: true, text: 'Lap Time (s)', color: textColor, font: { size: 11 } },
                grid: { color: gridColor },
                ticks: { color: textColor, font: { size: 10 } },
                reverse: true,
              }
            }
          }
        });
      }, 50);
    } catch(e) {
      el.innerHTML = `<div class="text-center py-8" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  let lapChartInstance = null;

  // ── Gap Timeline ──
  function gapSelectAll(sessionId) {
    document.querySelectorAll('.gap-cb').forEach(cb => cb.checked = true);
  }
  function gapDeselectAll() {
    document.querySelectorAll('.gap-cb').forEach(cb => cb.checked = false);
  }

  async function loadGaps(sessionId) {
    const el = document.getElementById('gap-chart-area');
    el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">Loading gap data...</div>';

    const refEl = document.getElementById('gap-ref');
    const refValue = refEl.value;
    const refParam = refValue ? `?reference=${refValue}` : '';

    if (gapChartInstance) { gapChartInstance.destroy(); gapChartInstance = null; }

    try {
      const data = await api(`/sessions/${sessionId}/gaps${refParam}`);
      const timeline = data.timeline;
      const leader = data.leader;
      const maxLap = data.max_lap || 0;

      if (!timeline || timeline.length === 0) {
        el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">No gap data available — try a Race session</div>';
        return;
      }

      // Which drivers are selected?
      const selected = [];
      document.querySelectorAll('.gap-cb:checked').forEach(cb => {
        selected.push(parseInt(cb.value));
      });

      // Get unique drivers in data
      const allDrivers = [...new Set(timeline.map(t => t.driver_number))];
      const showDrivers = selected.length > 0
        ? allDrivers.filter(dn => selected.includes(dn))
        : allDrivers;

      // Build per-driver series: { driver_number, acronym, color, team_name, laps: [{lap, gap}] }
      const seriesMap = {};
      for (const entry of timeline) {
        if (!showDrivers.includes(entry.driver_number)) continue;
        if (!seriesMap[entry.driver_number]) {
          seriesMap[entry.driver_number] = {
            acronym: entry.acronym,
            team_name: entry.team_name,
            team_colour: entry.team_colour,
            points: [],
          };
        }
        seriesMap[entry.driver_number].points.push({
          lap: entry.lap,
          gap: entry.gap_to_leader,
        });
      }

      // Colors for top 20 drivers
      const DRIVER_COLORS = [
        '#e10600', '#16a34a', '#3b82f6', '#f59e0b', '#8b5cf6',
        '#ec4899', '#14b8a6', '#f97316', '#06b6d4', '#84cc16',
        '#dc2626', '#6366f1', '#d946ef', '#22c55e', '#eab308',
        '#64748b', '#0ea5e9', '#a855f7', '#10b981', '#9ca3af',
      ];

      const labels = [];
      for (let i = 1; i <= maxLap; i++) labels.push(i);

      let colorIdx = 0;
      const datasets = [];
      const driverEntries = Object.entries(seriesMap).sort((a, b) => {
        // Sort by last gap (final position)
        const aLast = a[1].points[a[1].points.length - 1]?.gap || 0;
        const bLast = b[1].points[b[1].points.length - 1]?.gap || 0;
        return aLast - bLast;
      });

      for (const [dn, series] of driverEntries) {
        const color = series.team_colour
          ? `#${series.team_colour.replace('#', '')}`
          : DRIVER_COLORS[colorIdx % DRIVER_COLORS.length];
        colorIdx++;

        const data = [];
        const ptsByLap = {};
        for (const p of series.points) {
          ptsByLap[p.lap] = p.gap;
        }
        for (let i = 1; i <= maxLap; i++) {
          data.push(i in ptsByLap ? ptsByLap[i] : null);
        }

        datasets.push({
          label: series.acronym || `#${dn}`,
          data: data,
          borderColor: color,
          backgroundColor: color,
          borderWidth: 1.5,
          pointRadius: 0,
          pointHoverRadius: 4,
          tension: 0.1,
          spanGaps: false,
          fill: false,
        });
      }

      // Stats summary
      const finalGaps = driverEntries.map(([dn, s]) => {
        const lastPt = s.points[s.points.length - 1];
        return { dn, acronym: s.acronym, gap: lastPt?.gap || 0 };
      });
      const leaderAcronym = leader?.acronym || '—';
      const refLabel = refValue ? `(ref: #${refValue})` : '(auto leader)';

      el.innerHTML = `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-xs" style="color:var(--text-secondary)">
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">🏁 ${leaderAcronym}</div>
            <div>Race Leader ${refLabel}</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${maxLap}</div>
            <div>Total Laps</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${driverEntries.length}</div>
            <div>Drivers Shown</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${finalGaps.length > 1 ? (finalGaps[finalGaps.length-1].gap - finalGaps[1].gap).toFixed(1) + 's' : '—'}</div>
            <div>P1 → Last Gap</div>
          </div>
        </div>
        <div class="relative" style="height:350px">
          <canvas id="gap-chart-canvas"></canvas>
        </div>
        <div class="overflow-x-auto mt-4">
          <table>
            <thead>
              <tr><th>Pos</th><th>Driver</th><th>Team</th><th class="text-right">Final Gap</th><th class="text-right">Max Gap</th><th class="text-right">Avg Gap/Lap</th></tr>
            </thead>
            <tbody>
              ${driverEntries.map(([dn, s], i) => {
                const gaps = s.points.map(p => p.gap);
                const finalGap = gaps[gaps.length - 1] || 0;
                const maxGap = Math.max(...gaps);
                const avgGap = gaps.reduce((a, b) => a + b, 0) / gaps.length;
                const isLeader = finalGap === 0;
                return `
                  <tr>
                    <td style="color:var(--text-secondary)">${i + 1}</td>
                    <td class="font-medium">${s.acronym || `#${dn}`}</td>
                    <td>${s.team_name ? teamBadge(s.team_name, s.team_colour) : '—'}</td>
                    <td class="text-right font-mono ${isLeader ? 'font-bold' : ''}" style="${isLeader ? 'color:#16a34a' : ''}">${isLeader ? '0.000s (P1)' : '+' + finalGap.toFixed(3) + 's'}</td>
                    <td class="text-right font-mono" style="color:var(--text-secondary)">${maxGap > 0 ? '+' + maxGap.toFixed(1) + 's' : '—'}</td>
                    <td class="text-right font-mono" style="color:var(--text-secondary)">${avgGap > 0 ? '+' + avgGap.toFixed(2) + 's' : '0.00s'}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;

      // Render chart after DOM
      setTimeout(() => {
        const canvas = document.getElementById('gap-chart-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const isLight = document.documentElement.classList.contains('light');
        const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
        const textColor = isLight ? '#64748b' : '#8b949e';

        gapChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: datasets,
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 400 },
            interaction: {
              mode: 'index',
              intersect: false,
            },
            plugins: {
              legend: {
                position: 'top',
                labels: { color: textColor, font: { size: 10 }, boxWidth: 14, padding: 8 },
              },
              tooltip: {
                callbacks: {
                  title: (items) => `Lap ${items[0].label}`,
                  label: (ctx) => {
                    const val = ctx.parsed.y;
                    if (val === null) return null;
                    return `${ctx.dataset.label}: ${val > 0 ? '+' : ''}${val.toFixed(3)}s`;
                  },
                },
              },
            },
            scales: {
              x: {
                title: { display: true, text: 'Lap', color: textColor, font: { size: 11 } },
                grid: { color: gridColor },
                ticks: { color: textColor, font: { size: 10 } },
                min: 1,
              },
              y: {
                title: { display: true, text: 'Gap to Leader (s)', color: textColor, font: { size: 11 } },
                grid: { color: gridColor },
                ticks: { color: textColor, font: { size: 10 } },
                beginAtZero: true,
              },
            },
          },
        });
      }, 50);
    } catch(e) {
      el.innerHTML = `<div class="text-center py-8" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  // ── Qualifying Evolution (Q1→Q2→Q3) ──
  const qevoCache = {};

  async function loadQualifyingEvolution(meetingId) {
    const el = document.getElementById('qevo-chart-area');
    if (!el) return;

    // Check cache
    const cacheKey = `qevo_${meetingId}`;
    if (qevoCache[cacheKey]) {
      renderQualifyingData(qevoCache[cacheKey], meetingId);
      return;
    }

    el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">⏳ Loading qualifying data...</div>';

    if (qevoChartInstance) { qevoChartInstance.destroy(); qevoChartInstance = null; }

    try {
      const data = await api(`/analytics/qualifying-summary?meeting_id=${meetingId}`);
      if (!data || !data.drivers || !Array.isArray(data.drivers)) {
        el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">No qualifying data available</div>';
        return;
      }
      qevoCache[cacheKey] = data;
      renderQualifyingData(data, meetingId);
    } catch(e) {
      el.innerHTML = `<div class="text-center py-8" style="color:#dc2626">Error loading data: ${e.message}</div>`;
    }
  }

  function renderQualifyingData(data, meetingId) {
    const el = document.getElementById('qevo-chart-area');
    if (!el) return;

    const drivers = data.drivers || [];
    const segments = Array.isArray(data.segments) && data.segments.length > 0
      ? data.segments
      : ['Q1', 'Q2', 'Q3'];
    const sessionInfo = data.session;

    if (drivers.length === 0) {
      el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">No qualifying data available</div>';
      return;
    }

    let html = '';

    // ── Stat cards ──
    const fastest = drivers[0];
    const lastSeg = segments[segments.length - 1];
    const mostImproved = [...drivers]
      .filter(d => d.total_improvement !== null && d.total_improvement < 0)
      .sort((a, b) => a.total_improvement - b.total_improvement)[0];
    const driverCount = drivers.length;

    html += `
      <div class="text-xs mb-3" style="color:var(--text-muted)">
        <strong>${sessionInfo && sessionInfo.session_name ? sessionInfo.session_name + ' — ' : ''}</strong>
        ${segments.length > 1 ? 'Segments: ' + segments.join(' → ') : 'Single session'}
      </div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
        <div class="card p-3 text-center">
          <div class="text-xs" style="color:var(--text-muted)">⏱️ Pole</div>
          <div class="font-bold text-sm" style="color:${fastest && fastest.team_colour ? teamColor(fastest.team_colour) : '#888'}">${fastest ? fastest.acronym : '—'}</div>
          <div class="text-xs font-mono" style="color:var(--text-secondary)">${fastest && fastest.best_laps && fastest.best_laps[lastSeg] ? fastest.best_laps[lastSeg].toFixed(3) + 's' : '—'}</div>
        </div>
        <div class="card p-3 text-center">
          <div class="text-xs" style="color:var(--text-muted)">📈 Most Improved</div>
          <div class="font-bold text-sm" style="color:${mostImproved && mostImproved.team_colour ? teamColor(mostImproved.team_colour) : '#888'}">${mostImproved ? mostImproved.acronym : '—'}</div>
          <div class="text-xs font-mono" style="color:#16a34a">${mostImproved && mostImproved.total_improvement !== null ? mostImproved.total_improvement.toFixed(3) + 's' : '—'}</div>
        </div>
        <div class="card p-3 text-center">
          <div class="text-xs" style="color:var(--text-muted)">🏎️ Drivers</div>
          <div class="font-bold text-lg">${driverCount}</div>
        </div>
        <div class="card p-3 text-center">
          <div class="text-xs" style="color:var(--text-muted)">🏁 Q3</div>
          <div class="font-bold text-lg" style="color:#f59e0b">${data.q3_drivers != null ? data.q3_drivers : '—'}</div>
        </div>
      </div>`;

    // ── Grouped Bar Chart (only if multiple segments) ──
    if (drivers.length >= 2 && segments.length >= 2) {
      html += `<div class="relative" style="height:400px;margin-bottom:16px">
        <canvas id="qevo-chart-canvas-${meetingId}"></canvas>
      </div>`;
    } else if (segments.length === 1) {
      html += `<div class="text-xs mb-4" style="color:var(--text-muted)">
        ℹ️ Only 1 qualifying session found — showing best lap ranking.
      </div>`;
    }

    // ── Progression Table ──
    html += `
      <div class="overflow-x-auto">
        <table>
          <thead>
            <tr>
              <th>Pos</th><th>Driver</th><th>Team</th>`;
    for (const seg of segments) {
      html += `<th class="text-right font-mono">${seg}</th>`;
    }
    html += `<th class="text-right">Last→First Δ</th>
              <th class="text-right">Segments</th>
            </tr>
          </thead>
          <tbody>
    `;

    for (let i = 0; i < drivers.length; i++) {
      const d = drivers[i];
      const teamC = d.team_colour ? teamColor(d.team_colour) : '#666';
      html += `<tr>
        <td style="color:var(--text-secondary)">${i + 1}</td>
        <td class="font-medium" style="color:${teamC}">${d.acronym}</td>
        <td>${teamBadge(d.team_name, d.team_colour)}</td>`;

      for (const seg of segments) {
        const lap = d.best_laps ? d.best_laps[seg] : undefined;
        const isPole = i === 0 && seg === lastSeg && lap !== undefined;
        html += `<td class="text-right font-mono" style="${isPole ? 'font-weight:700' : ''}">${lap != null ? lap.toFixed(3) + 's' : '<span style="color:var(--text-muted)">—</span>'}</td>`;
      }

      // Delta column
      if (d.total_improvement !== null && d.total_improvement !== undefined) {
        const isImprovement = d.total_improvement < 0;
        html += `<td class="text-right font-mono" style="${isImprovement ? 'color:#16a34a;font-weight:600' : d.total_improvement > 0 ? 'color:#dc2626' : 'color:var(--text-secondary)'}">${isImprovement ? '' : '+'}${d.total_improvement.toFixed(3)}s</td>`;
      } else {
        html += `<td class="text-right" style="color:var(--text-muted)">—</td>`;
      }

      html += `<td class="text-right" style="color:var(--text-secondary)">${d.segments_completed != null ? d.segments_completed + '/' + segments.length : '—'}</td>`;
      html += `</tr>`;
    }

    html += `</tbody></table></div>`;

    // ── Legend ──
    html += `<div class="text-xs mt-3" style="color:var(--text-muted)">
      <span style="color:#16a34a">🟢 Improvement</span> ·
      <span style="color:#dc2626">🔴 Slower</span> ·
      <span>— Eliminated (no further session)</span>
    </div>`;

    el.innerHTML = html;

    // ── Chart init (line chart — shows progression direction) ──
    if (drivers.length >= 2 && segments.length >= 2) {
      setTimeout(() => {
        try {
          const canvas = document.getElementById(`qevo-chart-canvas-${meetingId}`);
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          const isLight = document.documentElement.classList.contains('light');
          const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
          const textColor = isLight ? '#64748b' : '#8b949e';

          // Show top 12 drivers for readability
          const chartDrivers = drivers.slice(0, 12);
          const DRV_COLORS = ['#e10600','#16a34a','#3b82f6','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316','#06b6d4','#84cc16','#e11d48','#a855f7'];

          const datasets = [];
          chartDrivers.forEach((d, idx) => {
            const color = d.team_colour ? teamColor(d.team_colour) : DRV_COLORS[idx % DRV_COLORS.length];
            const data = segments.map(seg => {
              const lap = d.best_laps && d.best_laps[seg];
              return lap != null ? +lap.toFixed(3) : null;
            });
            datasets.push({
              label: d.acronym,
              data: data,
              borderColor: color,
              backgroundColor: color,
              borderWidth: idx < 5 ? 2.5 : 1.5,
              pointRadius: idx < 5 ? 5 : 3,
              pointHoverRadius: 7,
              pointBackgroundColor: color,
              pointBorderColor: isLight ? '#fff' : '#111',
              pointBorderWidth: 1.5,
              tension: 0.1,
              spanGaps: false,
              fill: false,
            });
          });

          qevoChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
              labels: segments,
              datasets: datasets,
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animation: { duration: 300 },
              interaction: { mode: 'nearest', intersect: false },
              plugins: {
                title: {
                  display: true,
                  text: 'Best Lap Progression — Top 12 (lines going ↓ = improvement)',
                  color: textColor,
                  font: { size: 11 },
                  padding: { bottom: 8 },
                },
                legend: {
                  position: 'top',
                  labels: { color: textColor, font: { size: 9 }, boxWidth: 14, padding: 6, usePointStyle: true, pointStyle: 'circle' },
                },
                tooltip: {
                  callbacks: {
                    title: (items) => items[0].label,
                    label: (ctx) => {
                      if (ctx.parsed.y === null) return `${ctx.dataset.label}: —`;
                      return `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(3)}s`;
                    },
                  },
                },
              },
              scales: {
                x: {
                  title: { display: true, text: 'Qualifying Segment', color: textColor, font: { size: 11 } },
                  grid: { color: gridColor },
                  ticks: { color: textColor, font: { size: 10, weight: 'bold' } },
                },
                y: {
                  title: { display: true, text: 'Best Lap (s)', color: textColor, font: { size: 11 } },
                  grid: { color: gridColor },
                  ticks: {
                    color: textColor,
                    font: { size: 10 },
                    callback: (val) => val.toFixed(3),
                  },
                  reverse: true,
                },
              },
            },
          });
        } catch(e) {
          console.warn('Qualifying chart error:', e);
        }
      }, 50);
    }
  }

  // ── Pit Strategy ──
  async function loadPitStrategy(sessionId) {
    const el = document.getElementById('pitstrategy-chart-area');
    el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">Loading pit strategy data...</div>';

    if (pitStrategyChartInstance) { pitStrategyChartInstance.destroy(); pitStrategyChartInstance = null; }

    try {
      const data = await api(`/analytics/sessions/${sessionId}/pit-strategy`);
      const drivers = data.drivers;

      if (!drivers || drivers.length === 0) {
        el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">No pit strategy data available</div>';
        return;
      }

      // Find fastest pit stop + slowest
      let fastestPit = 999, slowestPit = 0;
      let fastestD = '', slowestD = '', fastestL = 0, slowestL = 0;
      for (const d of drivers) {
        for (const p of d.pit_analysis) {
          if (p.pit_duration && p.pit_duration < fastestPit) {
            fastestPit = p.pit_duration;
            fastestD = d.acronym;
            fastestL = p.lap_number;
          }
          if (p.pit_duration && p.pit_duration > slowestPit && p.pit_duration < 200) {
            slowestPit = p.pit_duration;
            slowestD = d.acronym;
            slowestL = p.lap_number;
          }
        }
      }

      // Stats
      let html = `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-xs" style="color:var(--text-secondary)">
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${data.total_stops}</div>
            <div>Total Pit Stops</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${drivers.length}</div>
            <div>Drivers with Stops</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:#16a34a">${fastestPit.toFixed(1)}s</div>
            <div>Fastest Stop (${fastestD} L${fastestL})</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:#dc2626">${slowestPit.toFixed(1)}s</div>
            <div>Slowest Stop (${slowestD} L${slowestL})</div>
          </div>
        </div>
      `;

      // Pit stop timing chart
      html += `
        <div class="text-xs mb-3" style="color:var(--text-muted)">
          <strong>Pit Stop Duration Distribution</strong> — each dot = one stop. Green = fast (&lt;23s), Red = slow (&gt;30s).
        </div>
        <div class="relative" style="height:250px;margin-bottom:16px">
          <canvas id="pitstrategy-chart-canvas-${sessionId}"></canvas>
        </div>
      `;

      // Pit stops detail table
      html += `
        <div class="overflow-x-auto mb-4" style="max-height:500px;overflow-y:auto">
          <table>
            <thead>
              <tr>
                <th>Driver</th><th>Lap</th>
                <th class="text-right">Pit Time</th>
                <th class="text-right">In-Lap</th>
                <th class="text-right">Out-Lap</th>
                <th class="text-right">Avg Before</th>
                <th class="text-right">Avg After</th>
                <th class="text-right">Δ (After-Before)</th>
                <th class="text-right">Pit Loss</th>
              </tr>
            </thead>
            <tbody>
      `;

      // Sort drivers: those with best avg improvement first
      const allStops = [];
      for (const d of drivers) {
        for (const p of d.pit_analysis) {
          const delta = (p.avg_after && p.avg_before) ? (p.avg_after - p.avg_before) : null;
          allStops.push({ ...p, acronym: d.acronym, team_colour: d.team_colour, delta });
        }
      }
      allStops.sort((a, b) => (b.pit_duration || 99) - (a.pit_duration || 99));

      for (const stop of allStops) {
        const color = stop.team_colour ? teamColor(stop.team_colour) : '#666';
        const isFast = stop.pit_duration && stop.pit_duration < 23;
        const isSlow = stop.pit_duration && stop.pit_duration > 30;
        const delta = stop.delta;
        const deltaColor = delta !== null ? (delta < -0.5 ? '#16a34a' : delta > 0.5 ? '#dc2626' : 'var(--text-secondary)') : '';
        const deltaIcon = delta !== null ? (delta < -0.5 ? ' 🟢' : delta > 0.5 ? ' 🔴' : '') : '';
        html += `
          <tr>
            <td class="font-medium" style="color:${color}">${stop.acronym}</td>
            <td style="color:var(--text-secondary)">L${stop.lap_number}</td>
            <td class="text-right font-mono ${isFast ? 'font-bold' : ''}" style="${isFast ? 'color:#16a34a' : isSlow ? 'color:#dc2626' : ''}">${stop.pit_duration ? stop.pit_duration.toFixed(1) + 's' : '—'}</td>
            <td class="text-right font-mono" style="color:var(--text-secondary)">${stop.in_lap_time ? stop.in_lap_time.toFixed(3) + 's' : '—'}</td>
            <td class="text-right font-mono" style="color:var(--text-secondary)">${stop.out_lap_time ? stop.out_lap_time.toFixed(3) + 's' : '—'}</td>
            <td class="text-right font-mono" style="color:var(--text-secondary)">${stop.avg_before ? stop.avg_before.toFixed(3) + 's' : '—'}</td>
            <td class="text-right font-mono" style="color:var(--text-secondary)">${stop.avg_after ? stop.avg_after.toFixed(3) + 's' : '—'}</td>
            <td class="text-right font-mono" style="color:${deltaColor};font-weight:${delta !== null && Math.abs(delta) > 0.5 ? '700' : '400'}">${delta !== null ? (delta > 0 ? '+' : '') + delta.toFixed(3) + 's' + deltaIcon : '—'}</td>
            <td class="text-right font-mono" style="color:${stop.pit_duration && stop.pit_duration > 25 ? '#dc2626' : '#16a34a'}">${stop.pit_duration ? stop.pit_duration.toFixed(1) + 's' : '—'}</td>
          </tr>
        `;
      }
      html += `</tbody></table></div>`;

      el.innerHTML = html;

      // Render chart
      setTimeout(() => {
        const canvas = document.getElementById(`pitstrategy-chart-canvas-${sessionId}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const isLight = document.documentElement.classList.contains('light');
        const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
        const textColor = isLight ? '#64748b' : '#8b949e';

        // Group by lap number for bar chart
        const stopsByLap = {};
        for (const stop of allStops) {
          const ln = stop.lap_number;
          if (!stopsByLap[ln]) stopsByLap[ln] = [];
          stopsByLap[ln].push(stop);
        }

        const labels = Object.keys(stopsByLap).map(Number).sort((a, b) => a - b);
        const fastCounts = [];
        const midCounts = [];
        const slowCounts = [];

        for (const ln of labels) {
          const stops = stopsByLap[ln];
          fastCounts.push(stops.filter(s => s.pit_duration < 23).length);
          midCounts.push(stops.filter(s => s.pit_duration >= 23 && s.pit_duration <= 30).length);
          slowCounts.push(stops.filter(s => s.pit_duration > 30 && s.pit_duration < 200).length);
        }

        pitStrategyChartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: 'Fast (<23s)', data: fastCounts, backgroundColor: 'rgba(22,163,74,0.7)', borderColor: '#16a34a', borderWidth: 1, borderRadius: 2 },
              { label: 'Normal (23-30s)', data: midCounts, backgroundColor: 'rgba(245,158,11,0.7)', borderColor: '#f59e0b', borderWidth: 1, borderRadius: 2 },
              { label: 'Slow (>30s)', data: slowCounts, backgroundColor: 'rgba(220,38,38,0.7)', borderColor: '#dc2626', borderWidth: 1, borderRadius: 2 },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 300 },
            plugins: {
              legend: { position: 'top', labels: { color: textColor, font: { size: 9 }, boxWidth: 12, padding: 6 } },
              tooltip: {
                callbacks: {
                  title: (items) => `Lap ${items[0].label}`,
                  label: (ctx) => {
                    const val = ctx.parsed.y;
                    return `${ctx.dataset.label}: ${val} stop${val !== 1 ? 's' : ''}`;
                  },
                },
              },
            },
            scales: {
              x: { title: { display: true, text: 'Lap', color: textColor, font: { size: 11 } }, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 } } },
              y: { title: { display: true, text: 'Number of Stops', color: textColor, font: { size: 11 } }, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 }, stepSize: 1 }, beginAtZero: true },
            },
          },
        });
      }, 100);
    } catch(e) {
      el.innerHTML = `<div class="text-center py-8" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  // ── Overtake Analysis ──
  async function loadOvertakeAnalysis(sessionId) {
    const el = document.getElementById('overtake-chart-area');
    el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">Loading overtake data...</div>';

    if (overtakeChartInstance) { overtakeChartInstance.destroy(); overtakeChartInstance = null; }

    try {
      const data = await api(`/sessions/${sessionId}/positions`);
      const timeline = data.timeline;
      const maxLap = data.max_lap;

      if (!timeline || timeline.length === 0) {
        el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">No overtake data available</div>';
        return;
      }

      // Group by driver, track position changes
      const byDriver = {};
      const driverMeta = {};
      for (const entry of timeline) {
        const dn = entry.driver_number;
        if (!byDriver[dn]) {
          byDriver[dn] = [];
          driverMeta[dn] = { acronym: entry.acronym, team_colour: entry.team_colour };
        }
        byDriver[dn].push(entry);
      }

      // For each driver, compute net position change per lap
      const labels = Array.from({ length: maxLap }, (_, i) => i + 1);
      const driverChanges = {};
      const totalOvertakes = {};

      for (const [dn, entries] of Object.entries(byDriver)) {
        const sorted = entries.sort((a, b) => a.lap - b.lap);
        const changes = [];
        let prevPos = null;
        let totalGained = 0;
        let totalLost = 0;
        for (let lap = 1; lap <= maxLap; lap++) {
          const entry = sorted.find(e => e.lap === lap);
          if (entry && entry.position) {
            if (prevPos !== null && entry.position !== prevPos) {
              changes.push(prevPos - entry.position); // positive = gained positions
              if (entry.position < prevPos) totalGained += (prevPos - entry.position);
              else totalLost += (entry.position - prevPos);
            } else {
              changes.push(0);
            }
            prevPos = entry.position;
          } else {
            changes.push(null);
          }
        }
        driverChanges[dn] = changes;
        totalOvertakes[dn] = { gained: totalGained, lost: totalLost, net: totalGained - totalLost };
      }

      // Sort by net overtakes
      const sortedDrivers = Object.entries(totalOvertakes)
        .sort((a, b) => b[1].net - a[1].net);

      // Summary stats
      const totalGainedAll = Object.values(totalOvertakes).reduce((s, o) => s + o.gained, 0);
      const totalLostAll = Object.values(totalOvertakes).reduce((s, o) => s + o.lost, 0);
      const mostOvertakes = sortedDrivers[0];

      // Top overtakers table
      let html = `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-xs" style="color:var(--text-secondary)">
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${totalGainedAll}</div>
            <div>Total Positions Gained</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${totalLostAll}</div>
            <div>Total Positions Lost</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:#16a34a">+${mostOvertakes ? mostOvertakes[1].net : 0}</div>
            <div>Best Net (${mostOvertakes ? (driverMeta[mostOvertakes[0]]?.acronym || mostOvertakes[0]) : '—'})</div>
          </div>
          <div class="card p-3 text-center">
            <div class="font-bold" style="color:var(--text-primary)">${Object.keys(byDriver).length}</div>
            <div>Drivers</div>
          </div>
        </div>
      `;

      // Chart: per-lap overtakes (bar chart: green=gained, red=lost)
      html += `
        <div class="text-xs mb-3" style="color:var(--text-muted)">
          <strong>Overtakes Per Lap</strong> — 🟢 Green bars = positions gained, 🔴 Red = positions lost. Hover for details.
        </div>
        <div class="relative" style="height:300px;margin-bottom:16px">
          <canvas id="overtake-chart-canvas-${sessionId}"></canvas>
        </div>
      `;

      // Top overtakers table
      html += `
        <div class="overflow-x-auto mb-4">
          <table>
            <thead>
              <tr><th>#</th><th>Driver</th><th class="text-right">Gained</th><th class="text-right">Lost</th><th class="text-right">Net</th></tr>
            </thead>
            <tbody>
      `;
      sortedDrivers.forEach(([dn, stats], i) => {
        const meta = driverMeta[dn] || {};
        const color = meta.team_colour ? teamColor(meta.team_colour) : '#666';
        const netClass = stats.net > 0 ? 'color:#16a34a;font-weight:700' : stats.net < 0 ? 'color:#dc2626' : '';
        html += `
          <tr>
            <td style="color:var(--text-secondary)">${i + 1}</td>
            <td class="font-medium" style="color:${color}">${meta.acronym || `#${dn}`}</td>
            <td class="text-right font-mono" style="color:#16a34a">+${stats.gained}</td>
            <td class="text-right font-mono" style="color:#dc2626">-${stats.lost}</td>
            <td class="text-right font-mono font-bold" style="${netClass}">${stats.net > 0 ? '+' : ''}${stats.net}</td>
          </tr>
        `;
      });
      html += `</tbody></table></div>`;

      el.innerHTML = html;

      // Render chart
      setTimeout(() => {
        const canvas = document.getElementById(`overtake-chart-canvas-${sessionId}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const isLight = document.documentElement.classList.contains('light');
        const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
        const textColor = isLight ? '#64748b' : '#8b949e';

        // Top 5 most active drivers for chart
        const chartDrivers = sortedDrivers.slice(0, 5);
        const datasets = [];

        chartDrivers.forEach(([dn], idx) => {
          const meta = driverMeta[dn] || {};
          const color = meta.team_colour ? teamColor(meta.team_colour) : ['#e10600','#16a34a','#3b82f6','#f59e0b','#8b5cf6'][idx];
          const changes = driverChanges[dn];
          const gainedData = changes.map(c => c !== null && c > 0 ? c : null);
          const lostData = changes.map(c => c !== null && c < 0 ? Math.abs(c) : null);

          // Gained (green segment)
          datasets.push({
            label: `${meta.acronym || dn} Gained`,
            data: gainedData,
            backgroundColor: 'rgba(22,163,74,0.6)',
            borderColor: '#16a34a',
            borderWidth: 1,
            borderRadius: 2,
            barPercentage: 0.6,
            order: 1,
          });
          // Lost (red segment, negative)
          datasets.push({
            label: `${meta.acronym || dn} Lost`,
            data: lostData,
            backgroundColor: 'rgba(220,38,38,0.6)',
            borderColor: '#dc2626',
            borderWidth: 1,
            borderRadius: 2,

            order: 2,

        overtakeChartInstance = new Chart(ctx, {
          type: 'bar',
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 300 },
            interaction: { mode: 'item', intersect: true },
            plugins: {
              legend: {
                position: 'top',
                labels: { color: textColor, font: { size: 9 }, boxWidth: 12, padding: 6 },
              },
              tooltip: {
                callbacks: {

                  label: (ctx) => {
                    const val = ctx.parsed.y;
                    if (val === null) return null;
                    const label = ctx.dataset.label.replace(' Gained',' 🟢').replace(' Lost',' 🔴');
                    return `${label}: ${val} position${val > 1 ? 's' : ''}`;
                  },
                },
              },
            },
            scales: {
              x: {
                title: { display: true, text: 'Lap', color: textColor, font: { size: 11 } },

                title: { display: true, text: 'Positions Changed', color: textColor, font: { size: 11 } },

        });
      }, 100);
    } catch(e) {

  // ── Position History ──
  let posChartData = null; // { lapPositions, driverMap, allDrivers, maxLap, allLaps, timeline }

  async function loadPositionHistory(sessionId) {
    const el = document.getElementById('pos-chart-area');
    el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">Loading position data...</div>';

    if (posChartInstance) { posChartInstance.destroy(); posChartInstance = null; }

    try {
      const data = await api(`/sessions/${sessionId}/positions`);
      const timeline = data.timeline;
      const maxLap = data.max_lap;

      if (!timeline || timeline.length === 0) {
        el.innerHTML = '<div class="text-center py-8" style="color:var(--text-muted)">No position data available</div>';
        return;
      }

      // Group by lap + driver map
      const lapPositions = {};
      const driverMap = {};
      for (const entry of timeline) {
        if (!lapPositions[entry.lap]) lapPositions[entry.lap] = [];
        lapPositions[entry.lap].push(entry);
        driverMap[entry.driver_number] = {
          acronym: entry.acronym,
          full_name: entry.full_name,
          team_name: entry.team_name,
          team_colour: entry.team_colour,
        };
      }

      const allDrivers = Object.keys(driverMap).map(Number);
      const allLaps = Object.keys(lapPositions).map(Number).sort((a, b) => a - b);

      // Store data globally for chart re-render
      posChartData = { lapPositions, driverMap, allDrivers, maxLap, allLaps, timeline };

      // Driver picker + chart canvas rendered once
      let html = `
        <div class="flex flex-wrap gap-3 items-center mb-3">
          <button onclick="posSelectAll()" class="text-xs px-3 py-1.5 rounded" style="background:var(--badge-soft);color:var(--badge-soft-text);border:1px solid var(--border-color);cursor:pointer">✅ Select All</button>
          <button onclick="posDeselectAll()" class="text-xs px-3 py-1.5 rounded" style="background:var(--badge-soft);color:var(--badge-soft-text);border:1px solid var(--border-color);cursor:pointer">⬜ Clear</button>
          <span style="color:var(--text-secondary);font-size:11px">Show drivers:</span>
        </div>
        <div class="flex flex-wrap gap-2 mb-3" id="pos-drivers">
          ${allDrivers.sort((a, b) => {
            const aLast = lapPositions[allLaps[allLaps.length - 1]]?.find(e => e.driver_number === a);
            const bLast = lapPositions[allLaps[allLaps.length - 1]]?.find(e => e.driver_number === b);
            return (aLast?.position || 99) - (bLast?.position || 99);
          }).map(dn => {
            const info = driverMap[dn];
            const colour = info.team_colour ? teamColor(info.team_colour) : '#666';
            return `<label class="flex items-center gap-1.5 text-xs cursor-pointer" style="color:var(--text-primary)">
              <input type="checkbox" class="pos-cb" value="${dn}" data-acronym="${info.acronym}" checked>
              <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colour}"></span>
              ${info.acronym}
            </label>`;
          }).join('')}
        </div>
        <div class="text-xs mb-2" style="color:var(--text-muted);text-align:center">
          <strong>P1 on top</strong> — check/uncheck drivers to focus. Toggle checkboxes then click <strong>Plot Chart</strong>.
        </div>
        <div class="flex items-center gap-3 mb-3">
          <button onclick="renderPosChart()" class="bg-f1-red text-white px-4 py-2 rounded text-sm font-medium hover:opacity-90 transition">📈 Plot Chart</button>
          <span class="text-xs" style="color:var(--text-muted)">Click to update chart after toggling drivers</span>
        </div>
        <div class="relative" style="height:450px">
          <canvas id="pos-chart-canvas"></canvas>
        </div>
      `;

      el.innerHTML = html;

      // Initial render
      renderPosChart();
    } catch(e) {
      el.innerHTML = `<div class="text-center py-8" style="color:#dc2626">Error: ${e.message}</div>`;
    }

  function renderPosChart() {
    if (!posChartData) return;
    if (posChartInstance) { posChartInstance.destroy(); posChartInstance = null; }

    const { lapPositions, driverMap, allDrivers, maxLap, allLaps, timeline } = posChartData;
    const labels = [];
    for (let i = 1; i <= maxLap; i++) labels.push(i);

    const DRIVER_COLORS = ['#e10600','#16a34a','#3b82f6','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316','#06b6d4','#84cc16','#dc2626','#6366f1','#d946ef','#22c55e','#eab308','#64748b','#0ea5e9','#a855f7','#10b981','#9ca3af'];

    // Read checked state directly from DOM
    const selected = [];
    document.querySelectorAll('.pos-cb:checked').forEach(cb => selected.push(parseInt(cb.value)));
    const showDrivers = selected.length > 0 ? allDrivers.filter(dn => selected.includes(dn)) : allDrivers;
    const sortedShown = [...showDrivers].sort((a, b) => {
      const aLast = lapPositions[allLaps[allLaps.length - 1]]?.find(e => e.driver_number === a);
      const bLast = lapPositions[allLaps[allLaps.length - 1]]?.find(e => e.driver_number === b);
      return (aLast?.position || 99) - (bLast?.position || 99);
    });

    let colorIdx = 0;
    const datasets = [];
    for (const dn of sortedShown) {
      const info = driverMap[dn];
      const color = info.team_colour ? `#${info.team_colour.replace('#', '')}` : DRIVER_COLORS[colorIdx % DRIVER_COLORS.length];
      colorIdx++;
      const data = [];
      for (let i = 1; i <= maxLap; i++) {
        const entry = lapPositions[i]?.find(e => e.driver_number === dn);
        data.push(entry?.position || null);
      }
      datasets.push({ label: info.acronym || `#${dn}`, data, borderColor: color, backgroundColor: color, borderWidth: 2, pointRadius: 1.5, pointHoverRadius: 5, tension: 0, spanGaps: true, fill: false, stepped: 'before' });
    }

    setTimeout(() => {
      const canvas = document.getElementById('pos-chart-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const isLight = document.documentElement.classList.contains('light');
      const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
      const textColor = isLight ? '#64748b' : '#8b949e';
      const maxPos = Math.max(...timeline.map(e => e.position));

      posChartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false, animation: { duration: 300 },
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'bottom', labels: { color: textColor, font: { size: 9 }, boxWidth: 12, padding: 6, usePointStyle: true, pointStyle: 'line' } },
            tooltip: { callbacks: { title: (items) => `Lap ${items[0].label}`, label: (ctx) => { const v = ctx.parsed.y; return v ? `${ctx.dataset.label}: P${v}${v === 1 ? ' 🏆' : ''}` : null; } } },
          },
          scales: {
            x: { title: { display: true, text: 'Lap', color: textColor, font: { size: 11 } }, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10 } }, min: 1 },
            y: { title: { display: true, text: 'Race Position', color: textColor, font: { size: 11 } }, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10 }, stepSize: 1, callback: (v) => `P${v}` }, min: 1, max: maxPos + 0.5, reverse: true },
          },
          elements: { line: { stepped: 'before' } },
        },
      });
    }, 50);
  }

  function posSelectAll() {
    document.querySelectorAll('.pos-cb').forEach(cb => cb.checked = true);
  }
  function posDeselectAll() {
    document.querySelectorAll('.pos-cb').forEach(cb => cb.checked = false);
  }

                title: { display: true, text: 'Lap', color: textColor, font: { size: 11 } },

                ticks: { color: textColor, font: { size: 10 } }
              },
              y: {
                title: { display: true, text: 'Lap Time (s)', color: textColor, font: { size: 11 } },
                grid: { color: gridColor },
                ticks: { color: textColor, font: { size: 10 } },
                reverse: true,
              }
            }
          }
        });
      }, 50);
    } catch(e) {
      el.innerHTML = `<div class="text-center py-8" style="color:#dc2626">Error: ${e.message}</div>`;
    }
  }

  // ── Collapse Toggle ──

    const body = header.nextElementSibling;
    const icon = header.querySelector('.collapse-icon');
    if (body) body.classList.toggle('closed');
    if (icon) icon.classList.toggle('open');
  }
