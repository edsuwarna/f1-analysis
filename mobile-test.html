<!DOCTYPE html>
<html><head><meta name="viewport" content="width=360"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #0f1115; color: #e1e1e6; padding: 12px; }
  .card { background: #1a1d24; border: 1px solid #2d3139; border-radius: 10px; padding: 20px; margin-bottom: 24px; }

  .collapse-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; }
  .collapse-header:hover { opacity: .8; }
  .collapse-icon { font-size: 12px; color: #8b949e; flex-shrink: 0; }
  .flex { display: flex; } .items-center { align-items: center; } .gap-2 { gap: 8px; }
  .flex-wrap { flex-wrap: wrap; } .flex-shrink-0 { flex-shrink: 0; }
  .min-w-0 { min-width: 0; }
  .whitespace-nowrap { white-space: nowrap; }
  .text-sm { font-size: 14px; } .text-xs { font-size: 12px; }
  .font-semibold { font-weight: 600; } .font-normal { font-weight: 400; }

  .overflow-x-auto { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .standings-table { width: 100%; border-collapse: collapse; }
  .standings-table th {
    font-size: 10px; font-weight: 700; color: #8b949e; text-transform: uppercase;
    letter-spacing: 0.5px; white-space: nowrap;
    border-bottom: 1px solid #2d3139; padding: 10px 6px; text-align: left;
  }
  .standings-table td { padding: 6px; vertical-align: middle; border-bottom: 1px solid #1f2329; font-size: 13px; }
  .standings-table .col-pos { width: 6%; }
  .standings-table .col-driver { width: 14%; }
  .standings-table .col-country { width: 12%; min-width: 56px; text-align: center; }
  .standings-table .col-team { width: 18%; }
  .standings-table .col-progress { width: 50%; }
  .flag-text { font-size: 11px; font-weight: 600; letter-spacing: 0.3px; display: inline-flex; align-items: center; gap: 3px; }
  .team-logo { display: inline-block; width: 28px; height: 18px; vertical-align: middle; object-fit: contain; }
  .progress-bar { flex: 1; background: #0f1115; border-radius: 6px; height: 14px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 6px; transition: width 0.5s; }
  .font-mono { font-family: monospace; }
  .flex { display: flex; } .items-center { align-items: center; } .gap-2 { gap: 8px; }
  .text-xs { font-size: 12px; } .text-right { text-align: right; }
  .team-badge { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; }
</style></head><body>

<!-- Driver Standings -->
<div class="card">
  <div class="collapse-header">
    <div class="flex items-center gap-2 flex-wrap min-w-0" style="flex:1">
      <h3 class="text-sm font-semibold whitespace-nowrap">👨‍👩‍👧‍👦 Driver Standings</h3>
      <span class="text-xs" style="color:#8b949e">22 drivers · season points</span>
    </div>
    <span class="collapse-icon">▼</span>
  </div>
  <div class="overflow-x-auto">
    <table class="standings-table">
      <thead><tr>
        <th class="col-pos">Pos</th>
        <th class="col-driver">Driver</th>
        <th class="col-country">Country</th>
        <th class="col-team">Team</th>
        <th class="col-progress">Points</th>
      </tr></thead>
      <tbody>
        <tr>
          <td class="col-pos">🥇</td>
          <td class="col-driver"><span style="display:inline-flex;align-items:center;gap:4px"><span style="background:#00d2be;width:8px;height:8px;border-radius:2px"></span><span style="color:#00d2be;font-weight:500">ANT</span></span></td>
          <td class="col-country"><span class="flag-text">🇮🇹 ITA</span></td>
          <td class="col-team"><span style="display:flex;align-items:center;gap:6px"><svg width="28" height="18" viewBox="0 0 28 18"><rect width="28" height="18" fill="#00d2be" rx="2"/><text x="14" y="13" text-anchor="middle" fill="white" font-size="8" font-weight="bold">M</text></svg></span></td>
          <td class="col-progress">
            <div class="flex items-center gap-2">
              <div class="progress-bar"><div class="progress-fill" style="width:100%;background:#00d2be"></div></div>
              <span class="font-mono text-xs" style="color:#00d2be;min-width:32px;text-align:right">132</span>
            </div>
          </td>
        </tr>
        <tr>
          <td class="col-pos">🥈</td>
          <td class="col-driver"><span style="display:inline-flex;align-items:center;gap:4px"><span style="background:#00d2be;width:8px;height:8px;border-radius:2px"></span><span style="color:#00d2be;font-weight:500">RUS</span></span></td>
          <td class="col-country"><span class="flag-text">🇬🇧 GBR</span></td>
          <td class="col-team"><span style="display:flex;align-items:center;gap:6px"><svg width="28" height="18" viewBox="0 0 28 18"><rect width="28" height="18" fill="#00d2be" rx="2"/><text x="14" y="13" text-anchor="middle" fill="white" font-size="8" font-weight="bold">M</text></svg></span></td>
          <td class="col-progress">
            <div class="flex items-center gap-2">
              <div class="progress-bar"><div class="progress-fill" style="width:67%;background:#00d2be"></div></div>
              <span class="font-mono text-xs" style="color:#00d2be;min-width:32px;text-align:right">88</span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Constructor Standings -->
<div class="card">
  <div class="collapse-header">
    <div class="flex items-center gap-2 flex-wrap min-w-0" style="flex:1">
      <h3 class="text-sm font-semibold whitespace-nowrap">🏭 Constructor Standings</h3>
      <span class="text-xs" style="color:#8b949e">11 teams · season points</span>
    </div>
    <span class="collapse-icon">▼</span>
  </div>
  <div class="overflow-x-auto">
    <table class="standings-table">
      <thead><tr>
        <th class="col-pos">Pos</th>
        <th class="col-country">Country</th>
        <th class="col-team">Team</th>
        <th class="col-progress">Points</th>
      </tr></thead>
      <tbody>
        <tr>
          <td class="col-pos">1</td>
          <td class="col-country"><span class="flag-text">🇩🇪 GER</span></td>
          <td class="col-team"><span style="display:flex;align-items:center;gap:6px"><svg width="28" height="18" viewBox="0 0 28 18"><rect width="28" height="18" fill="#00d2be" rx="2"/><text x="14" y="13" text-anchor="middle" fill="white" font-size="8" font-weight="bold">M</text></svg></span></td>
          <td class="col-progress">
            <div class="flex items-center gap-2">
              <div class="progress-bar"><div class="progress-fill" style="width:100%;background:#00d2be"></div></div>
              <span class="font-mono text-xs" style="color:#00d2be;min-width:32px;text-align:right">220</span>
            </div>
          </td>
        </tr>
        <tr>
          <td class="col-pos">2</td>
          <td class="col-country"><span class="flag-text">🇮🇹 ITA</span></td>
          <td class="col-team"><span style="display:flex;align-items:center;gap:6px"><svg width="28" height="18" viewBox="0 0 28 18"><rect width="28" height="18" fill="#dc0000" rx="2"/><text x="14" y="13" text-anchor="middle" fill="white" font-size="8" font-weight="bold">F</text></svg></span></td>
          <td class="col-progress">
            <div class="flex items-center gap-2">
              <div class="progress-bar"><div class="progress-fill" style="width:67%;background:#dc0000"></div></div>
              <span class="font-mono text-xs" style="color:#dc0000;min-width:32px;text-align:right">148</span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</body></html>
